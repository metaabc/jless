<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>筆記</title>
<link rel="stylesheet" href="theme.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f6f3ee;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--fs:1;}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 86px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(246,243,238,.97),rgba(246,243,238,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid rgba(0,0,0,.06);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,#f7c948,#f59e0b);color:#fff}
.gear{margin-left:auto;width:38px;height:38px;border-radius:11px;border:1px solid rgba(0,0,0,.08);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;user-select:none;-webkit-user-select:none}
.gear:active{transform:scale(.94)}
.search{margin:12px 16px 0;position:relative}
.search input{width:100%;border:1px solid rgba(0,0,0,.1);background:#fff;border-radius:14px;padding:11px 14px 11px 38px;font-size:calc(14px*var(--fs));font-family:inherit;outline:none}
.search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted)}
.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 0}
@media(max-width:380px){.notes{grid-template-columns:1fr}}
.notes.lv-list{grid-template-columns:1fr}
.notes .lv-grip{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:7px;background:rgba(0,0,0,.04);font-size:13px;color:var(--muted)}
.notes.lv-sorting .note .del{display:none}
.note .sel{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:rgba(255,255,255,.85);display:none;align-items:center;justify-content:center;font-size:13px;color:#fff;z-index:4}
.note.sel-on .sel{display:flex;background:#f59e0b;border-color:#f59e0b}
.notes.sel-mode .note{padding-left:36px}
.note{break-inside:avoid;background:#fff;border-radius:14px;padding:12px;margin:0 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;position:relative;border:1px solid rgba(0,0,0,.04)}
.note .t{font-weight:700;font-size:calc(14px*var(--fs));margin-bottom:4px;word-break:break-word}
.note .b{font-size:calc(13px*var(--fs));color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.note img{display:block;max-width:100%;max-height:160px;width:auto;height:auto;margin:8px auto 0;border-radius:9px;object-fit:contain}
.note .cl{margin-top:6px}
.note .cli{display:flex;align-items:center;gap:7px;font-size:calc(12.5px*var(--fs));color:var(--ink2);padding:2px 0}
.note .cli .cb{width:17px;height:17px;border-radius:5px;border:2px solid var(--muted);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.note .cli.done{color:var(--muted);text-decoration:line-through}
.note .cli.done .cb{background:#7bbf8a;border-color:#7bbf8a}
.note .prog{font-size:calc(11px*var(--fs));color:var(--muted);margin-top:5px;font-weight:600}
.note .pin-ic{font-size:calc(11px*var(--fs));color:#e0a63a;font-weight:700;margin-bottom:3px}
.note .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.04);color:var(--muted);display:none;align-items:center;justify-content:center;font-size:14px;cursor:pointer}
.note:active .del{display:flex}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:calc(13px*var(--fs));line-height:1.7}
.addbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:54px;height:54px;border-radius:50%;background:#f59e0b;color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:25;display:flex;align-items:center;justify-content:center}
.addbtn:active{transform:scale(.96)}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet .close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--muted);cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:10px}
.field input[type=text],.field textarea{border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:12px;padding:11px 12px;font-size:calc(14px*var(--fs));font-family:inherit;outline:none;width:100%;color:var(--ink);resize:vertical}
.attzone{border:1px dashed rgba(0,0,0,.18);border-radius:12px;padding:12px;text-align:center;color:var(--muted);font-size:calc(12.5px*var(--fs));background:#fff;cursor:pointer}
.thumbs{margin-top:8px}
.thumbs img{max-width:100%;border-radius:9px}
.thumbs .rm{display:inline-block;margin-top:6px;color:#cf5a4c;font-size:calc(12px*var(--fs));cursor:pointer;font-weight:600}
.palette{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.palette .pc{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.palette .pc.on{border-color:#333}
.row2{display:flex;gap:10px;align-items:center;margin:6px 0 10px}
.row2 label{font-size:calc(13px*var(--fs));color:var(--ink2)}
.switch{position:relative;width:42px;height:24px;border-radius:999px;background:#ccc;display:inline-block;transition:background .15s}
.switch.on{background:#7bbf8a}
.switch span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on span{left:20px}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:#f59e0b;color:#fff;box-shadow:0 5px 16px rgba(0,0,0,.18)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid rgba(0,0,0,.1);margin-top:8px;font-weight:700}
.btn.danger{background:#fdecea;color:#cf5a4c;border:1px solid #f6d4ce;margin-top:8px;font-weight:700}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:6px 2px 10px}
.mng{display:flex;align-items:center;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:11px;padding:8px 10px;margin-bottom:8px;font-size:calc(13.5px*var(--fs));font-weight:600}
.mng .x{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.1);background:#fff;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.listtabs{display:flex;gap:8px;margin:10px 16px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.listtabs::-webkit-scrollbar{display:none}
.listtabs .lt{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid rgba(0,0,0,.1);background:#fff;font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.listtabs .lt.on{background:#f59e0b;color:#fff;border-color:#f59e0b}
.listtabs .lt .cx{font-size:13px;opacity:.7}
.listtabs .add{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px dashed #f59e0b;color:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:rgba(245,158,11,.08);user-select:none;-webkit-user-select:none}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 72px);width:calc(100% - 32px);max-width:528px;background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none;align-items:center;gap:10px;padding:10px 14px;z-index:41}
.selbar.show{display:flex}
.selbar button{border:none;border-radius:11px;padding:10px 14px;font-size:calc(14px*var(--fs));font-weight:700;cursor:pointer;background:rgba(0,0,0,.06);color:var(--ink2);user-select:none;-webkit-user-select:none}
.selbar button.primary{background:#f59e0b;color:#fff}
.selbar #selCount{font-size:calc(13px*var(--fs));color:var(--ink2);font-weight:600;flex:1}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.pc:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="title"><span class="logo">📝</span>筆記</div>
    </div>
  </header>
  <div class="search"><span class="si">🔍</span><input type="text" id="q" placeholder="搜尋筆記…" oninput="renderNotes()"></div>
  <div class="listtabs" id="listtabs"></div>
  <div class="lv-bar" id="lvBar"></div>
  <div class="notes" id="notes"></div>
</div>

<nav class="bottombar">
  <button class="bb primary" onclick="openEditor()"><span class="ic">➕</span>新增</button>
  <button class="bb" onclick="exportNotesExcel()"><span class="ic">⬇️</span>匯出</button>
  <button class="bb" onclick="importNotesExcel()"><span class="ic">⬆️</span>匯入</button>
  <button class="bb" onclick="openSettings()"><span class="ic">⚙️</span>設定</button>
</nav>

<!-- 移動到其它清單 -->
<div class="mask" id="moveMask" onclick="if(event.target===this)closeMove()">
  <div class="sheet">
    <div class="close" onclick="closeMove()">✕</div>
    <h3 style="margin:2px 0 12px;font-size:calc(16px*var(--fs))">移動到清單</h3>
    <div id="moveLists"></div>
    <button class="btn ghost" onclick="closeMove()">取消</button>
  </div>
</div>

<!-- 選取工具列 -->
<div class="selbar" id="selBar">
  <button onclick="selAll()">全選</button>
  <span id="selCount">已選 0</span>
  <button class="primary" onclick="openMove()">移動到…</button>
  <button onclick="exitSel()">完成</button>
</div>

<div class="mask" id="editMask" onclick="if(event.target===this)closeEditor()">
  <div class="sheet">
    <div class="close" onclick="closeEditor()">✕</div>
    <h3 style="margin:2px 0 12px;font-size:calc(16px*var(--fs))" id="eTitle2">新增筆記</h3>
    <div class="palette" id="palette"></div>
    <div class="field"><input type="text" id="eTitle" placeholder="標題" maxlength="80"></div>
    <div class="row2"><span class="switch" id="eCheckSwitch" onclick="toggleCheckMode()"><span></span></span><label>清單模式（勾選項目）</label></div>
    <div class="field"><textarea id="eBody" placeholder="內容…" rows="4"></textarea></div>
    <div class="field">
      <label style="font-size:calc(12px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px">圖片（可貼上）</label>
      <div class="attzone" id="attZone" onclick="document.getElementById('eFile').click()">📎 點擊選取圖片，或直接貼上</div>
      <input type="file" id="eFile" accept="image/*" style="display:none" onchange="onPick(event)">
      <div class="thumbs" id="eThumb"></div>
    </div>
    <button class="btn ghost" id="pinToggleBtn" onclick="toggleEditPin()">📌 置頂</button>
    <button class="btn primary" onclick="saveEditor()">儲存</button>
    <button class="btn ghost" onclick="shareNote()">📤 分享筆記</button>
    <button class="btn ghost" onclick="closeEditor()">取消</button>
  </div>
</div>

<div class="mask" id="setMask" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <div class="close" onclick="closeSettings()">✕</div>
    <h3 style="margin:2px 0 12px;font-size:calc(16px*var(--fs))">設定與備份</h3>
    <div class="hint">備份會包含全部筆記與圖片。圖片存於本機，體積較大，請適量使用。</div>
    <button class="btn primary" onclick="exportNT()">⬇️ 匯出備份（本應用）</button>
    <button class="btn ghost" onclick="importNT()">⬆️ 匯入備份（取代）</button>
    <input type="file" id="ntFile" accept="application/json,.json" style="display:none" onchange="onNTFile(event)">
    <button class="btn danger" onclick="clearAll()">🗑️ 清除全部資料</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="ntExcel" accept=".csv,text/csv" style="display:none" onchange="onExcelFile(event)">

<!-- 匯入：選檔或貼網址 -->
<div class="mask" id="impModal" onclick="if(event.target===this)closeImp()">
  <div class="sheet">
    <div class="close" onclick="closeImp()">✕</div>
    <h3 style="margin:2px 0 12px;font-size:calc(16px*var(--fs))">匯入筆記（CSV / Excel）</h3>
    <div class="hint">可選取本機檔案，或貼上公開 CSV 網址後匯入。欄位：清單、標題、類型、內容、項目（項目以「|」分隔）。</div>
    <button class="btn primary" onclick="document.getElementById('ntExcel').click()">📁 選取本機檔案</button>
    <div class="field" style="margin-top:12px"><label>或貼上網址（CSV）</label><input type="text" id="impUrl" placeholder="https://.../notes.csv"></div>
    <button class="btn ghost" onclick="importNotesFromUrl()">🔗 由網址匯入</button>
    <button class="btn ghost" onclick="closeImp()">取消</button>
  </div>
</div>

<script>
var KEY='jless_note_v1';
var COLORS=['#ffffff','#fde7e9','#fdeccb','#eef6d8','#d7f0e6','#d8ecf7','#e7e0f7','#eceff1'];
var COLOR_LABEL=['白','粉','橙','青綠','綠','藍','紫','灰'];
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function nowStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function defaultState(){return {v:1,lists:[{id:uid(),name:'我的筆記',notes:[]}]};}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&Array.isArray(d.lists)&&d.lists.length)return d;if(d&&Array.isArray(d.notes)){var st=defaultState();st.lists[0].notes=d.notes;return st;}}}catch(e){}return defaultState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('儲存失敗：可能圖片過大');}}
var S=load();
var curList=S.lists[0].id;
var editId=null, editColor=COLORS[0], editCheck=false, editImg='', editItems=[], editPin=false;
var selMode=false, selIds={};

function curListObj(){for(var i=0;i<S.lists.length;i++)if(S.lists[i].id===curList)return S.lists[i];return S.lists[0];}
function byId(id){for(var i=0;i<S.lists.length;i++){var n=S.lists[i].notes.filter(function(x){return x.id===id;})[0];if(n)return n;}return null;}

/* 清單 */
function renderTabs(){
  var w=document.getElementById('listtabs');w.innerHTML='';
  S.lists.forEach(function(l){
    var d=document.createElement('div');d.className='lt'+(l.id===curList?' on':'');
    d.innerHTML='<span>'+esc(l.name)+'</span>'+(S.lists.length>1?'<span class="cx" onclick="delList(\''+l.id+'\',event)">✕</span>':'');
    d.onclick=function(e){if(e.target.classList.contains('cx'))return;curList=l.id;renderTabs();renderNotes();};
    w.appendChild(d);
  });
  var a=document.createElement('div');a.className='add';a.textContent='＋';a.title='新增清單';a.onclick=addList;w.appendChild(a);
}
function addList(){var name=prompt('新清單名稱：','新清單');if(name===null)return;name=name.trim();if(!name)return;var l={id:uid(),name:name.slice(0,20),notes:[]};S.lists.push(l);curList=l.id;save();renderTabs();renderNotes();toast('已新增清單');}
function delList(id,ev){ev.stopPropagation();if(S.lists.length<=1){toast('至少保留一個清單');return;}var l=S.lists.filter(function(x){return x.id===id;})[0];if(!confirm('刪除清單「'+(l?l.name:'')+'」及其筆記？'))return;S.lists=S.lists.filter(function(x){return x.id!==id;});curList=S.lists[0].id;save();renderTabs();renderNotes();}

/* 選取模式（移動用） */
function toggleSel(){selMode=!selMode;if(!selMode)selIds={};document.getElementById('notes').classList.toggle('sel-mode',selMode);renderNotes();}
function tapNote(n){if(selMode){if(selIds[n.id])delete selIds[n.id];else selIds[n.id]=true;renderNotes();return;}openEditor(n.id);}
function selAll(){var l=curListObj();selIds={};l.notes.forEach(function(n){selIds[n.id]=true;});renderNotes();}
function exitSel(){selMode=false;selIds={};document.getElementById('notes').classList.remove('sel-mode');renderNotes();}
function updateSelBar(){var n=Object.keys(selIds).filter(function(k){return selIds[k];}).length;document.getElementById('selCount').textContent='已選 '+n;document.getElementById('selBar').classList.toggle('show',selMode);}
function openMove(){var n=Object.keys(selIds).filter(function(k){return selIds[k];}).length;if(!n){toast('請先選取筆記');return;}var box=document.getElementById('moveLists');box.innerHTML='';var others=S.lists.filter(function(l){return l.id!==curList;});if(!others.length){box.innerHTML='<div class="mini" style="text-align:center">目前沒有其它清單，請先新增清單。</div>';}others.forEach(function(l){var b=document.createElement('button');b.className='btn ghost';b.style.marginTop='8px';b.textContent='移至「'+l.name+'」（'+l.notes.length+'）';b.onclick=function(){doMove(l.id);};box.appendChild(b);});document.getElementById('moveMask').classList.add('show');}
function closeMove(){document.getElementById('moveMask').classList.remove('show');}
function doMove(targetId){var src=curListObj(),tgt=null;for(var i=0;i<S.lists.length;i++)if(S.lists[i].id===targetId)tgt=S.lists[i];if(!tgt)return;var moved=src.notes.filter(function(n){return selIds[n.id];});src.notes=src.notes.filter(function(n){return !selIds[n.id];});tgt.notes=tgt.notes.concat(moved);selIds={};save();closeMove();exitSel();renderNotes();toast('已移動 '+moved.length+' 則');}

/* 筆記渲染 */
function renderNotes(){
  var box=document.getElementById('notes');var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var l=curListObj();
  var arr=l.notes.slice();
  if(q)arr=arr.filter(function(n){return (n.title+' '+(n.body||'')+' '+(n.items?n.items.map(function(i){return i.text;}).join(' '):'')).toLowerCase().indexOf(q)>=0;});
  if(!arr.length){box.innerHTML=selMode?'<div class="empty">選取模式：此清單沒有筆記</div>':(q?'<div class="empty">沒有相符的筆記</div>':'<div class="empty">這個清單還沒有筆記。<br>按右下角「＋」新增。</div>');updateSelBar();return;}
  box.innerHTML='';
  arr.forEach(function(n){box.appendChild(noteEl(n));});
  updateSelBar();
}
function noteEl(n){
  var inner='';
  if(selMode)inner+='<div class="sel">'+(selIds[n.id]?'✓':'')+'</div>';
  if(n.pin)inner+='<div class="pin-ic">📌 置頂</div>';
  var hasContent=!!(n.title||n.img||(n.items&&n.items.length)||n.body);
  if(n.title)inner+='<div class="t">'+esc(n.title)+'</div>';
  if(n.img)inner+='<img src="'+n.img+'">';
  if(n.items&&n.items.length){
    var done=n.items.filter(function(i){return i.done;}).length;
    inner+='<div class="cl">'+n.items.map(function(i){return '<div class="cli'+(i.done?' done':'')+'" onclick="toggleItem(event,\''+n.id+'\',\''+i.id+'\')"><span class="cb">'+(i.done?'✓':'')+'</span>'+esc(i.text)+'</div>';}).join('')+'</div>';
    inner+='<div class="prog">已完成 '+done+' / '+n.items.length+'</div>';
  }else if(n.body){
    inner+='<div class="b">'+esc(n.body)+'</div>';
  }
  if(!hasContent)inner+='<div class="b" style="color:#bbb">（空白筆記）</div>';
  var d=document.createElement('div');
  d.className='note lv-item'+(selMode&&selIds[n.id]?' sel-on':'');
  d.dataset.id=n.id;
  d.style.background=n.color||'#fff';
  d.innerHTML=inner+'<div class="lv-grip" title="拖動排序">⋮⋮</div><div class="del" onclick="delNote(\''+n.id+'\')">🗑</div>';
  d.onclick=function(e){if(window.noteSorting)return;if(e.target.classList.contains('del')||e.target.classList.contains('cli')||e.target.classList.contains('cb'))return;tapNote(n);};
  return d;
}
function toggleItem(ev,id,iid){ev.stopPropagation();var n=byId(id);if(!n)return;var it=n.items.filter(function(x){return x.id===iid;})[0];if(it){it.done=!it.done;save();renderNotes();}}
function delNote(id){if(!confirm('刪除這則筆記？'))return;for(var i=0;i<S.lists.length;i++){var before=S.lists[i].notes.length;S.lists[i].notes=S.lists[i].notes.filter(function(x){return x.id!==id;});if(S.lists[i].notes.length!==before){save();renderNotes();return;}}}

  else{var nl=curListObj();var note={id:uid(),title:title,body:editCheck?'':body.trim(),color:editColor,img:editImg,items:items,pin:editPin,ts:Date.now()};if(editPin)nl.notes.unshift(note);else nl.notes.push(note);}
  save();closeEditor();renderNotes();toast('已儲存');

/* 分享筆記（渲染成圖片，可含圖片） */
function wrapText(ctx,text,maxW,fontSize){
  ctx.font=fontSize+'px sans-serif';
  var out=[],paras=String(text||'').split('\n');
  paras.forEach(function(p){
    var line='';
    for(var i=0;i<p.length;i++){
      var ch=p[i];
      if(ctx.measureText(line+ch).width>maxW && line){out.push(line);line=ch;}
      else line+=ch;
    }
    if(line)out.push(line);
  });
  return out;
}
function drawNoteImage(n,cb){
  var W=720,P=34,scale=2;
  var c=document.createElement('canvas');var x=c.getContext('2d');
  var titleH=n.title?46:0, padTop=26, padBot=38, lineH=27;
  x.font='18px sans-serif';
  var lines=[];
  if(n.items&&n.items.length){ n.items.forEach(function(it){ lines=lines.concat(wrapText(x,(it.done?'✓ ':'• ')+it.text,W-P*2,18)); }); }
  else if(n.body){ lines=lines.concat(wrapText(x,n.body,W-P*2,18)); }
  var textH=lines.length*lineH;
  function done(img,iw,ih){
    var imgH=0,dw=0,dh=0;
    if(img){ dw=W-P*2; dh=Math.round(ih*(dw/iw)); if(dh>360)dh=360; imgH=dh+12; }
    var H=padTop+titleH+10+textH+imgH+padBot;
    c.width=W*scale;c.height=H*scale;var x2=c.getContext('2d');x2.scale(scale,scale);
    x2.fillStyle=(n.color&&n.color!=='#ffffff')?n.color:'#ffffff';x2.fillRect(0,0,W,H);
    x2.textAlign='left';var yy=padTop;
    if(n.title){x2.fillStyle='#3b2530';x2.font='bold 28px sans-serif';x2.fillText(JLessShare.clip(n.title,30),P,yy+28);yy+=titleH;}
    yy+=10;
    x2.fillStyle='#5f4b55';x2.font='18px sans-serif';
    lines.forEach(function(ln){x2.fillText(ln,P,yy);yy+=lineH;});
    if(img){ x2.drawImage(img,P,yy,dw,dh); }
    cb(c);
  }
  if(n.img){
    var im=new Image();
    im.onload=function(){ done(im,im.width,im.height); };
    im.onerror=function(){ done(null); };
    im.src=n.img;
  }else{ done(null); }
}
function tsToStr(ts){var d=new Date(ts||Date.now());function p(x){return (x<10?'0':'')+x;}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function noteText(n){
  var s='';
  if(n.title)s+=n.title+'\n';
  if(n.items&&n.items.length){n.items.forEach(function(it){s+=(it.done?'[✓] ':'[ ] ')+it.text+'\n';});}
  else if(n.body){s+=n.body+'\n';}
  return (s||'(空筆記)').trim();
}
function noteRow(n,listName){
  var type=(n.items&&n.items.length)?'清單':'文字';
  var items=(n.items&&n.items.length)?n.items.map(function(i){return (i.done?'✓ ':'')+i.text;}).join(' | '):'';
  return [listName,n.title||'',type,n.body||'',items,tsToStr(n.ts||Date.now())];
}
function notesToCSV(lists){
  var rows=[['清單','標題','類型','內容','項目','建立時間']];
  lists.forEach(function(l){l.notes.forEach(function(n){rows.push(noteRow(n,l.name));});});
  return rows;
}
function exportNotesExcel(){
  if(!window.JLessShare){toast('分享模組未載入');return;}
  var rows=notesToCSV(S.lists);
  if(rows.length<=1){toast('沒有筆記可匯出');return;}
  JLessShare.shareCSV(rows,'note-'+nowStr()+'.csv',function(ok){toast(ok?'已開啟分享':'已匯出 Excel (CSV)');});
}
function importNotesExcel(){var el=document.getElementById('ntExcel');if(el)el.click();}
function parseCSV(text){
  text=String(text||'').replace(/^﻿/,'');
  var rows=[],i=0,field='',row=[],inq=false;
  while(i<text.length){
    var ch=text[i];
    if(inq){
      if(ch==='"'){if(text[i+1]==='"'){field+='"';i+=2;continue;}inq=false;i++;continue;}
      field+=ch;i++;continue;
    }
    if(ch==='"'){inq=true;i++;continue;}
    if(ch===','){row.push(field);field='';i++;continue;}
    if(ch==='\r'){i++;continue;}
    if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=ch;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}
function importNotesExcel(){document.getElementById('impModal').classList.add('show');var u=document.getElementById('impUrl');if(u)u.value='';}
function closeImp(){document.getElementById('impModal').classList.remove('show');}
function importNotesFromText(text){
  try{
    var rows=parseCSV(text);
    if(!rows.length){toast('檔案沒有資料');return;}
    var head=rows[0].map(function(h){return String(h||'').trim();});
    var cols={title:-1,body:-1,items:-1,list:-1};
    head.forEach(function(h,i){
      if(h.indexOf('標題')>=0)cols.title=i;
      else if(h.indexOf('清單')>=0)cols.list=i;
      else if(h.indexOf('項目')>=0)cols.items=i;
      else if(h.indexOf('內容')>=0)cols.body=i;
    });
    var start=(cols.title>=0||cols.body>=0||cols.list>=0)?1:0;
    var added=0;
    for(var i2=start;i2<rows.length;i2++){
      var parts=rows[i2];
      if(!parts||!parts.length)continue;
      var listName=cols.list>=0?(parts[cols.list]||'').trim():'';
      var title=cols.title>=0?(parts[cols.title]||'').trim():'';
      var body=cols.body>=0?(parts[cols.body]||'').trim():'';
      var itemsStr=cols.items>=0?(parts[cols.items]||'').trim():'';
      if(!title&&!body&&!itemsStr)continue;
      var target=curListObj();
      if(listName){var found=null;for(var k=0;k<S.lists.length;k++){if(S.lists[k].name===listName){found=S.lists[k];break;}}if(!found){found={id:uid(),name:listName.slice(0,20),notes:[]};S.lists.push(found);}target=found;}
      var items=null;
      if(itemsStr){items=itemsStr.split('|').map(function(s){s=String(s).trim();if(!s)return null;var done=s.indexOf('✓')===0;return {id:uid(),text:s.replace(/^✓\s*/,''),done:done};}).filter(Boolean);}
      target.notes.push({id:uid(),title:title,body:items?body:(body||''),color:'#fff',img:'',items:items,ts:Date.now()});
      added++;
    }
    save();renderTabs();renderNotes();
    toast(added?('已匯入 '+added+' 則筆記'):'沒有可匯入的資料');
  }catch(e){alert('匯入失敗：'+e.message);}
}
function onExcelFile(ev){
  var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  var r=new FileReader();
  r.onload=function(){ importNotesFromText(r.result||''); };
  r.readAsText(f,'utf-8');
}
function importNotesFromUrl(){
  var url=document.getElementById('impUrl').value.trim();
  if(!url){toast('請先貼上網址');return;}
  toast('取得中…');
  fetch(url).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(t){closeImp();importNotesFromText(t);}).catch(function(e){alert('無法取得網址內容：'+((e&&e.message)||e));});
}
function shareNote(){
  if(!window.JLessShare){toast('分享模組未載入');return;}
  var n=null;
  if(editId){n=byId(editId);}
  if(!n){
    var title=document.getElementById('eTitle').value.trim();
    var body=document.getElementById('eBody').value;
    var items=null;
    if(editCheck){items=body.split('\n').map(function(s){return s.trim();}).filter(function(s){return s;}).map(function(s){return {text:s};});}
    n={title:title,body:editCheck?'':body,img:editImg,color:editColor,items:items};
  }
  if(!n.title&&!n.body&&!n.img&&!(n.items&&n.items.length)){toast('筆記內容為空');return;}
  var draft=n;
  JLessShare.openSheet({
    title:'分享筆記',
    image:function(){drawNoteImage(draft,function(canvas){JLessShare.shareImage(canvas,'note-'+nowStr()+'.png',function(ok){toast(ok?'已開啟分享':'已儲存筆記圖片');});});},
    text:function(){JLessShare.shareText('筆記 · '+(draft.title||'(無標題)'),noteText(draft),function(ok){toast(ok?'已開啟分享':'已複製文字');});},
    excel:function(){var l=curListObj();JLessShare.shareCSV(notesToCSV([l]),'note-'+l.name+'-'+nowStr()+'.csv',function(ok){toast(ok?'已開啟分享':'已匯出清單 (CSV)');});}
  });
}
