<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>計算器</title>
<link rel="stylesheet" href="theme.css">
<style>
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--fs:1;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 90px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.content{padding:14px 16px 0}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:10px;font-size:calc(13.5px*var(--fs));font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:0 2px 8px rgba(120,60,80,.1)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(120,60,80,.06);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{font-size:calc(12.5px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:calc(15px*var(--fs));background:var(--bg);outline:none;color:var(--ink);-webkit-appearance:none}
.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:calc(15px*var(--fs));background:var(--bg);outline:none;color:var(--ink);-webkit-appearance:none}
.field input:focus{border-color:var(--accent)}
.field select:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(120,60,80,.2)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);margin-top:8px;font-weight:700}
.btn:active{transform:scale(.98)}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:2px 2px 10px}
.result{display:none;background:linear-gradient(135deg,var(--accent-soft),var(--line2));border:1px solid var(--accent-line);border-radius:16px;padding:16px;margin-top:4px}
.result.show{display:block}
.result .big{font-size:calc(30px*var(--fs));font-weight:800;color:var(--accent);line-height:1.1}
.result .lbl{font-size:calc(12.5px*var(--fs));color:var(--ink2);font-weight:700}
.result .sub{display:flex;justify-content:space-between;margin-top:10px;font-size:calc(13px*var(--fs));color:var(--ink2)}
.result .sub b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header><div class="topbar"><div class="title"><span class="logo">🧮</span>計算器</div></div></header>
  <div class="content">
    <div class="seg">
      <button id="segRent" class="on" onclick="setMode('rent')">🏠 租金回報率</button>
      <button id="segDep" onclick="setMode('dep')">📈 定期計算</button>
      <button id="segUnit" onclick="setMode('unit')">📐 單位換算</button>
    </div>

    <!-- 租金回報率 -->
    <div id="paneRent">
      <div class="card">
        <div class="field"><label>物業樓價</label><input type="number" id="rPrice" inputmode="decimal" placeholder="例如 5000000"></div>
        <div class="row2">
          <div class="field"><label>月租金</label><input type="number" id="rRent" inputmode="decimal" placeholder="例如 18000"></div>
          <div class="field"><label>空置率 %</label><input type="number" id="rVac" inputmode="decimal" placeholder="例如 5"></div>
        </div>
        <div class="field"><label>每年其他支出（管理費／差餉／維修等）</label><input type="number" id="rExp" inputmode="decimal" placeholder="例如 24000"></div>
        <button class="btn primary" onclick="calcRent()">計算回報率</button>
        <div class="hint">回報率 =（年租金收入 − 年其他支出）÷ 樓價。年租金收入已扣除空置率。</div>
      </div>
      <div class="result" id="rResult">
        <div class="lbl">年化租金回報率</div>
        <div class="big" id="rRate">—</div>
        <div class="sub"><span>年租金收入</span><b id="rIncome">—</b></div>
        <div class="sub"><span>年淨收入</span><b id="rNet">—</b></div>
      </div>
    </div>

    <!-- 定期計算 -->
    <div id="paneDep" style="display:none">
      <div class="card">
        <div class="row2">
          <div class="field"><label>期初本金</label><input type="number" id="dPrincipal" inputmode="decimal" placeholder="例如 100000"></div>
          <div class="field"><label>每月投入</label><input type="number" id="dMonthly" inputmode="decimal" placeholder="例如 5000"></div>
        </div>
        <div class="row2">
          <div class="field"><label>年利率 %</label><input type="number" id="dRate" inputmode="decimal" placeholder="例如 3.5"></div>
          <div class="field"><label>年期（年）</label><input type="number" id="dYears" inputmode="decimal" placeholder="例如 5"></div>
        </div>
        <button class="btn primary" onclick="calcDep()">計算到期總值</button>
        <div class="hint">複利按月計息；本金與每月投入於期末的本利和。</div>
      </div>
      <div class="result" id="dResult">
        <div class="lbl">到期總值</div>
        <div class="big" id="dFv">—</div>
        <div class="sub"><span>總投入</span><b id="dInvested">—</b></div>
        <div class="sub"><span>總利息</span><b id="dInterest">—</b></div>
      </div>
    </div>

    <!-- 單位換算 -->
    <div id="paneUnit" style="display:none">
      <div class="card">
        <div class="field"><label>類別</label>
          <select id="uCat" onchange="uCatChange()"></select>
        </div>
        <div class="row2">
          <div class="field"><label>數值</label><input type="number" id="uVal" inputmode="decimal" oninput="uCalc()" placeholder="輸入數值"></div>
          <div class="field"><label>來源單位</label><select id="uFrom" onchange="uCalc()"></select></div>
        </div>
        <div class="field"><label>換算為</label>
          <div class="row2">
            <select id="uTo" onchange="uCalc()"></select>
            <button class="btn ghost" style="margin-top:0;flex:0 0 auto;width:auto;padding:0 16px" onclick="uSwap()">⇄ 互換</button>
          </div>
        </div>
        <div class="result show" id="uResult">
          <div class="lbl">結果</div>
          <div class="big" id="uOut">—</div>
        </div>
      </div>
    </div>
  </div>
</div>

<nav class="bottombar">
  <button class="bb primary" onclick="shareCalc()"><span class="ic">📤</span>分享</button>
  <button class="bb" onclick="resetCalc()"><span class="ic">♻️</span>重設</button>
</nav>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script src="share.js"></script>
<script>
function setMode(m){
  document.getElementById('segRent').classList.toggle('on', m==='rent');
  document.getElementById('segDep').classList.toggle('on', m==='dep');
  document.getElementById('segUnit').classList.toggle('on', m==='unit');
  document.getElementById('paneRent').style.display = m==='rent'?'block':'none';
  document.getElementById('paneDep').style.display = m==='dep'?'block':'none';
  document.getElementById('paneUnit').style.display = m==='unit'?'block':'none';
  curMode=m;
}
var curMode='rent';

/* ===== 單位換算 ===== */
var UCAT = {
  len:{name:'長度', u:[['mm',0.001],['cm',0.01],['m',1],['km',1000],['in',0.0254],['ft',0.3048],['yd',0.9144],['mi',1609.344],['nmi',1852],['里',500],['丈',10/3],['尺',1/3],['寸',1/30]]},
  wt:{name:'重量', u:[['mg',1e-6],['g',1e-3],['kg',1],['t',1000],['台斤',0.6],['台兩',0.0375],['台錢',0.00375],['市斤',0.5],['lb',0.45359237],['oz',0.0283495231]]},
  temp:{name:'溫度', special:true, u:['°C','°F','K']},
  area:{name:'面積', u:[['mm²',1e-6],['cm²',1e-4],['m²',1],['km²',1e6],['公頃',10000],['坪',3.305785],['平方呎',0.09290304],['英畝',4046.8564224],['畝',666.6666667]]},
  vol:{name:'容量', u:[['mL',0.001],['cm³',0.001],['L',1],['m³',1000],['美加侖',3.785411784],['英加侖',4.54609],['杯',0.2365882365],['茶匙',0.00492892159],['湯匙',0.0147867648]]},
  time:{name:'時間', u:[['秒',1],['分',60],['時',3600],['天',86400],['週',604800]]},
  speed:{name:'速度', u:[['m/s',1],['km/h',0.2777777778],['mph',0.44704],['節',0.5144444444]]},
  data:{name:'數據', u:[['bit',0.125],['B',1],['KB',1024],['MB',1048576],['GB',1073741824],['TB',1099511627776]]}
};
function uInit(){
  var sel=document.getElementById('uCat');
  sel.innerHTML=Object.keys(UCAT).map(function(k){return '<option value="'+k+'">'+UCAT[k].name+'</option>';}).join('');
  uCatChange();
}
function uCatChange(){
  var k=document.getElementById('uCat').value, cat=UCAT[k];
  var html=cat.u.map(function(x){var v=(cat.special?x:x[0]);return '<option value="'+v+'">'+v+'</option>';}).join('');
  document.getElementById('uFrom').innerHTML=html;
  document.getElementById('uTo').innerHTML=html;
  if(cat.u.length>1) document.getElementById('uTo').selectedIndex=1;
  uCalc();
}
function uTemp(v,from,to){
  var c = from==='°C'?v : from==='°F'?(v-32)*5/9 : v-273.15;
  return to==='°C'?c : to==='°F'?c*9/5+32 : c+273.15;
}
function uCalc(){
  var k=document.getElementById('uCat').value, cat=UCAT[k];
  var v=parseFloat(document.getElementById('uVal').value);
  var from=document.getElementById('uFrom').value, to=document.getElementById('uTo').value;
  if(isNaN(v)){ document.getElementById('uOut').textContent='—'; lastUnit=null; return; }
  var out = cat.special
    ? uTemp(v,from,to)
    : (function(){ var fb=0,tb=0; cat.u.forEach(function(x){ if(x[0]===from)fb=x[1]; if(x[0]===to)tb=x[1]; }); return v*fb/tb; })();
  document.getElementById('uOut').textContent=fmt(out);
  lastUnit={cat:UCAT[k].name,v:v,from:from,to:to,out:out};
}
function uSwap(){
  var a=document.getElementById('uFrom'), b=document.getElementById('uTo');
  var t=a.value; a.value=b.value; b.value=t; uCalc();
}
var lastUnit=null;
function num(id){var v=parseFloat(document.getElementById(id).value);return isNaN(v)?0:v;}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-Hant',{maximumFractionDigits:2});}
function calcRent(){
  var P=num('rPrice'), R=num('rRent'), E=num('rExp'), v=num('rVac');
  if(P<=0){toast('請填寫樓價');return;}
  var income=R*12*(1-v/100);
  var net=income-E;
  var rate=net/P*100;
  document.getElementById('rIncome').textContent='$'+fmt(income);
  document.getElementById('rNet').textContent='$'+fmt(net);
  document.getElementById('rRate').textContent=fmt(rate)+'%';
  document.getElementById('rResult').classList.add('show');
  lastRent={P:P,R:R,E:E,v:v,income:income,net:net,rate:rate};
}
function calcDep(){
  var P0=num('dPrincipal'), M=num('dMonthly'), r=num('dRate')/100, n=num('dYears');
  if(n<=0){toast('請填寫年期');return;}
  var months=n*12, rm=r/12;
  var fvPeriodic = rm>0 ? M*((Math.pow(1+rm,months)-1)/rm) : M*months;
  var fv = P0*Math.pow(1+rm,months) + fvPeriodic;
  var invested = P0 + M*months;
  var interest = fv - invested;
  document.getElementById('dInvested').textContent='$'+fmt(invested);
  document.getElementById('dInterest').textContent='$'+fmt(interest);
  document.getElementById('dFv').textContent='$'+fmt(fv);
  document.getElementById('dResult').classList.add('show');
  lastDep={P0:P0,M:M,r:num('dRate'),n:n,fv:fv,invested:invested,interest:interest};
}
var lastRent=null, lastDep=null;
function shareCalc(){
  var title, body;
  if(curMode==='unit'){
    if(!lastUnit){toast('請先輸入數值');return;}
    title='單位換算';
    body=lastUnit.cat+'：\n'+fmt(lastUnit.v)+' '+lastUnit.from+' ＝ '+fmt(lastUnit.out)+' '+lastUnit.to;
  } else if(curMode==='rent'){
    if(!lastRent){toast('請先計算');return;}
    title='租金回報率計算';
    body='物業樓價：$'+fmt(lastRent.P)+'\n月租金：$'+fmt(lastRent.R)+'（空置率 '+lastRent.v+'%）\n年其他支出：$'+fmt(lastRent.E)+
         '\n—\n年租金收入：$'+fmt(lastRent.income)+'\n年淨收入：$'+fmt(lastRent.net)+'\n年化回報率：'+fmt(lastRent.rate)+'%';
  }else{
    if(!lastDep){toast('請先計算');return;}
    title='定期計算';
    body='期初本金：$'+fmt(lastDep.P0)+'\n每月投入：$'+fmt(lastDep.M)+'\n年利率：'+lastDep.r+'%　年期：'+lastDep.n+' 年\n—\n總投入：$'+fmt(lastDep.invested)+
         '\n總利息：$'+fmt(lastDep.interest)+'\n到期總值：$'+fmt(lastDep.fv);
  }
  if(window.JLessShare){ JLessShare.shareText(title, body, function(ok){toast(ok?'已開啟分享':'已複製文字');}); }
  else { navigator.clipboard && navigator.clipboard.writeText(title+'\n'+body); toast('已複製'); }
}
function resetCalc(){
  ['rPrice','rRent','rVac','rExp','dPrincipal','dMonthly','dRate','dYears'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('rResult').classList.remove('show');
  document.getElementById('dResult').classList.remove('show');
  document.getElementById('uVal').value='';
  document.getElementById('uOut').textContent='—';
  if(document.getElementById('uCat')) uCatChange();
  lastRent=null;lastDep=null;lastUnit=null;toast('已重設');
}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}
uInit();
</script>
</body>
</html>
