<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>計時 · 倒數 · 番茄鐘</title>
<!-- Google Analytics（統計；不傳個人／敏感資料，離線時靜默） -->
<script defer src="ga.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--accent:#c23b6a;--accent2:#a8305c;--accent-soft:#fdeaf2;--accent-line:#f4c9da;--teal:#0f766e;--gold:#d97706;--fs:1}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 24px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.content{padding:16px 16px 0}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px;margin-bottom:18px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:11px 6px;font-size:calc(13.5px*var(--fs));font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--panel);color:var(--accent);box-shadow:0 2px 8px rgba(120,60,80,.1)}

.clock{text-align:center;margin:6px 0 4px;position:relative}
.clock .ring{position:absolute;inset:-10px;border-radius:50%;border:3px solid transparent}
.clock.flash .ring{border-color:var(--accent);animation:flash 1s ease 3}
@keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
.clock .time{font-size:calc(58px*var(--fs));font-weight:800;letter-spacing:2px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.clock .phase{font-size:calc(14px*var(--fs));font-weight:700;color:var(--accent);margin-top:4px;min-height:18px}
.clock .sub{font-size:calc(12px*var(--fs));color:var(--muted);margin-top:2px}

.controls{display:flex;gap:10px;margin:18px 0}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:calc(16px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(120,60,80,.22)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);font-weight:700}
.btn:active{transform:scale(.98)}
.btn.sm{flex:1;padding:12px;font-size:calc(14px*var(--fs));font-weight:700;background:var(--line2);color:var(--ink2);border:none;box-shadow:none;border-radius:12px}
.btn.on{background:var(--accent);color:#fff}

.pane{display:none}
.pane.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(120,60,80,.06);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:calc(13.5px*var(--fs));color:var(--ink2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-size:calc(13.5px*var(--fs));font-weight:700;color:var(--ink2);cursor:pointer;user-select:none;-webkit-user-select:none}
.chip:active{background:var(--line2)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.field{margin-bottom:10px}
.field label{font-size:calc(12.5px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:calc(15px*var(--fs));background:var(--bg);outline:none;color:var(--ink);-webkit-appearance:none}
.field input:focus{border-color:var(--accent)}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:2px 2px 8px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:calc(13.5px*var(--fs));color:var(--ink2);font-weight:600;cursor:pointer;margin:2px 0}
.switch-row input{width:46px;height:26px;-webkit-appearance:none;appearance:none;background:var(--line);
  border-radius:999px;position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto;margin:0}
.switch-row input:checked{background:var(--accent)}
.switch-row input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch-row input:checked::after{left:23px}
.laps{list-style:none;margin:8px 0 0;padding:0;max-height:30vh;overflow:auto}
.laps li{display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid var(--line2);font-size:calc(13.5px*var(--fs))}
.laps li b{color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 30px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header><div class="topbar"><div class="title"><span class="logo">⏱️</span>計時 · 倒數 · 番茄鐘</div></div></header>
  <div class="content">

    <div class="seg">
      <button id="segSw" class="on" onclick="setMode('sw')">⏱ 計時</button>
      <button id="segCd" onclick="setMode('cd')">⏳ 倒數</button>
      <button id="segPm" onclick="setMode('pm')">🍅 番茄鐘</button>
    </div>

    <!-- 共用顯示 -->
    <div class="clock" id="clock">
      <div class="ring"></div>
      <div class="time" id="timeText">00:00</div>
      <div class="phase" id="phaseText"></div>
      <div class="sub" id="subText"></div>
    </div>

    <div class="controls">
      <button class="btn primary" id="startBtn" onclick="startPause()">▶ 開始</button>
      <button class="btn ghost" style="flex:0 0 38%" onclick="resetTimer()">↺ 重設</button>
    </div>

    <!-- 計時 -->
    <div class="pane on" id="paneSw">
      <div class="card">
        <h3>⏱ 碼表（計時）</h3>
        <div class="controls" style="margin:6px 0 0">
          <button class="btn sm" onclick="addLap()">⏱ 分段</button>
          <button class="btn sm" onclick="clearLaps()">清除分段</button>
        </div>
        <ul class="laps" id="lapList"></ul>
        <div class="hint">適合一般計時：煮飯過程分段、運動計時等。</div>
      </div>
    </div>

    <!-- 倒數 -->
    <div class="pane" id="paneCd">
      <div class="card">
        <h3>⏳ 倒數計時</h3>
        <div class="chips" id="cdChips">
          <span class="chip" data-min="30" onclick="cdPreset(30,this)">🍚 煮飯 30分</span>
          <span class="chip" data-min="60" onclick="cdPreset(60,this)">📅 開會 60分</span>
          <span class="chip" data-min="25" onclick="cdPreset(25,this)">🎯 專注 25分</span>
          <span class="chip" data-min="5" onclick="cdPreset(5,this)">☕ 休息 5分</span>
        </div>
        <div class="row2">
          <div class="field"><label>分鐘</label><input type="number" id="cdMin" inputmode="numeric" value="25" min="0"></div>
          <div class="field"><label>秒</label><input type="number" id="cdSec" inputmode="numeric" value="0" min="0" max="59"></div>
        </div>
        <button class="btn ghost" onclick="cdSet()">⚙ 設定倒數時間</button>
        <div class="hint">點上方快捷，或自訂分秒後按「設定倒數時間」，再按開始。</div>
      </div>
    </div>

    <!-- 番茄鐘 -->
    <div class="card" id="panePm" style="display:none">
      <h3>🍅 番茄鐘</h3>
      <div class="hint" style="margin-bottom:4px">自動循環：專注 25 分 → 休息 5 分；每完成 4 輪專注，長休息 15 分。</div>
      <div class="chips">
        <span class="chip" onclick="pmSet(25,5,15,this)">預設 25/5</span>
        <span class="chip" onclick="pmSet(50,10,30,this)">長時 50/10</span>
        <span class="chip" onclick="pmSet(15,3,15,this)">短促 15/3</span>
      </div>
    </div>

    <!-- 提示設定 -->
    <div class="card" id="soundCard">
      <h3>🔔 提示設定</h3>
      <label class="switch-row" for="soundToggle">
        <span>夠鐘播音提示（倒數／番茄結束時響一聲）</span>
        <input type="checkbox" id="soundToggle" onchange="toggleSound(this.checked)">
      </label>
      <div class="hint" style="margin-bottom:0">關閉則只在畫面閃爍與彈出提示，不發聲；開啟時結束僅響一聲清脆提示。</div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
/* ===== 狀態 ===== */
var mode='sw';
var running=false;
var timerId=null;
// 計時（碼表）
var swElapsed=0, swStart=0, laps=[];
// 倒數
var cdDuration=25*60000, cdRemaining=25*60000, cdEnd=0;
// 番茄鐘
var pmWork=25*60000, pmBreak=5*60000, pmLong=15*60000;
var pmPhase='work', pmRound=0, pmRemaining=25*60000, pmEnd=0;

/* ===== 顯示 ===== */
function fmtTime(ms,withDeci){
  if(ms<0)ms=0;
  var tot=Math.floor(ms/1000);
  var h=Math.floor(tot/3600), m=Math.floor((tot%3600)/60), s=tot%60;
  var pad=function(x){return (x<10?'0':'')+x;};
  var out=(h>0? h+':' : '') + (h>0? pad(m) : m) + ':' + pad(s);
  if(withDeci){ var d=Math.floor((ms%1000)/100); out+='.'+d; }
  return out;
}
function draw(ms){
  var t=document.getElementById('timeText');
  if(mode==='sw') t.textContent=fmtTime(ms,true);
  else t.textContent=fmtTime(ms,false);
  var ph=document.getElementById('phaseText'), sub=document.getElementById('subText');
  if(mode==='pm'){
    ph.textContent = pmPhase==='work' ? '🎯 專注中' : (pmRemaining===pmLong?'🌙 長休息':'☕ 休息中');
    sub.textContent = '已完成 '+pmRound+' 輪專注';
  } else if(mode==='cd'){
    ph.textContent='⏳ 倒數中'; sub.textContent='';
  } else { ph.textContent=''; sub.textContent=''; }
}
function tick(){
  var now=Date.now(), ms;
  if(mode==='sw'){ ms = swElapsed + (running? now-swStart : 0); }
  else if(mode==='cd'){ ms = running? Math.max(0, cdEnd-now) : cdRemaining; }
  else { ms = running? Math.max(0, pmEnd-now) : pmRemaining; }
  draw(ms);
  if(running && mode!=='sw' && ms<=0) onPhaseEnd();
}
function ensureTimer(){ if(!timerId) timerId=setInterval(tick,200); }
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null;} }

/* ===== 控制 ===== */
function startPause(){
  if(!running){
    unlockAudio();   /* 在點擊手勢內解鎖音訊，確保夠鐘能發聲 */
    if(mode==='sw'){ swStart=Date.now(); }
    else if(mode==='cd'){
      if(cdDuration<=0){toast('請先設定倒數時間');return;}
      cdEnd=Date.now()+cdRemaining;
    } else {
      pmRemaining = pmRemaining>0?pmRemaining : (pmPhase==='work'?pmWork:pmBreak);
      pmEnd=Date.now()+pmRemaining;
    }
    running=true; ensureTimer();
    document.getElementById('startBtn').textContent='⏸ 暫停';
  } else {
    pauseNow();
  }
}
function pauseNow(){
  var now=Date.now();
  if(mode==='sw'){ swElapsed += now-swStart; }
  else if(mode==='cd'){ cdRemaining = Math.max(0, cdEnd-now); }
  else { pmRemaining = Math.max(0, pmEnd-now); }
  running=false; stopTimer();
  document.getElementById('startBtn').textContent='▶ 繼續';
  draw(0);
}
function resetTimer(){
  running=false; stopTimer();
  if(mode==='sw'){ swElapsed=0; laps=[]; renderLaps(); }
  else if(mode==='cd'){ cdRemaining=cdDuration; }
  else { pmPhase='work'; pmRound=0; pmRemaining=pmWork; }
  document.getElementById('startBtn').textContent='▶ 開始';
  tick();
}

/* ===== 階段結束（倒數／番茄） ===== */
function onPhaseEnd(){
  if(soundOn) chime();
  flash();
  if(mode==='cd'){
    running=false; stopTimer(); cdRemaining=0;
    document.getElementById('startBtn').textContent='▶ 開始';
    toast('⏰ 倒數結束！');
    return;
  }
  // 番茄鐘：切換階段並自動繼續
  if(pmPhase==='work'){
    pmRound++;
    if(pmRound%4===0){ pmPhase='break'; pmRemaining=pmLong; toast('🍅 完成一輪！長休息 15 分'); }
    else { pmPhase='break'; pmRemaining=pmBreak; toast('🍅 專注完成，休息 5 分'); }
  } else {
    pmPhase='work'; pmRemaining=pmWork; toast('☕ 休息結束，開始專注');
  }
  pmEnd=Date.now()+pmRemaining;
  // 繼續 running=true
}

/* ===== 碼表分段 ===== */
function addLap(){
  var now=Date.now();
  var cur = swElapsed + (running? now-swStart : 0);
  var prev = laps.length? laps[0].acc : 0;
  laps.unshift({acc:cur, diff: cur-prev});
  renderLaps();
}
function clearLaps(){ laps=[]; renderLaps(); }
function renderLaps(){
  var el=document.getElementById('lapList');
  if(!laps.length){ el.innerHTML=''; return; }
  el.innerHTML=laps.map(function(l,idx){
    return '<li><span>第 '+(laps.length-idx)+' 段</span><b>'+fmtTime(l.diff,true)+'　（累計 '+fmtTime(l.acc,true)+'）</b></li>';
  }).join('');
}

/* ===== 倒數設定 ===== */
function cdPreset(min,el){
  document.querySelectorAll('#cdChips .chip').forEach(function(c){c.classList.remove('on');});
  if(el)el.classList.add('on');
  document.getElementById('cdMin').value=min;
  document.getElementById('cdSec').value=0;
  cdSet();
}
function cdSet(){
  var m=Math.max(0,parseInt(document.getElementById('cdMin').value)||0);
  var s=Math.max(0,Math.min(59,parseInt(document.getElementById('cdSec').value)||0));
  cdDuration=(m*60+s)*1000;
  cdRemaining=cdDuration;
  running=false; stopTimer();
  document.getElementById('startBtn').textContent='▶ 開始';
  tick();
  toast('已設定 '+fmtTime(cdDuration,false));
}

/* ===== 番茄鐘設定 ===== */
function pmSet(work,brk,lng,el){
  document.querySelectorAll('#panePm .chip').forEach(function(c){c.classList.remove('on');});
  if(el)el.classList.add('on');
  pmWork=work*60000; pmBreak=brk*60000; pmLong=lng*60000;
  pmPhase='work'; pmRound=0; pmRemaining=pmWork;
  running=false; stopTimer();
  document.getElementById('startBtn').textContent='▶ 開始';
  tick();
  toast('番茄鐘 '+work+'/'+brk+'（'+lng+' 長休）');
}

/* ===== 模式切換 ===== */
function setMode(m){
  running=false; stopTimer();
  mode=m;
  document.getElementById('segSw').classList.toggle('on',m==='sw');
  document.getElementById('segCd').classList.toggle('on',m==='cd');
  document.getElementById('segPm').classList.toggle('on',m==='pm');
  document.getElementById('paneSw').classList.toggle('on',m==='sw');
  document.getElementById('paneCd').classList.toggle('on',m==='cd');
  document.getElementById('panePm').style.display = m==='pm'?'block':'none';
  document.getElementById('startBtn').textContent='▶ 開始';
  tick();
}

/* ===== 提示音與閃爍 ===== */
var soundOn=(localStorage.getItem('timer_sound_v1')||'1')==='1';
/* ===== 音訊上下文（單例） ===== */
var _ac=null;
function getCtx(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return null;
    if(!_ac) _ac=new C();
    return _ac;
  }catch(e){ return null; }
}
/* 在「開始」手勢內解鎖音訊：建立/恢復 AudioContext，並播放極短靜音 buffer
   以解鎖多數移動端瀏覽器（HyperOS / iOS Safari / Android Chrome）的播放限制 */
function unlockAudio(){
  var ctx=getCtx(); if(!ctx)return;
  if(ctx.state==='suspended'){ try{ctx.resume();}catch(e){} }
  try{
    var buf=ctx.createBuffer(1,1,ctx.sampleRate);
    var src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0);
  }catch(e){}
}
/* 夠鐘響一聲：兩音上行清脆提示（聽感為一次的提醒） */
function chime(){
  var ctx=getCtx(); if(!ctx){ beepFallback(); return; }
  function play(){
    try{
      var t0=ctx.currentTime;
      var total=5.0;          /* 持續約 5 秒，確保聽得見 */
      var step=0.5;           /* 每 0.5 秒一聲，兩音交替 */
      var notes=[660,990];
      for(var t=0; t<total; t+=step){
        var f=notes[Math.round(t/step)%notes.length];
        var o=ctx.createOscillator(),g=ctx.createGain();
        o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ctx.destination);
        var s=t0+t;
        g.gain.setValueAtTime(0.0001,s);
        g.gain.exponentialRampToValueAtTime(0.4,s+0.03);
        g.gain.exponentialRampToValueAtTime(0.0001,s+0.22);
        o.start(s);o.stop(s+0.24);
      }
    }catch(e){ beepFallback(); }
  }
  if(ctx.state==='suspended'){ try{ctx.resume().then(play).catch(play);}catch(e){play();} }
  else { play(); }
}
/* WebAudio 不可用時的兜底：用內嵌短促 WAV 透過 <audio> 播放 */
var _beepWav=null;
function beepFallback(){
  try{

function toggleSound(v){
  soundOn=v;
  try{localStorage.setItem('timer_sound_v1',v?'1':'0');}catch(e){}

function loadSound(){ var t=document.getElementById('soundToggle'); if(t) t.checked=soundOn; }
function flash(){
  var c=document.getElementById('clock');
  c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
  setTimeout(function(){c.classList.remove('flash');},3200);
}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},2000);}
