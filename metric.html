<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>指標</title>
<link rel="stylesheet" href="theme.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--gray-bg:#f6f2ec;--green:#2e8f7e;--fs:1;}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 24px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.gear{margin-left:auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(120,60,80,.08);user-select:none;-webkit-user-select:none}
.gear:active{transform:scale(.94)}

.listtabs{display:flex;gap:8px;margin:12px 16px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.listtabs::-webkit-scrollbar{display:none}
.listtabs .lt{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.listtabs .lt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.listtabs .lt .cx{font-size:13px;opacity:.7}
.listtabs .add{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px dashed var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:var(--accent-soft);user-select:none;-webkit-user-select:none}

.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px;cursor:pointer;box-shadow:0 2px 8px rgba(120,60,80,.06)}
.card .nm{font-weight:700;font-size:calc(14px*var(--fs));margin-bottom:6px;word-break:break-word}
.card .val{font-size:calc(24px*var(--fs));font-weight:800;color:var(--accent)}
.card .val small{font-size:calc(12px*var(--fs));font-weight:600;color:var(--muted);margin-left:2px}
.card .tg{font-size:calc(11px*var(--fs));color:var(--muted);margin-top:4px}
.card .bar{height:6px;border-radius:4px;background:var(--line2);margin-top:8px;overflow:hidden}
.card .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.card .bar i.ok{background:var(--green)}
.card .bar i.off{background:#cf5a4c}
.card .bar i.over{background:var(--green)}
.card .pt{font-size:calc(11.5px*var(--fs));font-weight:700;margin-top:7px;color:var(--muted)}
.card .pt.over{color:var(--green)}
.card{position:relative}
.cards.lv-list{grid-template-columns:1fr}
.cards .lv-grip{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;font-size:14px;background:var(--line2);color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:calc(13px*var(--fs));line-height:1.7}
.addbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(120,60,80,.3);cursor:pointer;z-index:25;display:flex;align-items:center;justify-content:center}
.addbtn:active{transform:scale(.96)}

.mask{position:fixed;inset:0;background:rgba(40,20,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet .close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--muted);cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:10px}
.field label{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.field input[type=text],.field input[type=number]{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;font-size:calc(14px*var(--fs));font-family:inherit;outline:none;width:100%;color:var(--ink)}
.field input:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2>div{flex:1}
.row2 .switch{position:relative;width:46px;height:26px;border-radius:999px;background:var(--line2);display:inline-block;transition:background .15s;vertical-align:middle}
.row2 .switch.on{background:var(--accent)}
.row2 .switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.row2 .switch.on span{left:23px}
.mini{font-size:calc(12px*var(--fs));color:var(--muted);margin:6px 0}
.deltarget{font-size:calc(13px*var(--fs));color:var(--ink2);background:var(--gray-bg);border-radius:10px;padding:8px 10px;margin-top:4px}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(120,60,80,.2)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);margin-top:8px;font-weight:700}
.btn.danger{background:#fdecea;color:#cf5a4c;border:1px solid #f6d4ce;margin-top:8px;font-weight:700}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:6px 2px 10px}
.ctrow{display:inline-flex;background:var(--line2);border-radius:10px;padding:2px;gap:2px}
.ctrow button{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;-webkit-user-select:none}
.ctrow button.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.trend{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.rec{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px}
.rec .d{flex:1;font-size:calc(13px*var(--fs));color:var(--ink2)}
.rec .v{font-weight:800;font-size:calc(14px*var(--fs));color:var(--accent)}
.rec .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.rec .x:active{background:var(--line2)}
.addrec{display:flex;gap:8px;margin:8px 0 4px}
.addrec input[type=number]{flex:1}
.addrec input[type=date]{flex:1.1}
.addrec button{border:none;border-radius:11px;background:var(--accent);color:#fff;padding:0 16px;font-weight:700;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
a:focus-visible,button:focus-visible,input:focus-visible,.lt:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="title"><span class="logo">📈</span>指標</div>
      <div class="gear" onclick="openSettings()" title="設定與備份">⚙️</div>
    </div>
  </header>
  <div class="listtabs" id="listtabs"></div>
  <div class="lv-bar" id="lvBar"></div>
  <div class="cards" id="cards"></div>
</div>

<button class="addbtn" onclick="openMetricEditor()" title="新增指標">＋</button>

<!-- 指標編輯 -->
<div class="mask" id="mMask" onclick="if(event.target===this)closeMetricEditor()">
  <div class="sheet">
    <div class="close" onclick="closeMetricEditor()">✕</div>
    <h3 style="margin:2px 0 12px;font-size:calc(16px*var(--fs))" id="mTitle">新增指標</h3>
    <div class="field"><label>指標名稱</label><input type="text" id="mName" placeholder="例如：體重、存款、閱讀頁數" maxlength="40"></div>
    <div class="field"><label>單位（選填）</label><input type="text" id="mUnit" placeholder="kg、元、頁…" maxlength="8"></div>
    <div class="field">
      <label>目標值</label>
      <div class="row2" style="align-items:center">
        <span class="switch" id="mRangeSwitch" onclick="toggleRange()"><span></span></span>
        <span style="font-size:calc(13px*var(--fs));color:var(--ink2)">區間（最小值～最大值）</span>
      </div>
      <div id="mTargetSingle" style="margin-top:8px"><input type="number" id="mTargetVal" placeholder="目標值，例如 60" step="any"></div>
      <div id="mTargetRange" style="display:none" class="row2">
        <div><input type="number" id="mMin" placeholder="最小" step="any"></div>
        <div><input type="number" id="mMax" placeholder="最大" step="any"></div>
      </div>
    </div>
    <button class="btn primary" onclick="saveMetric()">儲存指標</button>
    <div class="field" style="margin-top:12px">
      <label>圖表呈現方式</label>
      <div class="ctrow" id="mChartRow">
        <button type="button" data-ct="line" onclick="setChartType('line')">線</button>
        <button type="button" data-ct="bar" onclick="setChartType('bar')">柱</button>
        <button type="button" data-ct="area" onclick="setChartType('area')">面積</button>
      </div>
    </div>
    <button class="btn ghost" onclick="closeMetricEditor()">取消</button>
  </div>
</div>

<!-- 指標詳情 -->
<div class="mask" id="dMask" onclick="if(event.target===this)closeDetail()">
  <div class="sheet">
    <div class="close" onclick="closeDetail()">✕</div>
    <h3 style="margin:2px 0 4px;font-size:calc(17px*var(--fs))" id="dName"></h3>
    <div class="deltarget" id="dTarget"></div>
    <div class="trend"><svg id="dChart" viewBox="0 0 320 160" width="100%" height="160" preserveAspectRatio="none"></svg></div>
    <div class="addrec">
      <input type="number" id="rVal" placeholder="數值" step="any">
      <input type="date" id="rDate">
      <button onclick="addRecord()">記錄</button>
    </div>
    <div id="dRecs" style="margin-top:6px"></div>
    <button class="btn ghost" style="margin-top:12px" onclick="editFromDetail()">✏️ 編輯指標</button>
    <button class="btn danger" style="margin-top:8px" onclick="delMetric()">🗑️ 刪除此指標</button>
  </div>
</div>

<!-- 設定 -->
<div class="mask" id="setMask" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <div class="close" onclick="closeSettings()">✕</div>
    <h3 style="margin:2px 0 12px;font-size:calc(16px*var(--fs))">設定與備份</h3>
    <div class="hint">備份會包含全部清單、指標與數值記錄。</div>
    <button class="btn primary" onclick="exportMT()">⬇️ 匯出備份（本應用）</button>
    <button class="btn ghost" onclick="importMT()">⬆️ 匯入備份（取代）</button>
    <input type="file" id="mtFile" accept="application/json,.json" style="display:none" onchange="onMTFile(event)">
    <button class="btn danger" onclick="clearAll()">🗑️ 清除全部資料</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var KEY='jless_metric_v1';
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function defaultState(){return {v:1,lists:[{id:uid(),name:'我的指標',metrics:[]}]};}
function load(){try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&Array.isArray(d.lists)&&d.lists.length)return d;}}catch(e){}return defaultState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('儲存失敗');}}
var S=load();
var curList=S.lists[0].id;
var editId=null, editRange=false, detailId=null, editChartType='line';

function curListObj(){for(var i=0;i<S.lists.length;i++)if(S.lists[i].id===curList)return S.lists[i];return S.lists[0];}
function byId(id){for(var i=0;i<S.lists.length;i++){var m=S.lists[i].metrics.filter(function(x){return x.id===id;})[0];if(m)return m;}return null;}

/* 清單 */
function renderTabs(){
  var w=document.getElementById('listtabs');w.innerHTML='';
  S.lists.forEach(function(l){
    var d=document.createElement('div');d.className='lt'+(l.id===curList?' on':'');
    d.innerHTML='<span>'+esc(l.name)+'</span>'+(S.lists.length>1?'<span class="cx" onclick="delList(\''+l.id+'\',event)">✕</span>':'');
    d.onclick=function(e){if(e.target.classList.contains('cx'))return;curList=l.id;renderTabs();renderCards();};
    w.appendChild(d);
  });
  var a=document.createElement('div');a.className='add';a.textContent='＋';a.title='新增清單';a.onclick=addList;w.appendChild(a);
}
function addList(){var name=prompt('新清單名稱：','新清單');if(name===null)return;name=name.trim();if(!name)return;var l={id:uid(),name:name.slice(0,20),metrics:[]};S.lists.push(l);curList=l.id;save();renderTabs();renderCards();toast('已新增清單');}
function delList(id,ev){ev.stopPropagation();if(S.lists.length<=1){toast('至少保留一個清單');return;}var l=S.lists.filter(function(x){return x.id===id;})[0];if(!confirm('刪除清單「'+(l?l.name:'')+'」及其指標？'))return;S.lists=S.lists.filter(function(x){return x.id!==id;});curList=S.lists[0].id;save();renderTabs();renderCards();}

/* 卡片 */
function latest(m){if(!m.records.length)return null;var r=m.records.slice().sort(function(a,b){return b.date<a.date?-1:1;})[0];return r;}
function targetText(m){if(m.targetType==='range')return '目標 '+fmt(m.targetMin)+'～'+fmt(m.targetMax)+(m.unit?' '+m.unit:'');return '目標 '+fmt(m.targetVal)+(m.unit?' '+m.unit:'');}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-Hant');}
function statusOf(m,val){
  if(val==null) return '';
  if(m.targetType==='range'){ if(val>=m.targetMin&&val<=m.targetMax) return 'ok'; return 'off'; }
  if(m.targetVal>0){ if(val>=m.targetVal) return val>m.targetVal?'over':'ok'; return 'off'; }
  return '';
}
function progText(m,val){
  if(val==null) return '';
  if(m.targetType==='range'){
    if(val>=m.targetMin&&val<=m.targetMax) return '區間內';
    if(val<m.targetMin) return '低於下限 '+fmt(m.targetMin-val);
    return '高於上限 '+fmt(val-m.targetMax);
  }
  if(m.targetVal>0){
    var pct=Math.round(val/m.targetVal*100);
    if(val>=m.targetVal) return (val>m.targetVal?'已超額 ':'達標 ')+pct+'%';
    return '還差 '+fmt(m.targetVal-val)+'（'+pct+'%）';
  }
  return '';
}
function renderCards(){
  var box=document.getElementById('cards');var l=curListObj();box.innerHTML='';
  if(!l.metrics.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">這個清單還沒有指標。<br>按右下角「＋」新增。</div>';return;}
  l.metrics.forEach(function(m){
    if(!m.chartType) m.chartType='line';
    var lv=latest(m);var st=statusOf(m,lv?lv.value:null);
    var bar='';var tag=targetText(m);
    if(lv&&m.targetType==='range'){var span=(m.targetMax-m.targetMin)||1;var pct=Math.max(0,Math.min(100,Math.round((lv.value-m.targetMin)/span*100)));bar='<div class="bar"><i class="'+(st==='ok'?'ok':(st==='off'?'off':''))+'" style="width:'+pct+'%"></i></div>';}
    else if(lv&&m.targetVal>0){var p=Math.max(0,Math.min(100,Math.round(lv.value/m.targetVal*100)));bar='<div class="bar"><i class="'+(st==='over'?'over':(st==='ok'?'ok':''))+'" style="width:'+p+'%"></i></div>';}
    var pt=progText(m,lv?lv.value:null);
    var d=document.createElement('div');d.className='card lv-item';d.dataset.id=m.id;
    d.innerHTML='<div class="lv-grip" title="拖動排序">⋮⋮</div>'+
      '<div class="nm">'+esc(m.name)+'</div>'+
      (lv?'<div class="val">'+fmt(lv.value)+(m.unit?'<small>'+esc(m.unit)+'</small>':'')+'</div>':'<div class="val" style="color:var(--muted);font-size:calc(16px*var(--fs))">—</div>')+
      '<div class="tg">'+esc(tag)+'</div>'+bar+(pt?'<div class="pt'+(st==='over'?' over':'')+'">'+esc(pt)+'</div>':'');
    d.onclick=function(){ if(window.metricSorting)return; openDetail(m.id); };
    box.appendChild(d);
  });
}

/* 指標編輯 */
function toggleRange(){editRange=!editRange;document.getElementById('mRangeSwitch').classList.toggle('on',editRange);document.getElementById('mTargetSingle').style.display=editRange?'none':'block';document.getElementById('mTargetRange').style.display=editRange?'flex':'none';}
function setChartType(t){editChartType=t;var b=document.querySelectorAll('#mChartRow button');for(var i=0;i<b.length;i++){b[i].classList.toggle('on',b[i].getAttribute('data-ct')===t);}}
function openMetricEditor(id){editId=id||null;editRange=false;
  if(id){var m=byId(id);if(m){document.getElementById('mTitle').textContent='編輯指標';document.getElementById('mName').value=m.name;document.getElementById('mUnit').value=m.unit||'';editRange=m.targetType==='range';if(editRange){document.getElementById('mMin').value=m.targetMin;document.getElementById('mMax').value=m.targetMax;}else{document.getElementById('mTargetVal').value=m.targetVal;}setChartType(m.chartType||'line');}}
  else{document.getElementById('mTitle').textContent='新增指標';document.getElementById('mName').value='';document.getElementById('mUnit').value='';document.getElementById('mTargetVal').value='';document.getElementById('mMin').value='';document.getElementById('mMax').value='';setChartType('line');}
  toggleRange();editRange=false;document.getElementById('mRangeSwitch').classList.remove('on');document.getElementById('mTargetSingle').style.display='block';document.getElementById('mTargetRange').style.display='none';
  document.getElementById('mMask').classList.add('show');
}
function closeMetricEditor(){document.getElementById('mMask').classList.remove('show');}
function saveMetric(){
  var name=document.getElementById('mName').value.trim();if(!name){toast('請填寫名稱');return;}
  var unit=document.getElementById('mUnit').value.trim();
  var m;
  if(editId){m=byId(editId);}else{var l=curListObj();m={id:uid(),records:[]};l.metrics.push(m);}
  m.name=name;m.unit=unit;
  if(editRange){var mn=parseFloat(document.getElementById('mMin').value),mx=parseFloat(document.getElementById('mMax').value);if(isNaN(mn)||isNaN(mx)){toast('請填寫區間');return;}m.targetType='range';m.targetMin=mn;m.targetMax=mx;}
  else{var v=parseFloat(document.getElementById('mTargetVal').value);m.targetType='value';m.targetVal=isNaN(v)?0:v;}
  m.chartType=editChartType||'line';
  save();closeMetricEditor();renderCards();toast('已儲存');
}
function delMetric(){if(!confirm('刪除這個指標及其所有記錄？'))return;var l=curListObj();l.metrics=l.metrics.filter(function(x){return x.id!==detailId;});save();closeDetail();renderCards();}
function editFromDetail(){var id=detailId;closeDetail();openMetricEditor(id);}

/* 詳情 */
function openDetail(id){detailId=id;var m=byId(id);if(!m)return;document.getElementById('dName').textContent=m.name;document.getElementById('dTarget').textContent=targetText(m)+(m.records.length?(' · 共 '+m.records.length+' 筆'):'');document.getElementById('rDate').value=todayStr();document.getElementById('rVal').value='';renderChart(m);renderRecs(m);document.getElementById('dMask').classList.add('show');}
function closeDetail(){document.getElementById('dMask').classList.remove('show');}
function renderChart(m){
  var svg=document.getElementById('dChart');var recs=m.records.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  if(recs.length<1){svg.innerHTML='<text x="160" y="90" text-anchor="middle" fill="#8b7380" font-size="12">尚無記錄</text>';return;}
  var vals=recs.map(function(r){return r.value;});var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  var lo=min,hi=max;if(m.targetType==='range'){lo=Math.min(lo,m.targetMin);hi=Math.max(hi,m.targetMax);}
  if(lo===hi){lo-=1;hi+=1;}
  var W=320,H=160,P=18;
  function X(i){return recs.length===1?W/2:P+(W-2*P)*i/(recs.length-1);}
  function Y(v){return H-P-(H-2*P)*(v-lo)/(hi-lo);}
  var grid='';[0,0.5,1].forEach(function(f){var y=P+(H-2*P)*f;grid+='<line x1="'+P+'" y1="'+y+'" x2="'+(W-P)+'" y2="'+y+'" stroke="#f0e2d8" stroke-width="1"/>';});
  var tline='';if(m.targetType==='range'){tline='<line x1="'+P+'" y1="'+Y(m.targetMin)+'" x2="'+(W-P)+'" y2="'+Y(m.targetMin)+'" stroke="#2e8f7e" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="'+P+'" y1="'+Y(m.targetMax)+'" x2="'+(W-P)+'" y2="'+Y(m.targetMax)+'" stroke="#2e8f7e" stroke-width="1.2" stroke-dasharray="4 3"/>';}
  else if(m.targetVal>0){tline='<line x1="'+P+'" y1="'+Y(m.targetVal)+'" x2="'+(W-P)+'" y2="'+Y(m.targetVal)+'" stroke="#cf5a4c" stroke-width="1.2" stroke-dasharray="4 3"/>';}
  var ct=m.chartType||'line';var body='';
  if(ct==='bar'){
    var bw=Math.max(8,(W-2*P)/recs.length*0.62);
    recs.forEach(function(r,i){var x=X(i)-bw/2,y=Y(r.value),h=(H-P)-y;body+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(0,h)+'" rx="3" fill="var(--accent)"/>';});
    recs.forEach(function(r,i){body+='<circle cx="'+X(i)+'" cy="'+Y(r.value)+'" r="3" fill="var(--accent)"/>';});
  }else if(ct==='area'){
    var apts=recs.map(function(r,i){return X(i)+','+Y(r.value);}).join(' ');
    body='<polygon points="'+P+','+(H-P)+' '+apts+' '+(W-P)+','+(H-P)+'" fill="var(--accent)" opacity="0.18"/>';
    body+='<polyline points="'+apts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    recs.forEach(function(r,i){body+='<circle cx="'+X(i)+'" cy="'+Y(r.value)+'" r="3" fill="var(--accent)"/>';});
  }else{
    var lpts=recs.map(function(r,i){return X(i)+','+Y(r.value);}).join(' ');
    body='<polyline points="'+lpts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    recs.forEach(function(r,i){body+='<circle cx="'+X(i)+'" cy="'+Y(r.value)+'" r="3" fill="var(--accent)"/>';});
  }
  svg.innerHTML=grid+tline+body;
}
function renderRecs(m){
  var box=document.getElementById('dRecs');var recs=m.records.slice().sort(function(a,b){return b.date<a.date?-1:1;});
  if(!recs.length){box.innerHTML='<div class="mini" style="text-align:center">尚無記錄，於上方輸入並按「記錄」。</div>';return;}
  box.innerHTML='';
  recs.forEach(function(r){var d=document.createElement('div');d.className='rec';
    d.innerHTML='<div class="d">'+r.date+(r.note?' · '+esc(r.note):'')+'</div><div class="v">'+fmt(r.value)+(m.unit?' '+esc(m.unit):'')+'</div><div class="x" onclick="delRec(\''+r.id+'\')">✕</div>';
    box.appendChild(d);});
}
function addRecord(){
  var v=parseFloat(document.getElementById('rVal').value);if(isNaN(v)){toast('請輸入數值');return;}
  var date=document.getElementById('rDate').value||todayStr();var m=byId(detailId);if(!m)return;
  m.records.push({id:uid(),date:date,value:v});save();renderChart(m);renderRecs(m);
  document.getElementById('rVal').value='';openDetail(detailId);renderCards();toast('已記錄');
}
function delRec(id){var m=byId(detailId);if(!m)return;m.records=m.records.filter(function(r){return r.id!==id;});save();renderChart(m);renderRecs(m);renderCards();}

/* 設定 */
function openSettings(){document.getElementById('setMask').classList.add('show');}
function closeSettings(){document.getElementById('setMask').classList.remove('show');}
function exportMT(){JLessBackup.export([KEY],'metric-backup-'+todayStr().replace(/-/g,'')+'.json');toast('已匯出備份');}
function importMT(){document.getElementById('mtFile').click();}
function onMTFile(ev){var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;JLessBackup.importFromFile(f,[KEY],function(ok,msg){if(!ok){alert(msg||'匯入失敗');return;}S=load();curList=S.lists[0].id;renderTabs();renderCards();toast('已匯入');});}
function clearAll(){if(!confirm('清除全部清單、指標與記錄，無法復原。\n建議先匯出備份。確定？'))return;S=defaultState();curList=S.lists[0].id;save();renderTabs();renderCards();toast('已清除');}

var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}
function reorderMetrics(ids){var l=curListObj();var map={};l.metrics.forEach(function(m){map[m.id]=m;});l.metrics=ids.map(function(id){return map[id];}).filter(Boolean);save();}
function drawMetricCanvas(){
  var l=curListObj();
  var W=720,P=30,scale=2,rowH=80,topH=88,padBot=42;
  var H=topH+l.metrics.length*rowH+padBot;
  var c=document.createElement('canvas');c.width=W*scale;c.height=H*scale;var x=c.getContext('2d');x.scale(scale,scale);
  x.fillStyle=JLessShare.getVar('--bg','#fffaf3');x.fillRect(0,0,W,H);
  x.textAlign='left';x.fillStyle=JLessShare.getVar('--ink','#3b2530');x.font='bold 30px sans-serif';
  x.fillText('指標 · '+JLessShare.clip(l.name,18),P,46);
  x.fillStyle=JLessShare.getVar('--muted','#8b7380');x.font='15px sans-serif';
  x.fillText('共 '+l.metrics.length+' 項 · '+todayStr(),P,72);
  var accent=JLessShare.getVar('--accent','#c23b6a');
  var green=JLessShare.getVar('--green','#2e8f7e');
  var y=topH;
  l.metrics.forEach(function(m){
    if(!m.chartType)m.chartType='line';
    var lv=latest(m);var st=statusOf(m,lv?lv.value:null);
    var valTxt=lv?fmt(lv.value):'—'; if(lv&&m.unit)valTxt+=' '+m.unit;
    var tg=targetText(m);
    x.fillStyle=JLessShare.getVar('--ink','#3b2530');x.font='bold 20px sans-serif';x.textAlign='left';
    x.fillText(JLessShare.clip(m.name,16),P,y+26);
    x.fillStyle=JLessShare.getVar('--ink2','#5f4b55');x.font='14px sans-serif';
    x.fillText(tg,P,y+48);
    x.textAlign='right';
    x.fillStyle=JLessShare.getVar('--ink','#3b2530');x.font='bold 20px sans-serif';
    x.fillText(valTxt,W-P,y+26);
    var pt=progText(m,lv?lv.value:null);
    if(pt){ x.fillStyle=(st==='over')?green:JLessShare.getVar('--muted','#8b7380'); x.font='13px sans-serif'; x.fillText(pt,W-P,y+48); }
    var pct=0,color=accent;
    if(lv){
      if(m.targetType==='range'){var span=(m.targetMax-m.targetMin)||1;pct=Math.max(0,Math.min(100,(lv.value-m.targetMin)/span*100));}
      else if(m.targetVal>0){pct=Math.max(0,Math.min(100,lv.value/m.targetVal*100));}
      if(st==='over')color=green; else if(st==='ok')color=green; else if(st==='off')color='#cf5a4c';
    }
    x.fillStyle=JLessShare.getVar('--line2','#f8efe7');JLessShare.roundRect(x,P,y+58,W-P*2,12,6);x.fill();
    x.fillStyle=color;JLessShare.roundRect(x,P,y+58,(W-P*2)*pct/100,12,6);x.fill();
    x.strokeStyle=JLessShare.getVar('--line','#f0e2d8');x.lineWidth=1;x.beginPath();x.moveTo(P,y+rowH-10);x.lineTo(W-P,y+rowH-10);x.stroke();
    y+=rowH;
  });
  x.fillStyle='#c9bdb5';x.font='13px sans-serif';x.textAlign='left';
  x.fillText('由 jless 工具箱產生',P,H-18);
  return c;
}
function metricToText(){
  var l=curListObj();
  var lines=['指標 · '+l.name,'共 '+l.metrics.length+' 項 · '+todayStr(),''];
  if(!l.metrics.length){lines.push('（沒有指標）');return lines.join('\n');}
  l.metrics.forEach(function(m){
    var lv=latest(m);var st=statusOf(m,lv?lv.value:null);
    var valTxt=lv?(fmt(lv.value)+(m.unit?' '+m.unit:'')):'—';
    var pt=progText(m,lv?lv.value:null)||'';
    lines.push('• '+m.name);
    lines.push('  現值：'+valTxt+'　目標：'+targetText(m));
    if(pt)lines.push('  '+pt);
    lines.push('');
  });
  return lines.join('\n');
}
function metricToCSV(){
  var l=curListObj();
  var rows=[['清單','指標','現值','單位','目標類型','目標值','目標下限','目標上限','狀態','進度']];
  l.metrics.forEach(function(m){
    var lv=latest(m);var st=statusOf(m,lv?lv.value:null);
    var val=lv?lv.value:'';
    var pt=progText(m,lv?lv.value:null)||'';
    rows.push([l.name,m.name,val,m.unit||'',m.targetType==='range'?'區間':'數值',m.targetType==='range'?'':m.targetVal,m.targetMin||'',m.targetMax||'',st,pt]);
  });
  return rows;
}
function shareMetricList(){
  if(!window.JLessShare){toast('分享模組未載入');return;}
  var l=curListObj();
  if(!l.metrics.length){toast('清單沒有指標');return;}
  JLessShare.openSheet({
    title:'分享指標「'+l.name+'」',
    image:function(){ JLessShare.shareImage(drawMetricCanvas(),'metric-'+todayStr()+'.png',function(ok){toast(ok?'已開啟分享':'已儲存指標圖片');}); },
    text:function(){ JLessShare.shareText('指標 · '+l.name,metricToText(),function(ok){toast(ok?'已開啟分享':'已複製文字');}); },
    excel:function(){ JLessShare.shareCSV(metricToCSV(),'metric-'+l.name+'-'+todayStr()+'.csv',function(ok){toast(ok?'已開啟分享':'已匯出 CSV');}); }
  });
}
renderTabs();renderCards();
</script>
