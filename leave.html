<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>年假</title>
<link rel="stylesheet" href="theme.css">
<style>
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--fs:1;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 90px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.content{padding:14px 16px 0}
.summary{display:flex;gap:10px;margin-bottom:12px}
.summary .box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(120,60,80,.06)}
.summary .v{font-size:calc(22px*var(--fs));font-weight:800;color:var(--ink)}
.summary .v.acc{color:var(--accent)}
.summary .v.ok{color:#2e8f7e}
.summary .l{font-size:calc(11.5px*var(--fs));color:var(--muted);font-weight:700;margin-top:2px}
.totbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.totbox label{font-size:calc(13px*var(--fs));font-weight:700;color:var(--ink2);flex:0 0 auto}
.totbox input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:calc(15px*var(--fs));text-align:right;background:var(--bg);outline:none;color:var(--ink)}
.totbox input:focus{border-color:var(--accent)}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(120,60,80,.06)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head .mm{font-weight:800;font-size:calc(15px*var(--fs))}
.cal-head button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer;color:var(--ink2)}
.cal-head button:active{background:var(--line2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.week div{text-align:center;font-size:calc(11px*var(--fs));color:var(--muted);font-weight:700;padding:4px 0}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;font-size:calc(13px*var(--fs));line-height:1;color:var(--ink2);cursor:pointer;position:relative;background:var(--bg);border:1px solid transparent}
.day.other{color:#cdbcc4;background:transparent}
.day.today{border-color:var(--accent);font-weight:800}
.day.used{background:var(--accent-soft);color:var(--accent);font-weight:800}
.day.plan{background:#fff3da;color:#d97706;font-weight:800}
.day .dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:8px 2px 0}
.list-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(120,60,80,.06);margin-top:12px}
.list-card h3{margin:2px 0 4px;font-size:calc(14px*var(--fs));color:var(--ink2);font-weight:700}
.lv-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line2);cursor:pointer}
.lv-row:last-child{border-bottom:none}
.lv-date{flex:0 0 auto;min-width:98px;font-size:calc(14px*var(--fs));font-weight:700;color:var(--ink)}
.lv-status{flex:1;font-size:calc(13px*var(--fs));font-weight:700}
.lv-status.used{color:var(--accent)}
.lv-status.plan{color:#d97706}
.lv-del{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lv-del:active{background:#fdecea;color:#cf5a4c;border-color:#f6d4ce}
.mask{position:fixed;inset:0;background:rgba(40,20,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:2px 0 12px;font-size:calc(16px*var(--fs))}
.sheet .close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--muted);cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.seg2{display:flex;gap:8px;margin:6px 0 12px}
.seg2 button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;font-size:calc(14px*var(--fs));font-weight:700;color:var(--ink2);cursor:pointer}
.seg2 button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg2 button.on.plan{background:#d97706;border-color:#d97706}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(120,60,80,.2)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);margin-top:8px;font-weight:700}
.btn.danger{background:#fdecea;color:#cf5a4c;border:1px solid #f6d4ce;margin-top:8px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header><div class="topbar"><div class="title"><span class="logo">🏖️</span>年假</div></div></header>
  <div class="content">
    <div class="summary">
      <div class="box"><div class="v" id="sumTotal">0</div><div class="l">總數（日）</div></div>
      <div class="box"><div class="v acc" id="sumUsed">0</div><div class="l">已使用</div></div>
      <div class="box"><div class="v ok" id="sumLeft">0</div><div class="l">未使用</div></div>
    </div>
    <div class="totbox">
      <label>年度可放年假（日）</label>
      <input type="number" id="totalInput" inputmode="numeric" min="0" value="0" onchange="setTotal()">
    </div>
    <div class="cal">
      <div class="cal-head">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="mm" id="calMM"></div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
      <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div class="grid7" id="calGrid"></div>
      <div class="hint">點選日期可新增／修改年假。🟣 已使用　🟠 已安排（未扣減）。</div>
    </div>
    <div class="list-card">
      <h3>所有年假（日期 · 狀態）</h3>
      <div id="leaveList"></div>
      <div class="hint" id="leaveEmpty" style="display:none">尚無年假記錄。</div>
    </div>
  </div>
</div>

<nav class="bottombar">
  <button class="bb primary" onclick="shareLeave()"><span class="ic">📤</span>分享</button>
  <button class="bb" onclick="resetLeave()"><span class="ic">🗑️</span>清除</button>
</nav>

<div class="mask" id="dayMask" onclick="if(event.target===this)closeDay()">
  <div class="sheet">
    <div class="close" onclick="closeDay()">✕</div>
    <h3 id="dayTitle">新增年假</h3>
    <div class="seg2">
      <button id="stUsed" class="on" onclick="setStatus('used')">已使用</button>
      <button id="stPlan" class="plan" onclick="setStatus('plan')">已安排</button>
    </div>
    <button class="btn primary" onclick="saveDay()">儲存</button>
    <button class="btn danger" id="dayDel" style="display:none" onclick="delDay()">刪除這天</button>
    <button class="btn ghost" onclick="closeDay()">取消</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script src="share.js"></script>
<script>
var KEY='jless_leave_v1';
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.leaves))return d;}catch(e){}return {total:0,leaves:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var viewY, viewM, editDate=null, editStatus='used';
function pad(n){return (n<10?'0':'')+n;}
function ymd(y,m,d){return y+'-'+pad(m+1)+'-'+pad(d);}
function todayStr(){var t=new Date();return ymd(t.getFullYear(),t.getMonth(),t.getDate());}
function leaveOf(date){return S.leaves.filter(function(x){return x.date===date;})[0];}
function setTotal(){var v=parseInt(document.getElementById('totalInput').value,10);if(isNaN(v)||v<0)v=0;S.total=v;save();renderSummary();}
function renderSummary(){
  var used=S.leaves.filter(function(x){return x.status==='used';}).length;
  var left=Math.max(0,S.total-used);
  document.getElementById('sumTotal').textContent=S.total;
  document.getElementById('sumUsed').textContent=used;
  document.getElementById('sumLeft').textContent=left;
  document.getElementById('totalInput').value=S.total;
}
function shiftMonth(d){viewM+=d;if(viewM<0){viewM=11;viewY--;}if(viewM>11){viewM=0;viewY++;}renderCalendar();}
function renderCalendar(){
  var t=new Date();if(viewY==null){viewY=t.getFullYear();viewM=t.getMonth();}
  document.getElementById('calMM').textContent=viewY+' 年 '+(viewM+1)+' 月';
  var first=new Date(viewY,viewM,1);var startWd=first.getDay();
  var days=new Date(viewY,viewM+1,0).getDate();
  var prevDays=new Date(viewY,viewM,0).getDate();
  var grid=document.getElementById('calGrid');grid.innerHTML='';
  for(var i=0;i<startWd;i++){var d=document.createElement('div');d.className='day other';d.textContent=prevDays-startWd+i+1;grid.appendChild(d);}
  var tStr=todayStr();
  for(var dnum=1;dnum<=days;dnum++){
    var date=ymd(viewY,viewM,dnum);
    var lv=leaveOf(date);
    var cell=document.createElement('div');
    cell.className='day'+(date===tStr?' today':'')+(lv?(lv.status==='used'?' used':' plan'):'');
    cell.textContent=dnum;
    if(lv){var dot=document.createElement('span');dot.className='dot';cell.appendChild(dot);}
    (function(dt){cell.onclick=function(){openDay(dt);};})(date);
    grid.appendChild(cell);
  }
  var totalCells=startWd+days;var tail=42-totalCells;if(tail<0)tail+=7;
  for(var k=0;k<tail;k++){var d2=document.createElement('div');d2.className='day other';d2.textContent=k+1;grid.appendChild(d2);}
}
function openDay(date){
  editDate=date;
  var lv=leaveOf(date);
  document.getElementById('dayTitle').textContent=(lv?'修改 ':'新增 ')+date;
  editStatus=lv?lv.status:'used';
  setStatus(editStatus);
  document.getElementById('dayDel').style.display=lv?'block':'none';
  document.getElementById('dayMask').classList.add('show');
}
function setStatus(s){editStatus=s;document.getElementById('stUsed').classList.toggle('on',s==='used');document.getElementById('stPlan').classList.toggle('on',s==='plan');}
function closeDay(){document.getElementById('dayMask').classList.remove('show');}
function saveDay(){
  if(!editDate)return;
  var lv=leaveOf(editDate);
  if(lv){lv.status=editStatus;}else{S.leaves.push({id:uid(),date:editDate,status:editStatus});}
  save();renderSummary();renderCalendar();renderLeaveList();closeDay();toast('已儲存');
}
function delDay(){
  if(!editDate)return;
  S.leaves=S.leaves.filter(function(x){return x.date!==editDate;});
  save();renderSummary();renderCalendar();renderLeaveList();closeDay();toast('已刪除');
}
/* 月曆下方：列出所有年假，按日期排序，點列可編輯，右側可快速刪除 */
function renderLeaveList(){
  var list=S.leaves.slice().sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var box=document.getElementById('leaveList');
  var empty=document.getElementById('leaveEmpty');
  if(!list.length){ box.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  box.innerHTML=list.map(function(x){
    var used=x.status==='used';
    var st=used?'已使用':'已安排';
    var cls=used?'used':'plan';
    return '<div class="lv-row" onclick="openDay(\''+x.date+'\')">'+
      '<div class="lv-date">'+x.date+'</div>'+
      '<div class="lv-status '+cls+'">'+st+'</div>'+
      '<button class="lv-del" onclick="event.stopPropagation();delLeave(\''+x.date+'\')" title="刪除">🗑</button>'+
    '</div>';
  }).join('');
}
function delLeave(date){
  S.leaves=S.leaves.filter(function(x){return x.date!==date;});
  save();renderSummary();renderCalendar();renderLeaveList();toast('已刪除');
}
function shareLeave(){
  var used=S.leaves.filter(function(x){return x.status==='used';}).length;
  var plan=S.leaves.filter(function(x){return x.status==='plan';}).length;
  var left=Math.max(0,S.total-used);
  var body='年度年假總數：'+S.total+' 日\n已使用：'+used+' 日\n已安排（未扣）：'+plan+' 日\n未使用：'+left+' 日';
  if(window.JLessShare){JLessShare.shareText('年假結餘',body,function(ok){toast(ok?'已開啟分享':'已複製文字');});}
  else{navigator.clipboard&&navigator.clipboard.writeText(body);toast('已複製');}
}
function resetLeave(){
  if(!confirm('清除所有年假記錄（額度保留）？'))return;
  S.leaves=[];save();renderSummary();renderCalendar();renderLeaveList();toast('已清除記錄');
}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}
renderSummary();renderCalendar();renderLeaveList();
</script>
</body>
</html>
