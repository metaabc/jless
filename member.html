.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.seg span{padding:8px 13px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;user-select:none}
.seg span.on{background:var(--accent);color:#fff}
</style>
</head>

<script>
var KEY='jless_member_v1';
var S={v:1,regions:[],members:[],txns:[],cfg:{layout:'card',sort:'recent'}};
var curRegion='all';
var editId=null;       /* 正在編輯的會員 id；null=新增 */
var editCard='';       /* 編輯中的卡圖 dataURL */
var detailId=null;     /* 詳情中的會員 id */
var txMid=null;        /* 交易中的會員 id */
var txType='topup';
var txAmt=null;        /* 已選快捷金額 */
var sortDrag=null;     /* 拖動排序狀態 */
var selMode=false;     /* 批次選取模式 */
var selIds={};         /* 已選會員 id */

/* ---------- 工具 ---------- */
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayStr(){
  var d=new Date(),m=d.getMonth()+1,dd=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function fmtDate(s){
  if(!s)return '';
  var p=String(s).split('-');
  if(p.length!==3)return s;
  return p[0]+'/'+p[1]+'/'+p[2];
}
function money(n){
  n=Math.round((+n||0)*100)/100;
  var neg=n<0;n=Math.abs(n);
  var s=n.toLocaleString('zh-Hant',{minimumFractionDigits:0,maximumFractionDigits:2});
  return (neg?'-':'')+'$'+s;
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){t.classList.remove('show');},1900);
}

/* ---------- 資料 ---------- */
function normalize(d){
  var o={v:1,regions:[],members:[],txns:[],cfg:{layout:'card',sort:'recent',region:''}};
  if(!d||typeof d!=='object')d={};
  if(Array.isArray(d.regions))o.regions=d.regions.filter(function(r){return r&&r.id;}).map(function(r){
    return {id:String(r.id),name:String(r.name||'未命名地區').slice(0,20),ts:+r.ts||Date.now()};
  });
  if(Array.isArray(d.members))o.members=d.members.filter(function(m){return m&&m.id;}).map(function(m){
    return {
      id:String(m.id),
      regionId:String(m.regionId||''),
      name:String(m.name||'未命名會員').slice(0,40),
      note:String(m.note||'').slice(0,60),
      promo:String(m.promo||'').slice(0,400),
      card:typeof m.card==='string'&&m.card.indexOf('data:')===0?m.card:'',
      ord:(typeof m.ord==='number'&&isFinite(m.ord))?m.ord:null,
      ts:+m.ts||Date.now()
    };
  });
  if(Array.isArray(d.txns))o.txns=d.txns.filter(function(t){return t&&t.id;}).map(function(t){
    return {
      id:String(t.id),
      mid:String(t.mid||''),
      type:(t.type==='spend'?'spend':'topup'),
      amt:Math.max(0,+t.amt||0),
      bonus:Math.max(0,+t.bonus||0),
      date:String(t.date||todayStr()).slice(0,10),
      note:String(t.note||'').slice(0,60),
      ts:+t.ts||Date.now()
    };
  });
  if(d.cfg&&typeof d.cfg==='object'){
    if(/^(card|list|compact)$/.test(d.cfg.layout||''))o.cfg.layout=d.cfg.layout;
    o.cfg.sort=(d.cfg.sort==='manual'?'manual':'recent');
    if(typeof d.cfg.region==='string')o.cfg.region=d.cfg.region;
  }
  /* 若完全沒有資料，給一個預設地區，方便第一次使用 */
  if(!o.regions.length&&!o.members.length){
    o.regions=[{id:uid(),name:'默認',ts:Date.now()}];
  }
  return o;
}
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    S=normalize(raw?JSON.parse(raw):null);
  }catch(e){S=normalize(null);}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast('儲存失敗：瀏覽器空間可能已滿');}
}
function regionById(id){return S.regions.find(function(r){return r.id===id;})||null;}
function regionName(id){var r=regionById(id);return r?r.name:'未分區';}
/* 預設地區：優先「默認」，否則第一個地區 */
function defaultRegionId(){
  var d=S.regions.filter(function(r){return r.name==='默認';})[0]||S.regions[0];
  return d?d.id:'all';
}
/* 開啟時：沿用上次選取的地區；首次則看「默認」 */
function resolveRegion(){
  var saved=S.cfg&&S.cfg.region;
  if(saved==='all')return 'all';
  if(saved&&regionById(saved))return saved;
  return defaultRegionId();
}
function memberById(id){return S.members.find(function(m){return m.id===id;})||null;}
function txnsOf(mid){
  return S.txns.filter(function(t){return t.mid===mid;})
    .sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0);});
}
/* 餘額：充值本金 + 贈送 − 消費 */
function calcBalance(mid){
  var top=0,bonus=0,spent=0,last=0,lastDate='';
  S.txns.forEach(function(t){
    if(t.mid!==mid)return;
    if(t.type==='topup'){top+=t.amt;bonus+=t.bonus;}
    else{spent+=t.amt;}
    if((t.ts||0)>last)last=t.ts||0;
    /* 用交易本身的日期字串（本地日期），避免 UTC 轉換令凌晨交易顯示前一日 */
    if(t.date&&t.date>lastDate)lastDate=t.date;
  });
  return {top:top,bonus:bonus,spent:spent,total:top+bonus-spent,last:last,lastDate:lastDate};
}

/* ---------- 地區 ---------- */
function renderRegions(){
  var box=document.getElementById('rTabs');
  var h='';
  var all=S.members.length;
  h+='<div class="rtab'+(curRegion==='all'?' on':'')+'" onclick="setRegion(\'all\')">全部 <small>'+all+'</small></div>';
  S.regions.forEach(function(r){
    var n=S.members.filter(function(m){return m.regionId===r.id;}).length;
    h+='<div class="rtab'+(curRegion===r.id?' on':'')+'" onclick="setRegion(\''+r.id+'\')">'+esc(r.name)+' <small>'+n+'</small></div>';
  });
  h+='<div class="rtab add" onclick="openRegionSheet()">＋ 地區</div>';
  box.innerHTML=h;
  /* 讓選中的 tab 自動可見 */
  var on=box.querySelector('.rtab.on');
  if(on&&on.scrollIntoView){try{on.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}
}
function setRegion(id){
  curRegion=(id==='all'||regionById(id))?id:'all';
  S.cfg.region=curRegion;
  save();
  renderRegions();renderMembers();
}

/* ---------- 會員列表 ---------- */
/* 最近有交易者優先，其次新加入 */
function recentCmp(a,b){
  var ba=calcBalance(a.id),bb=calcBalance(b.id);
  var ta=Math.max(ba.last,a.ts||0),tb=Math.max(bb.last,b.ts||0);
  return tb-ta;
}
/* 手動排序：ord 細者在前；未設定 ord 者排在最後 */
function ordCmp(a,b){
  var oa=(a.ord==null?1e15:a.ord),ob=(b.ord==null?1e15:b.ord);
  if(oa!==ob)return oa-ob;
  return recentCmp(a,b);
}
function orderedMembers(){return S.members.slice().sort(ordCmp);}
function visibleMembers(){
  var list=S.members.slice();
  if(curRegion!=='all')list=list.filter(function(m){return m.regionId===curRegion;});
  list.sort(S.cfg.sort==='manual'?ordCmp:recentCmp);
  return list;
}
function renderMembers(){
  var grid=document.getElementById('mGrid');
  var empty=document.getElementById('emptyBox');
  var list=visibleMembers();
  grid.className='mgrid ly-'+(S.cfg.layout||'card')+(selMode?' selmode':'');
  if(!list.length){
    grid.innerHTML='';
    empty.innerHTML='<div class="empty"><span class="big">💳</span>'+
      (S.members.length?'此地區未有會員。':'還沒有會員卡。加入第一張，充值與消費就一目了然。')+
      '<br><button class="btn primary" onclick="openMemberEdit()">＋ 新增會員</button></div>';
  }else{
    empty.innerHTML='';
    grid.innerHTML=list.map(memberCardHTML).join('');
  }
  renderSummary();
}
function memberCardHTML(m){
  var b=calcBalance(m.id);
  var cls=b.total>0?'':(b.total<0?'neg':'zero');
  var metaTxt='累計充值 '+money(b.top);
  var on=selMode&&!!selIds[m.id];
  var act=selMode?'toggleSel(\''+m.id+'\')':'openDetail(\''+m.id+'\')';
  var check=selMode?'<div class="mcheck">✓</div>':'';
  var open='<div class="mcard'+(on?' sel':'')+'" onclick="'+act+'">'+check;
  if(S.cfg.layout==='list'){
    return open+
      '<div class="mthumb">'+(m.card?'<img src="'+m.card+'" alt="">':'🏪')+'</div>'+
      '<div class="mtxt">'+
        '<div class="nm"><span class="t">'+esc(m.name)+'</span></div>'+
        '<div class="rg">📍 '+esc(regionName(m.regionId))+'</div>'+
        '<div class="bal '+cls+'">'+money(b.total)+'</div>'+
      '</div></div>';
  }
  return open+
    '<div class="inner">'+
      '<div class="nm"><span class="t">'+esc(m.name)+'</span></div>'+
      '<div class="rg">📍 '+esc(regionName(m.regionId))+'</div>'+
      '<div class="bal '+cls+'">'+money(b.total)+'</div>'+
      '<div class="meta">'+metaTxt+'</div>'+
    '</div></div>';
}
function renderSummary(){
  var el=document.getElementById('sumLine');
  if(selMode){
    var ids=Object.keys(selIds),tot=0;
    if(!ids.length){
      el.innerHTML='<span class="sumtxt">點選卡片開始選取（可跨地區）</span>';
      return;
    }
    ids.forEach(function(id){tot+=calcBalance(id).total;});
    el.innerHTML='<span class="sumtxt">已選 <b>'+ids.length+'</b> 張 · 合計餘額 <b>'+money(tot)+'</b></span>';
    return;
  }
  var total=0,n=0;
  var list=visibleMembers();
  list.forEach(function(m){var b=calcBalance(m.id);total+=b.total;n++;});
  if(!S.members.length){el.innerHTML='';return;}
  var txt=n?('共 <b>'+n+'</b> 張會員卡 · 合計餘額 <b>'+money(total)+'</b>'):'此地區未有會員';
  el.innerHTML='<span class="sumtxt">'+txt+'</span>'+
    '<button class="sortbtn'+(S.cfg.sort==='manual'?' on':'')+'" onclick="openSortSheet()" title="排序會員">⇅ '+
    (S.cfg.sort==='manual'?'手動':'排序')+'</button>';
}

/* ---------- 批次選取 ---------- */
function selCount(){return Object.keys(selIds).length;}
function toggleSelMode(){
  if(!selMode&&!S.members.length){toast('還沒有會員卡');return;}
  selMode=!selMode;
  if(!selMode)selIds={};
  updateSelUI();
}
function exitSel(){
  if(!selMode&&!selCount())return;
  selMode=false;selIds={};
  updateSelUI();
}
function toggleSel(id){
  if(!memberById(id))return;
  if(selIds[id])delete selIds[id];
  else selIds[id]=1;
  updateSelUI();
}
function toggleSelectAll(){
  var vis=visibleMembers();
  var allOn=vis.length>0&&vis.every(function(m){return !!selIds[m.id];});
  vis.forEach(function(m){
    if(allOn)delete selIds[m.id];
    else selIds[m.id]=1;
  });
  updateSelUI();
}
function selectedMembers(){
  var order={};
  orderedMembers().forEach(function(m,i){order[m.id]=i;});
  return S.members.filter(function(m){return !!selIds[m.id];})
    .sort(function(a,b){return (order[a.id]||0)-(order[b.id]||0);});
}
function updateSelUI(){
  var bar=document.getElementById('selBar');
  if(bar)bar.classList.toggle('show',selMode);
  document.body.classList.toggle('selmode',selMode);
  var btn=document.getElementById('selBtn');
  if(btn)btn.classList.toggle('on',selMode);
  var n=selCount();
  var sh=document.getElementById('selShareBtn');
  if(sh){sh.textContent=n?('↗ 分享 '+n+' 張'):'↗ 分享';sh.disabled=!n;}
  var all=document.getElementById('selAllBtn');
  if(all){
    var vis=visibleMembers();
    var allOn=vis.length>0&&vis.every(function(m){return !!selIds[m.id];});
    all.textContent=allOn?'全不選':'全選';
  }
  renderMembers();
}

/* ---------- 佈局 ---------- */
var LAYOUTS=[{k:'card',n:'標準卡片',i:'▦'},{k:'list',n:'列表',i:'☰'},{k:'compact',n:'緊湊',i:'▪'}];
function setLayout(k){
  if(!/^(card|list|compact)$/.test(k))return;
  S.cfg.layout=k;save();renderMembers();renderLayoutChips();
  var btn=document.getElementById('lyBtn');
  if(btn)btn.classList.toggle('on',k!=='card');
}
function renderLayoutChips(){
  var box=document.getElementById('layoutChips');
  if(!box)return;
  box.innerHTML=LAYOUTS.map(function(l){
    return '<div class="chip'+(S.cfg.layout===l.k?' on':'')+'" onclick="setLayout(\''+l.k+'\')">'+l.i+' '+l.n+'</div>';
  }).join('');
}
function openLayoutSheet(){
  /* 三種佈局直接循環，比開面板快 */
  var order=['card','list','compact'];
  var i=order.indexOf(S.cfg.layout);
  var next=order[(i+1)%order.length];
  setLayout(next);
  var nm={card:'標準卡片',list:'列表',compact:'緊湊'}[next];
  toast('已切換為「'+nm+'」佈局');
}

/* ---------- 手動排序 ---------- */
function ensureManual(){
  if(S.cfg.sort==='manual'){
    var miss=orderedMembers().some(function(m){return m.ord==null;});
    if(miss)orderedMembers().forEach(function(m,i){m.ord=i;});
    return;
  }
  /* 以目前「最近使用」次序作為手動排序起點 */
  S.members.slice().sort(recentCmp).forEach(function(m,i){m.ord=i;});
  S.cfg.sort='manual';
}
function openSortSheet(){

function renderSortList(){
  var box=document.getElementById('sortList');
  if(!box)return;
  var list=orderedMembers();
  if(!list.length){box.innerHTML='<div class="hint">還沒有會員。</div>';return;}
  box.innerHTML=list.map(function(m,i){
    return '<div class="srow" data-id="'+m.id+'">'+
      '<div class="shandle" onpointerdown="sortDown(event,\''+m.id+'\')" title="按住拖動">⋮⋮</div>'+

        '<div class="s">📍 '+esc(regionName(m.regionId))+'</div></div>'+
      '<button class="sbtn" onclick="moveMember(\''+m.id+'\',-1)"'+(i===0?' disabled':'')+' title="上移">↑</button>'+
      '<button class="sbtn" onclick="moveMember(\''+m.id+'\',1)"'+(i===list.length-1?' disabled':'')+' title="下移">↓</button>'+
    '</div>';
  }).join('');
}
function applyOrder(ids){
  var map={};
  ids.forEach(function(id,i){map[id]=i;});
  S.members.forEach(function(m){if(map[m.id]!=null)m.ord=map[m.id];});
}
function moveMember(id,delta){
  ensureManual();
  var list=orderedMembers();
  var i=-1;
  for(var k=0;k<list.length;k++){if(list[k].id===id){i=k;break;}}
  var j=i+delta;
  if(i<0||j<0||j>=list.length)return;
  var ids=list.map(function(m){return m.id;});
  ids.splice(i,1);
  ids.splice(j,0,id);
  applyOrder(ids);
  save();renderSortList();renderMembers();
}
function resetSort(){
  S.cfg.sort='recent';
  S.members.forEach(function(m){m.ord=null;});
  save();renderSortList();renderMembers();
  toast('已回復自動排序');
}
function sortDown(ev,id){
  if(ev.pointerType==='mouse'&&ev.button!==0)return;
  ev.preventDefault();
  ensureManual();
  renderMembers();
  sortDrag={id:id};
  var row=document.querySelector('#sortList .srow[data-id="'+id+'"]');
  if(row)row.classList.add('dragging');
  document.addEventListener('pointermove',sortMove);
  document.addEventListener('pointerup',sortEnd);
  document.addEventListener('pointercancel',sortEnd);
}
function sortMove(ev){
  if(!sortDrag)return;
  if(ev.cancelable)ev.preventDefault();
  var box=document.getElementById('sortList');
  if(!box)return;
  var rows=[].slice.call(box.querySelectorAll('.srow'));
  if(!rows.length)return;
  var cur=-1;
  for(var k=0;k<rows.length;k++){
    if(rows[k].getAttribute('data-id')===sortDrag.id){cur=k;break;}
  }
  if(cur<0)return;
  /* 用指標 Y 找出應該插入的位置 */
  var idx=-1;
  for(var i=0;i<rows.length;i++){
    var r=rows[i].getBoundingClientRect();
    if(ev.clientY>=r.top&&ev.clientY<=r.bottom){idx=i;break;}
  }
  if(idx<0){
    var f=rows[0].getBoundingClientRect(),l=rows[rows.length-1].getBoundingClientRect();
    if(ev.clientY<f.top)idx=0;
    else if(ev.clientY>l.bottom)idx=rows.length-1;
  }
  if(idx<0||idx===cur)return;
  /* 直接搬動 DOM 節點，避免重建時中斷拖曳 */
  var dragged=rows[cur],target=rows[idx];
  if(idx>cur)box.insertBefore(dragged,target.nextSibling);
  else box.insertBefore(dragged,target);
  var ids=[].slice.call(box.querySelectorAll('.srow')).map(function(r){return r.getAttribute('data-id');});
  applyOrder(ids);
  /* 拖到上下邊緣時自動捲動 */
  var sheet=document.querySelector('#sortMask .sheet');
  if(sheet){
    var sr=sheet.getBoundingClientRect();
    if(ev.clientY<sr.top+76)sheet.scrollTop-=16;
    else if(ev.clientY>sr.bottom-76)sheet.scrollTop+=16;
  }
}
function sortEnd(){
  if(!sortDrag)return;
  sortDrag=null;
  document.removeEventListener('pointermove',sortMove);
  document.removeEventListener('pointerup',sortEnd);
  document.removeEventListener('pointercancel',sortEnd);
  save();
  renderSortList();
  renderMembers();
}

/* 壓縮圖片：長邊最多 760px，逐步降品質令 base64 約 ≤ 60KB，節省儲存空間 */
function shrinkImage(file,maxEdge,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      function encode(edge){
        var w=img.width,h=img.height;
        var scale=Math.min(1,edge/Math.max(w,h));
        var cw=Math.max(1,Math.round(w*scale)),ch=Math.max(1,Math.round(h*scale));
        var cv=document.createElement('canvas');
        cv.width=cw;cv.height=ch;
        var ctx=cv.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);
        ctx.drawImage(img,0,0,cw,ch);
        var q=0.72,out=cv.toDataURL('image/jpeg',q);
        while(out.length>80000&&q>0.42){
          q-=0.07;
          out=cv.toDataURL('image/jpeg',q);
        }
        return out;
      }
      var out=encode(maxEdge);
      if(out.length>96000)out=encode(Math.round(maxEdge*0.78));
      cb(out);
    };
    img.onerror=function(){toast('無法讀取此圖片');};
    img.src=e.target.result;
  };
  reader.onerror=function(){toast('無法讀取檔案');};
  reader.readAsDataURL(file);
}

    openRegionSheet();
    return;
  }
  if(editId){
    var m=memberById(editId);
    if(m){m.name=name;m.regionId=regionId;m.note=note;m.promo=promo.slice(0,400);m.card=editCard;}
  }else{
    var ord=null;
    if(S.cfg.sort==='manual'){
      /* 手動排序時，新會員放在最前 */
      var min=Infinity;
      S.members.forEach(function(x){if(x.ord!=null&&x.ord<min)min=x.ord;});
      ord=(min===Infinity?0:min-1);
    }
    S.members.unshift({id:uid(),regionId:regionId,name:name,note:note,promo:promo.slice(0,400),card:editCard,ord:ord,ts:Date.now()});
  }

function importData(ev){
  var f=ev.target.files&&ev.target.files[0];
  ev.target.value='';
  if(!f)return;
  var rd=new FileReader();
  rd.onload=function(e){
    try{
      var obj=JSON.parse(String(e.target.result));
      var d=obj&&obj.data?obj.data:obj;
      if(!d||typeof d!=='object')throw new Error('格式不正確');
      if(!confirm('匯入會「取代」目前所有會員資料，確定繼續？'))return;

      S=normalize(d);

      renderRegions();renderMembers();renderLayoutChips();
      closeSettings();
      toast('已匯入 '+S.members.length+' 位會員');
    }catch(err){toast('匯入失敗：'+err.message);}
  };
  rd.onerror=function(){toast('無法讀取檔案');};
  rd.readAsText(f);
}
function clearAll(){
  if(!S.members.length&&!S.txns.length){toast('目前沒有資料');return;}
  if(!confirm('清除全部 '+S.members.length+' 位會員及其記錄？此動作無法復原。'))return;
  if(window.JLess&&JLess.trash&&JLess.trash.snapshot){try{JLess.trash.snapshot(KEY,'清除全部會員資料');}catch(e){}}
  if(selMode)exitSel();
  S={v:1,regions:S.regions.slice(),members:[],txns:[],cfg:{layout:S.cfg.layout,sort:'recent',region:''}};
  curRegion=defaultRegionId();
  S.cfg.region=curRegion;
  save();
  renderRegions();renderMembers();
  closeSettings();
  toast('已清除全部會員資料（地區保留）');
}

/* ---------- 分享 ---------- */
var SHARE_FONT='-apple-system,BlinkMacSystemFont,"PingFang TC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';
function sFont(ctx,size,weight,color){
  ctx.font=(weight||700)+' '+size+'px '+SHARE_FONT;
  if(color)ctx.fillStyle=color;
}
function sFit(ctx,txt,maxW){
  txt=String(txt==null?'':txt);
  if(ctx.measureText(txt).width<=maxW)return txt;
  var t=txt;
  while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);
  return t+'…';
}
function sCover(ctx,img,x,y,w,h){
  var ir=img.width/img.height,br=w/h,sw,sh,sx,sy;
  if(ir>br){sh=img.height;sw=sh*br;sx=(img.width-sw)/2;sy=0;}
  else{sw=img.width;sh=sw/br;sx=0;sy=(img.height-sh)/2;}
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function shareFileName(s){
  return String(s||'').replace(/[\\/:*?"<>|\s]+/g,'_').slice(0,24)||'member';
}
function shareDateStr(){
  var d=new Date();
  return d.getFullYear()+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2);
}
var imgCache={};
function loadImage(src,cb){
  var hit=src?imgCache[src]:null;
  if(hit&&hit.complete&&hit.naturalWidth){cb(hit);return;}
  var im=new Image();
  im.onload=function(){if(src)imgCache[src]=im;cb(im);};
  im.onerror=function(){cb(null);};
  im.src=src;
}
/* 合成分享圖：餘額卡 + 三項統計 + 會員證卡圖 + 最近記錄 */
function buildShareCanvas(m,cb){
  function run(img){
    var b=calcBalance(m.id);
    var recs=txnsOf(m.id).slice(0,3);
    var accent=JLessShare.getVar('--accent','#c23b6a');
    var accent2=JLessShare.getVar('--accent2','#a8305c');
    var W=900,PAD=56;
    var nrec=recs.length,hasImg=!!img;
    var H=PAD+64+300+22+150+(hasImg?24+360:0)+(nrec?26+36+nrec*58:0)+64;
    var cv=document.createElement('canvas');
    cv.width=W;cv.height=H;
    var x=cv.getContext('2d');
    var bg=x.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,'#fffaf3');bg.addColorStop(1,'#fdf0e8');
    x.fillStyle=bg;x.fillRect(0,0,W,H);
    var glow=x.createRadialGradient(W/2,-80,0,W/2,-80,620);
    glow.addColorStop(0,'rgba(194,59,106,.16)');glow.addColorStop(1,'rgba(194,59,106,0)');
    x.fillStyle=glow;x.fillRect(0,0,W,640);

    /* 品牌列 */
    sFont(x,23,800,accent);
    x.fillText('JLess 會員',PAD,PAD+22);
    sFont(x,19,600,'#b3a1a9');
    x.textAlign='right';x.fillText(shareDateStr(),W-PAD,PAD+22);x.textAlign='left';

    /* 餘額卡 */
    var cy=PAD+64;
    JLessShare.roundRect(x,PAD,cy,W-PAD*2,300,34);
    var cg=x.createLinearGradient(PAD,cy,PAD+W-2*PAD,cy+300);
    cg.addColorStop(0,accent);cg.addColorStop(1,accent2);
    x.fillStyle=cg;x.fill();
    x.save();
    JLessShare.roundRect(x,PAD,cy,W-PAD*2,300,34);x.clip();
    var gl=x.createLinearGradient(0,cy,0,cy+300);
    gl.addColorStop(0,'rgba(255,255,255,.18)');gl.addColorStop(.55,'rgba(255,255,255,0)');
    x.fillStyle=gl;x.fillRect(PAD,cy,W-PAD*2,300);
    x.restore();

    sFont(x,21,700,'rgba(255,255,255,.82)');
    x.fillText('會員卡 · '+sFit(x,regionName(m.regionId),W-PAD*2-68),PAD+34,cy+52);
    sFont(x,45,800,'#fff');
    x.fillText(sFit(x,m.name,W-PAD*2-68),PAD+34,cy+112);
    sFont(x,21,600,'rgba(255,255,255,.82)');
    x.fillText('目前餘額',PAD+34,cy+182);
    if(b.lastDate){
      sFont(x,19,600,'rgba(255,255,255,.72)');
      x.textAlign='right';x.fillText('最近 '+fmtDate(b.lastDate),W-PAD-34,cy+182);x.textAlign='left';
    }
    var fs=78,at=money(b.total);
    sFont(x,fs,800,'#fff');
    while(x.measureText(at).width>W-PAD*2-68&&fs>38){fs-=4;sFont(x,fs,800,'#fff');}
    x.fillText(at,PAD+34,cy+268);

    /* 三項統計 */
    var sy=cy+300+22;
    JLessShare.roundRect(x,PAD,sy,W-PAD*2,150,26);
    x.fillStyle='#fff';x.fill();
    x.strokeStyle='rgba(59,37,48,.09)';x.lineWidth=2;x.stroke();
    var cols=[['充值本金',money(b.top)],['贈送',money(b.bonus)],['已消費',money(b.spent)]];
    var cw=(W-PAD*2)/3;
    cols.forEach(function(c,i){
      var cx=PAD+cw*i+cw/2;
      x.textAlign='center';
      sFont(x,20,600,'#967f89');x.fillText(c[0],cx,sy+58);
      sFont(x,30,800,'#3b2530');x.fillText(sFit(x,c[1],cw-16),cx,sy+110);
    });
    x.textAlign='left';

    var cur=sy+150;
    if(hasImg){
      cur+=24;
      JLessShare.roundRect(x,PAD,cur,W-PAD*2,360,26);
      x.save();x.clip();sCover(x,img,PAD,cur,W-PAD*2,360);x.restore();
      JLessShare.roundRect(x,PAD,cur,W-PAD*2,360,26);
      x.strokeStyle='rgba(59,37,48,.12)';x.lineWidth=2;x.stroke();
      cur+=360;
    }
    if(nrec){
      cur+=26;
      sFont(x,21,700,'#967f89');x.fillText('最近記錄',PAD,cur+20);
      var top=cur+36;
      recs.forEach(function(t,i){
        var isIn=t.type==='topup';
        var yy=top+i*58;
        JLessShare.roundRect(x,PAD,yy,W-PAD*2,50,15);
        x.fillStyle='rgba(255,255,255,.78)';x.fill();
        sFont(x,20,600,'#967f89');
        x.fillText(fmtDate(t.date),PAD+18,yy+32);
        sFont(x,21,700,'#3b2530');
        var label=isIn?'充值':'消費';
        if(t.note)label+=' · '+t.note;
        x.fillText(sFit(x,label,W-PAD*2-320),PAD+142,yy+32);
        x.textAlign='right';
        sFont(x,22,800,isIn?'#0f766e':accent);
        x.fillText((isIn?'+':'−')+money(t.amt),W-PAD-18,yy+33);
        x.textAlign='left';
      });
    }

    sFont(x,19,600,'#b3a1a9');
    x.textAlign='center';
    x.fillText('JLess 小助手 · 資料只存本機',W/2,H-40);
    x.textAlign='left';
    cb(cv);
  }
  if(m.card&&m.card.indexOf('data:')===0)loadImage(m.card,function(img){run(img);});
  else run(null);
}
function shareMember(id){
  var m=memberById(id);if(!m)return;
  if(!window.JLessShare){toast('分享元件未載入，請重新載入頁面');return;}
  var items=[];
  items.push(['🖼️ 卡圖＋餘額（圖片）',function(){shareMemberImage(m);}]);
  if(m.card)items.push(['💳 只分享會員證卡圖',function(){shareCardOnly(m);}]);
  items.push(['📝 餘額狀況（文字）',function(){shareMemberText(m);}]);
  JLessShare.openSheet({title:'分享「'+m.name+'」',items:items});
}
function shareMemberImage(m){
  buildShareCanvas(m,function(cv){
    JLessShare.shareImage(cv,'jless-member-'+shareFileName(m.name)+'-'+todayStr()+'.png',function(shared){
      toast(shared?'已開啟分享':'圖片已儲存到裝置');
    });
  });
}
function shareCardOnly(m){
  if(!m.card){toast('此會員未上載卡圖');return;}
  shareImageSrc(m.card,'jless-card-'+shareFileName(m.name)+'.png');
}
function shareImageSrc(src,name){
  loadImage(src,function(img){
    if(!img){toast('卡圖載入失敗');return;}
    var max=1400;
    var sc=Math.min(1,max/Math.max(img.width||900,img.height||600));
    var cv=document.createElement('canvas');
    cv.width=Math.round((img.width||900)*sc);
    cv.height=Math.round((img.height||600)*sc);
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.drawImage(img,0,0,cv.width,cv.height);
    JLessShare.shareImage(cv,name,function(shared){
      toast(shared?'已開啟分享':'圖片已儲存到裝置');
    });
  });
}
function shareMemberText(m){
  var b=calcBalance(m.id);
  var lines=[];
  lines.push('💳 '+m.name+'（'+regionName(m.regionId)+'）');
  lines.push('目前餘額：'+money(b.total));
  lines.push('充值本金 '+money(b.top)+' · 贈送 '+money(b.bonus)+' · 已消費 '+money(b.spent));
  if(b.lastDate)lines.push('最近記錄：'+fmtDate(b.lastDate));
  if(m.promo){lines.push('');lines.push('🎁 優惠：');lines.push(m.promo);}
  if(m.note)lines.push('備註：'+m.note);
  lines.push('');
  lines.push('— JLess 會員');
  JLessShare.shareText('會員餘額｜'+m.name,lines.join('\n'),function(shared){
    toast(shared?'已開啟分享':'已複製到剪貼簿');
  });
}

/* ---------- 批次分享 ---------- */
function openBatchShare(){
  var list=selectedMembers();
  if(!list.length){toast('先選取會員');return;}
  if(!window.JLessShare){toast('分享元件未載入，請重新載入頁面');return;}
  var items=[
    ['🖼️ 餘額一覽（圖片）',function(){shareBatchImage(list);}],
    ['📝 餘額狀況（文字）',function(){shareBatchText(list,'balance');}],
    ['🎁 優惠（文字）',function(){shareBatchText(list,'promo');}]
  ];
  JLessShare.openSheet({title:'分享 '+list.length+' 位會員',items:items});
}
function shareBatchText(list,mode){
  var lines=[];
  if(mode==='promo'){
    var wp=list.filter(function(m){return m.promo&&m.promo.trim();});
    if(!wp.length){toast('所選會員未填優惠');return;}
    lines.push('🎁 會員優惠（'+wp.length+' 間）');
    lines.push('');
    wp.forEach(function(m){
      lines.push('▍'+m.name+'（'+regionName(m.regionId)+'）');
      lines.push(m.promo.trim());
      lines.push('');
    });
  }else{
    var total=0;
    lines.push('💳 會員餘額（'+list.length+' 張）');
    lines.push('');
    list.forEach(function(m){
      var b=calcBalance(m.id);total+=b.total;
      lines.push('· '+m.name+'（'+regionName(m.regionId)+'）：'+money(b.total));
    });
    lines.push('');
    lines.push('合計：'+money(total));
  }
  lines.push('');
  lines.push('— JLess 會員 · '+shareDateStr());
  JLessShare.shareText(mode==='promo'?'會員優惠':'會員餘額',lines.join('\n'),function(shared){
    toast(shared?'已開啟分享':'已複製到剪貼簿');
  });
}
function shareBatchImage(list){
  buildBatchCanvas(list,function(cv){
    JLessShare.shareImage(cv,'jless-members-'+todayStr()+'.png',function(shared){
      toast(shared?'已開啟分享':'圖片已儲存到裝置');
    });
  });
}
/* 多會員餘額一覽圖 */
function buildBatchCanvas(list,cb){
  var accent=JLessShare.getVar('--accent','#c23b6a');
  var accent2=JLessShare.getVar('--accent2','#a8305c');
  var W=900,PAD=56,ROWH=68,GAP=8,MAX=12;
  var rows=list.slice(0,MAX);
  var more=list.length-rows.length;
  var total=0;
  list.forEach(function(m){total+=calcBalance(m.id).total;});
  var H=PAD+64+66+126+20+rows.length*(ROWH+GAP)+(more?34:0)+58;
  var cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  var x=cv.getContext('2d');
  var bg=x.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#fffaf3');bg.addColorStop(1,'#fdf0e8');
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  var glow=x.createRadialGradient(W/2,-80,0,W/2,-80,620);
  glow.addColorStop(0,'rgba(194,59,106,.16)');glow.addColorStop(1,'rgba(194,59,106,0)');
  x.fillStyle=glow;x.fillRect(0,0,W,620);

  sFont(x,23,800,accent);
  x.fillText('JLess 會員',PAD,PAD+22);
  sFont(x,19,600,'#b3a1a9');
  x.textAlign='right';x.fillText(shareDateStr(),W-PAD,PAD+22);x.textAlign='left';

  sFont(x,36,800,'#3b2530');
  x.fillText('會員餘額一覽',PAD,PAD+64+38);

  var ty=PAD+64+66;
  JLessShare.roundRect(x,PAD,ty,W-PAD*2,126,30);
  var cg=x.createLinearGradient(PAD,ty,PAD+W-2*PAD,ty+126);
  cg.addColorStop(0,accent);cg.addColorStop(1,accent2);
  x.fillStyle=cg;x.fill();
  sFont(x,21,700,'rgba(255,255,255,.84)');
  x.fillText('合計餘額 · '+list.length+' 張會員卡',PAD+34,ty+44);
  var fs=58,at=money(total);
  sFont(x,fs,800,'#fff');
  while(x.measureText(at).width>W-PAD*2-68&&fs>32){fs-=4;sFont(x,fs,800,'#fff');}
  x.fillText(at,PAD+34,ty+102);

  var ry=ty+126+20;
  rows.forEach(function(m,i){
    var b=calcBalance(m.id);
    var yy=ry+i*(ROWH+GAP);
    JLessShare.roundRect(x,PAD,yy,W-PAD*2,ROWH,16);
    x.fillStyle='#fff';x.fill();
    x.strokeStyle='rgba(59,37,48,.08)';x.lineWidth=2;x.stroke();
    sFont(x,23,700,'#3b2530');
    x.fillText(sFit(x,m.name,W-PAD*2-340),PAD+22,yy+30);
    sFont(x,18,600,'#967f89');
    x.fillText(sFit(x,regionName(m.regionId),W-PAD*2-340),PAD+22,yy+53);
    x.textAlign='right';
    sFont(x,25,800,b.total<0?'#c0392b':accent);
    x.fillText(money(b.total),W-PAD-22,yy+42);
    x.textAlign='left';
  });
  var ny=ry+rows.length*(ROWH+GAP);
  if(more){
    sFont(x,19,600,'#967f89');
    x.fillText('另有 '+more+' 張未列出',PAD,ny+20);
    ny+=34;
  }
  sFont(x,19,600,'#b3a1a9');
  x.textAlign='center';
  x.fillText('JLess 小助手 · 資料只存本機',W/2,H-32);
  x.textAlign='left';
  cb(cv);
}

/* ---------- 圖片放大 ---------- */
function openImg(src){
  if(!src)return;
  document.getElementById('imgBig').src=src;
  document.getElementById('imgView').classList.add('show');
}
function closeImg(){
  document.getElementById('imgView').classList.remove('show');
  document.getElementById('imgBig').src='';
}
function shareCurrentImg(){
  var src=document.getElementById('imgBig').src;
  if(!src)return;
  if(!window.JLessShare){toast('分享元件未載入，請重新載入頁面');return;}
  var m=detailId?memberById(detailId):null;
  shareImageSrc(src,'jless-card-'+(m?shareFileName(m.name):'member')+'.png');
}

/* ---------- 啟動 ---------- */
load();
curRegion=resolveRegion();
if(S.cfg.region!==curRegion){S.cfg.region=curRegion;save();}
renderRegions();
renderMembers();
var lyBtn=document.getElementById('lyBtn');
if(lyBtn)lyBtn.classList.toggle('on',S.cfg.layout!=='card');
</script>
