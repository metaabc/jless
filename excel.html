<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>Excel 表格工具</title>
<link rel="stylesheet" href="theme.css">
<style>
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--accent:#c23b6a;--accent2:#a8305c;--accent-soft:#fdeaf2;--accent-line:#f4c9da;--fs:1}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 90px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.content{padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(120,60,80,.06);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:calc(13.5px*var(--fs));color:var(--ink2);font-weight:700}
.field{margin-bottom:10px}
.field label{font-size:calc(12.5px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:calc(15px*var(--fs));background:var(--bg);outline:none;color:var(--ink);-webkit-appearance:none;font-family:inherit}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:13px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(120,60,80,.2)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);margin-top:8px;font-weight:700}
.btn.sm{flex:1;padding:11px;font-size:calc(13.5px*var(--fs));font-weight:700;background:var(--line2);color:var(--ink2);border:none;box-shadow:none}
.btn:active{transform:scale(.98)}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:2px 2px 6px}
.ibrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ibrow .btn.sm{margin-top:0}
.urlrow{display:none;gap:8px;margin-top:8px}
.urlrow.show{display:flex}
.urlrow input{flex:1}

/* 統計 */
.stats{display:flex;flex-direction:column;gap:6px}
.stat{display:flex;justify-content:space-between;font-size:calc(13px*var(--fs));color:var(--ink2)}
.stat b{color:var(--ink);font-weight:800}
.stat.sub{font-size:calc(12px*var(--fs));color:var(--muted);padding-left:6px}
.numwrap{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:5px}
.tagswrap{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-size:calc(11.5px*var(--fs));font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:999px;padding:3px 9px}
.empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:calc(13px*var(--fs));line-height:1.8}
.empty .big{font-size:30px;margin-bottom:6px}
.note{font-size:calc(11.5px*var(--fs));color:var(--muted);margin-top:8px;min-height:14px}

/* 表格 */
.tblwrap{max-height:52vh;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.tbl{border-collapse:collapse;width:100%;font-size:calc(12.5px*var(--fs))}
table.tbl th,table.tbl td{border-bottom:1px solid var(--line2);padding:8px 10px;text-align:left;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
table.tbl thead th{position:sticky;top:0;background:var(--accent-soft);color:var(--ink2);font-weight:800;z-index:2;border-bottom:1px solid var(--accent-line)}
table.tbl tbody tr:nth-child(even){background:var(--line2)}
table.tbl tbody tr.tagged{background:var(--accent-soft)}
table.tbl .tgcol,table.tbl .tgcell{background:rgba(0,0,0,.02)}
.tbl td.ck,.tbl th.ck{position:sticky;left:0;background:var(--panel);width:34px;text-align:center;z-index:1}
.tbl thead th.ck{background:var(--accent-soft);z-index:3}
.tbl tbody tr:nth-child(even) td.ck{background:var(--line2)}
.tbl tbody tr.tagged td.ck{background:var(--accent-soft)}
.selbar{display:none;flex-direction:column;gap:8px;background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:12px;padding:10px;margin-bottom:12px}
.selbar.show{display:flex}
.selbar .row2{display:flex;gap:8px;align-items:center}
.selbar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:calc(14px*var(--fs));background:#fff;outline:none;color:var(--ink)}
.selbar .btn.sm{margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header><div class="topbar"><div class="title"><span class="logo">📊</span>Excel 表格工具</div></div></header>
  <div class="content">

    <!-- 匯入 -->
    <div class="card" id="importCard">
      <h3>📥 匯入資料</h3>
      <div class="field"><label>貼上 CSV 內容</label><textarea id="csvText" placeholder="直接貼上 CSV（可用逗號或引號包住含逗號的欄位）…"></textarea></div>
      <div class="field" style="display:flex;align-items:center;gap:8px">
        <label style="margin:0"><input type="checkbox" id="hasHeader" checked style="width:auto;margin-right:6px;vertical-align:middle">首列為標題</label>
      </div>
      <button class="btn primary" onclick="importPasted()">⬇️ 匯入貼上的 CSV</button>
      <div class="ibrow">
        <button class="btn sm" onclick="document.getElementById('fileInput').click()">📁 選檔案</button>
        <button class="btn sm" id="urlToggle" onclick="toggleUrl()">🔗 貼網址</button>
      </div>
      <div class="urlrow" id="urlRow">
        <input type="url" id="urlInput" placeholder="https://…/data.csv">
        <button class="btn sm" style="flex:0 0 auto" onclick="importUrl()">匯入</button>
      </div>
      <input type="file" id="fileInput" accept=".csv,text/csv,text/plain,.txt" style="display:none" onchange="importFile(event)">
      <div class="hint">支援三種來源：① 貼上 CSV 文字　② 貼網址自動抓取　③ 從手機選取 .csv 檔案。</div>
    </div>

    <!-- 資料區（匯入後顯示） -->
    <div id="dataArea" style="display:none">

      <!-- 統計 -->
      <div class="card" id="statsCard">
        <h3>📈 統計</h3>
        <div class="stats" id="statsBox"></div>
        <div class="numwrap" id="numBox"></div>
        <div class="tagswrap" id="tagBox"></div>
      </div>

      <!-- 工具：搜尋＋篩選＋選取 -->
      <div class="card">
        <h3>🔎 搜尋與篩選</h3>
        <div class="field"><label>全文搜尋</label><input type="text" id="searchInput" placeholder="在所有欄位中搜尋關鍵字…" oninput="applyView()"></div>
        <div class="row2">
          <div class="field"><label>欄位</label><select id="fCol"></select></div>
          <div class="field"><label>條件</label>
            <select id="fOp" onchange="opChange()">
              <option value="contains">包含</option>
              <option value="eq">等於</option>
              <option value="gt">大於</option>
              <option value="lt">小於</option>
              <option value="empty">空白</option>
              <option value="notempty">非空</option>
            </select>
          </div>
        </div>
        <div class="field"><label>值</label><input type="text" id="fVal" placeholder="篩選值（空白/非空可留空）" oninput="applyView()"></div>
        <div class="ibrow">
          <button class="btn sm" onclick="applyFilter()">套用篩選</button>
          <button class="btn sm" onclick="clearFilter()">清除篩選</button>
          <button class="btn sm" id="selBtn" onclick="toggleSel()">☑ 選取模式</button>
        </div>
      </div>

      <!-- 批次打標籤 -->
      <div class="selbar" id="selBar">
        <div class="row2">
          <button class="btn sm" onclick="selectAll()">全選篩選結果</button>
          <button class="btn sm" onclick="clearSel()">清空選取</button>
        </div>
        <div class="row2">
          <input type="text" id="tagInput" placeholder="輸入標籤，例如：活動A">
          <button class="btn sm" style="flex:0 0 auto" onclick="tagSelected()">🏷 打標籤</button>
          <button class="btn sm" style="flex:0 0 auto" onclick="clearTagSelected()">清除</button>
        </div>
        <div class="hint">勾選列後輸入標籤即可批次標記；匯出時會多出「標籤」欄。例如先把活動文件打上「活動A」，再匯出。</div>
      </div>

      <!-- 表格 -->
      <div class="card">
        <h3>📋 資料表 <span id="tblCount" style="color:var(--muted);font-weight:600"></span></h3>
        <div class="tblwrap" id="tblWrap"></div>
        <div class="note" id="tblNote"></div>
      </div>
    </div>

  </div>
</div>

<nav class="bottombar">
  <button class="bb primary" onclick="exportCSV()"><span class="ic">📄</span>CSV</button>
  <button class="bb" onclick="exportXLSX()"><span class="ic">📊</span>XLSX</button>
  <button class="bb" onclick="clearData()"><span class="ic">🗑</span>清除</button>
</nav>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script src="share.js"></script>
<script>
/* ===== 資料 ===== */
var headers=[], rows=[], tags=[];
var filter=null;          // {col, op, val}
var search='';
var selectMode=false;
var sel=new Set();        // 選取列索引
var lastView=[];          // 目前符合篩選的索引

/* ===== 工具 ===== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-Hant',{maximumFractionDigits:2});}
function isNum(s){if(s==null)return false;s=String(s).trim();return s!==''&&/^-?\d+(\.\d+)?$/.test(s);}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1900);}

/* ===== CSV 解析（支援引號／換行欄位） ===== */
function parseCSV(text){
  text=String(text).replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var out=[],row=[],field='',i=0,inQ=false;
  while(i<text.length){
    var c=text[i];
    if(inQ){
      if(c==='"'){
        if(text[i+1]==='"'){field+='"';i+=2;continue;}
        inQ=false;i++;continue;
      }
      field+=c;i++;continue;
    }else{
      if(c==='"'){inQ=true;i++;continue;}
      if(c===','){row.push(field);field='';i++;continue;}
      if(c==='\n'){row.push(field);out.push(row);row=[];field='';i++;continue;}
      field+=c;i++;
    }
  }
  if(field!==''||row.length){row.push(field);out.push(row);}
  while(out.length&&out[out.length-1].length===1&&out[out.length-1][0]==='')out.pop();
  return out;
}

/* ===== 匯入 ===== */
function loadInto(raw){
  if(!raw||!raw.length){toast('沒有可匯入的資料');return;}
  var hh=document.getElementById('hasHeader').checked;
  if(hh){headers=raw[0].map(function(x){return String(x==null?'':x).trim();});rows=raw.slice(1);}
  else{headers=raw[0].map(function(x,i){return '欄'+(i+1);});rows=raw;}
  // 若標題有空白，補名
  headers=headers.map(function(h,i){return h&&h.trim()?h:('欄'+(i+1));});
  tags=new Array(rows.length).fill('');
  sel.clear();filter=null;search='';
  document.getElementById('searchInput').value='';
  document.getElementById('fVal').value='';
  buildFilterCols();
  document.getElementById('dataArea').style.display='block';
  applyView();
  toast('已匯入 '+rows.length+' 列');
}
function importPasted(){
  var t=document.getElementById('csvText').value;
  if(!t.trim()){toast('請先貼上 CSV');return;}
  loadInto(parseCSV(t));
}
function importFile(ev){
  var f=ev.target.files&&ev.target.files[0];ev.target.value='';
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){try{loadInto(parseCSV(r.result));}catch(e){toast('讀取失敗');}};
  r.readAsText(f);
}
function toggleUrl(){var r=document.getElementById('urlRow');r.classList.toggle('show');if(r.classList.contains('show'))document.getElementById('urlInput').focus();}
function importUrl(){
  var u=document.getElementById('urlInput').value.trim();
  if(!u){toast('請輸入網址');return;}
  toast('抓取中…');
  fetch(u).then(function(res){if(!res.ok)throw new Error('HTTP '+res.status);return res.text();})
    .then(function(t){loadInto(parseCSV(t));})
    .catch(function(e){toast('抓取失敗：'+e.message+'（可能跨域限制，請改用檔案或貼上）');});
}

/* ===== 篩選／搜尋 ===== */
function buildFilterCols(){
  document.getElementById('fCol').innerHTML=headers.map(function(h,i){return '<option value="'+i+'">'+esc(h)+'</option>';}).join('');
}
function opChange(){
  var op=document.getElementById('fOp').value;
  var show=(op!=='empty'&&op!=='notempty');
  document.getElementById('fVal').style.display=show?'block':'none';
}
function applyFilter(){
  var op=document.getElementById('fOp').value;
  var val=document.getElementById('fVal').value;
  if(op==='empty'||op==='notempty')filter={col:+document.getElementById('fCol').value,op:op,val:''};
  else filter={col:+document.getElementById('fCol').value,op:op,val:val};
  applyView();
}
function clearFilter(){filter=null;document.getElementById('fVal').value='';applyView();toast('已清除篩選');}
function applyView(){
  search=document.getElementById('searchInput').value;
  var q=search.trim().toLowerCase();
  var out=[];
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(filter){
      var cell=r[filter.col];var cs=cell==null?'':String(cell);var ok=true;
      switch(filter.op){
        case 'contains':ok=cs.toLowerCase().indexOf(filter.val.toLowerCase())>=0;break;
        case 'eq':ok=cs.trim()===filter.val.trim();break;
        case 'gt':ok=isNum(cs)&&isNum(filter.val)&&parseFloat(cs)>parseFloat(filter.val);break;
        case 'lt':ok=isNum(cs)&&isNum(filter.val)&&parseFloat(cs)<parseFloat(filter.val);break;
        case 'empty':ok=cs.trim()==='';break;
        case 'notempty':ok=cs.trim()!=='';break;
      }
      if(!ok)continue;
    }
    if(q){
      var hit=false;
      for(var j=0;j<r.length;j++){if(String(r[j]==null?'':r[j]).toLowerCase().indexOf(q)>=0){hit=true;break;}}
      if(!hit)continue;
    }
    out.push(i);
  }
  lastView=out;
  renderStats(out);
  renderTable(out);
}

/* ===== 統計 ===== */
function renderStats(view){
  var box=document.getElementById('statsBox');
  box.innerHTML='<div class="stat"><span>總列數</span><b>'+rows.length+'</b></div>'+
                '<div class="stat"><span>符合篩選</span><b>'+view.length+'</b></div>';
  // 數值欄統計
  var numBox=document.getElementById('numBox');var info=[];
  for(var c=0;c<headers.length;c++){
    var sum=0,cnt=0,mn=null,mx=null;
    for(var v=0;v<view.length;v++){var val=rows[view[v]][c];if(val==null||String(val).trim()==='')continue;if(!isNum(val))continue;var n=parseFloat(String(val));sum+=n;cnt++;if(mn==null||n<mn)mn=n;if(mx==null||n>mx)mx=n;}
    if(cnt>0)info.push({c:c,sum:sum,cnt:cnt,avg:sum/cnt,mn:mn,mx:mx});
  }
  if(info.length){
    numBox.innerHTML='<div class="stat"><b style="color:var(--accent)">數值欄小計（基於符合篩選的 '+view.length+' 列）</b></div>'+
      info.slice(0,8).map(function(x){return '<div class="stat sub"><span>'+esc(headers[x.c])+'（'+x.cnt+' 筆）</span><b>∑ '+fmt(x.sum)+' · 均 '+fmt(x.avg)+' · 最小 '+fmt(x.mn)+' · 最大 '+fmt(x.mx)+'</b></div>';}).join('');
  }else numBox.innerHTML='';
  // 標籤統計
  var tc={};tags.forEach(function(t){if(t)tc[t]=(tc[t]||0)+1;});
  var tk=Object.keys(tc);
  document.getElementById('tagBox').innerHTML=tk.length?('<div class="stat"><b style="color:var(--accent)">標籤計數</b></div>'+tk.map(function(t){return '<span class="tchip">'+esc(t)+' '+tc[t]+'</span>';}).join('')):'';
}

/* ===== 表格 ===== */
function renderTable(view){
  var wrap=document.getElementById('tblWrap');
  document.getElementById('tblCount').textContent='（'+view.length+' 列）';
  if(!rows.length){wrap.innerHTML='<div class="empty"><div class="big">📭</div>尚無資料，請先匯入</div>';return;}
  var cap=Math.min(view.length,500);
  var head='<tr>'+(selectMode?'<th class="ck"><input type="checkbox" id="ckAll" onchange="toggleAll(this)"></th>':'')+
    headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'<th class="tgcol">標籤</th></tr>';
  var body='';
  for(var k=0;k<cap;k++){
    var i=view[k];var r=rows[i];
    body+='<tr class="'+(tags[i]?'tagged':'')+'">'+
      (selectMode?'<td class="ck"><input type="checkbox" class="ckrow" data-i="'+i+'" '+(sel.has(i)?'checked':'')+' onchange="onRowCheck(this)"></td>':'')+
      r.map(function(x){return '<td>'+esc(x==null?'':x)+'</td>';}).join('')+
      '<td class="tgcell">'+esc(tags[i]||'')+'</td></tr>';
  }
  wrap.innerHTML='<table class="tbl"><thead>'+head+'</thead><tbody>'+body+'</tbody></table>';
  document.getElementById('tblNote').textContent=view.length>cap?('⚠️ 僅顯示前 '+cap+' 行（共 '+view.length+' 行符合）；匯出會包含全部符合列。'):'';
  syncCkAll();
}
function toggleAll(el){
  if(el.checked)lastView.forEach(function(i){sel.add(i);});
  else lastView.forEach(function(i){sel.delete(i);});
  renderTable(lastView);
}
function onRowCheck(el){var i=+el.dataset.i;if(el.checked)sel.add(i);else sel.delete(i);syncCkAll();}
function syncCkAll(){
  var ck=document.getElementById('ckAll');if(!ck)return;
  var all=lastView.length>0&&lastView.every(function(i){return sel.has(i);});
  ck.checked=all;ck.indeterminate=(!all&&lastView.some(function(i){return sel.has(i);}));
}
function toggleSel(){
  selectMode=!selectMode;
  document.getElementById('selBar').classList.toggle('show',selectMode);
  document.getElementById('selBtn').textContent=selectMode?'✅ 結束選取':'☑ 選取模式';
  if(!selectMode)sel.clear();
  renderTable(lastView);
}
function selectAll(){lastView.forEach(function(i){sel.add(i);});renderTable(lastView);toast('已選取 '+sel.size+' 列');}
function clearSel(){sel.clear();renderTable(lastView);}
function tagSelected(){
  var t=document.getElementById('tagInput').value.trim();
  if(!sel.size){toast('請先勾選列');return;}
  sel.forEach(function(i){tags[i]=t;});
  renderStats(lastView);renderTable(lastView);
  toast('已為 '+sel.size+' 列標記「'+(t||'（清空）')+'」');
}
function clearTagSelected(){
  if(!sel.size){toast('請先勾選列');return;}
  sel.forEach(function(i){tags[i]='';});
  renderStats(lastView);renderTable(lastView);
  toast('已清除選取列的標籤');
}

/* ===== 匯出 ===== */
function buildExportRows(){
  var cols=headers.concat(['標籤']);
  var out=[cols];
  lastView.forEach(function(i){
    var r=rows[i].slice();
    while(r.length<headers.length)r.push('');
    r.push(tags[i]||'');
    out.push(r);
  });
  return out;
}
function exportCSV(){
  if(!rows.length){toast('尚無資料');return;}
  JLessShare.shareCSV(buildExportRows(),'jless-table.csv',function(ok){toast(ok?'已開啟分享':'已下載 CSV');});
}
function exportXLSX(){
  if(!rows.length){toast('尚無資料');return;}
  JLessShare.shareXLSX(buildExportRows(),'jless-table.xlsx',function(ok){toast(ok?'已開啟分享':'已下載 XLSX');});
}
function clearData(){
  if(!rows.length){toast('尚無資料');return;}
  if(!confirm('清除目前匯入的資料與標籤？'))return;
  headers=[];rows=[];tags=[];filter=null;search='';sel.clear();lastView=[];
  document.getElementById('csvText').value='';
  document.getElementById('dataArea').style.display='none';
  document.getElementById('tblWrap').innerHTML='';
  toast('已清除');
}

opChange();
</script>
</body>
</html>
