<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<title>缺勤</title>
<link rel="stylesheet" href="theme.css">
<style>
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--fs:1;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 90px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.content{padding:14px 16px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(120,60,80,.06);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{font-size:calc(12.5px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:calc(15px*var(--fs));background:var(--bg);outline:none;color:var(--ink);-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.seg2{display:flex;gap:8px;margin:4px 0 12px}
.seg2 button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px;font-size:calc(14px*var(--fs));font-weight:700;color:var(--ink2);cursor:pointer}
.seg2 button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(120,60,80,.2)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);margin-top:8px;font-weight:700}
.btn.danger{background:#fdecea;color:#cf5a4c;border:1px solid #f6d4ce;margin-top:8px;font-weight:700}
.summary{display:flex;gap:10px;margin-bottom:12px}
.summary .box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(120,60,80,.06)}
.summary .v{font-size:calc(20px*var(--fs));font-weight:800;color:var(--ink)}
.summary .v.ill{color:#cf5a4c}
.summary .v.fam{color:var(--accent)}
.summary .v.tot{color:#2e8f7e}
.summary .l{font-size:calc(11px*var(--fs));color:var(--muted);font-weight:700;margin-top:2px}
.list .item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.list .item .dt{flex:0 0 auto;font-weight:800;font-size:calc(14px*var(--fs));min-width:88px}
.list .item .rs{flex:1;font-size:calc(13px*var(--fs));color:var(--ink2)}
.list .item .rs .h{font-size:calc(11px*var(--fs));color:var(--muted);margin-left:6px}
.list .item .x{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.list .item .x:active{background:var(--line2)}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:calc(13px*var(--fs))}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header><div class="topbar"><div class="title"><span class="logo">🤒</span>缺勤</div></div></header>
  <div class="content">
    <div class="summary">
      <div class="box"><div class="v ill" id="sumIll">0</div><div class="l">因病缺勤</div></div>
      <div class="box"><div class="v fam" id="sumFam">0</div><div class="l">親屬患病</div></div>
      <div class="box"><div class="v tot" id="sumTot">0</div><div class="l">總計</div></div>
    </div>
    <div class="card">
      <div class="field"><label>日期（預設今日）</label><input type="date" id="aDate"></div>
      <div class="field"><label>缺勤原因</label>
        <select id="aReason">
          <option value="ill">因病缺勤</option>
          <option value="family">因親屬患病而缺勤</option>
        </select>
      </div>
      <div class="seg2">
        <button id="hFull" class="on" onclick="setHalf(false)">全日</button>
        <button id="hHalf" onclick="setHalf(true)">半日</button>
      </div>
      <div class="field"><label>備註（選填）</label><input type="text" id="aNote" placeholder="例如：發燒就診"></div>
      <button class="btn primary" onclick="addAbsence()">＋ 新增缺勤記錄</button>
    </div>
    <div class="list" id="list"></div>
  </div>
</div>

<nav class="bottombar">
  <button class="bb primary" onclick="shareAbsence()"><span class="ic">📤</span>分享</button>
  <button class="bb" onclick="resetAbsence()"><span class="ic">🗑️</span>清除</button>
</nav>
<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script src="share.js"></script>
<script>
var KEY='jless_absence_v1';
function uid(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function pad(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.records))return d;}catch(e){}return {records:[]};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();
var half=false;
function setHalf(h){half=h;document.getElementById('hFull').classList.toggle('on',!h);document.getElementById('hHalf').classList.toggle('on',h);}
function initDate(){document.getElementById('aDate').value=todayStr();}
function addAbsence(){
  var date=document.getElementById('aDate').value||todayStr();
  var reason=document.getElementById('aReason').value;
  var note=(document.getElementById('aNote').value||'').trim();
  S.records.push({id:uid(),date:date,reason:reason,half:half,note:note});
  save();renderList();toast('已新增');
  document.getElementById('aNote').value='';
}
function delAbsence(id){S.records=S.records.filter(function(x){return x.id!==id;});save();renderList();}
function renderList(){
  var ill=S.records.filter(function(x){return x.reason==='ill';}).length;
  var fam=S.records.filter(function(x){return x.reason==='family';}).length;
  document.getElementById('sumIll').textContent=ill;
  document.getElementById('sumFam').textContent=fam;
  document.getElementById('sumTot').textContent=S.records.length;
  var box=document.getElementById('list');
  if(!S.records.length){box.innerHTML='<div class="empty">尚無缺勤記錄。</div>';return;}
  var arr=S.records.slice().sort(function(a,b){return a.date<b.date?1:-1;});
  box.innerHTML='';
  arr.forEach(function(r){
    var reasonTxt=r.reason==='ill'?'因病缺勤':'因親屬患病而缺勤';
    var d=document.createElement('div');d.className='item';
    d.innerHTML='<div class="dt">'+r.date+'</div>'+
      '<div class="rs">'+(r.half?'半日 · ':'')+reasonTxt+(r.note?'<span class="h">'+esc(r.note)+'</span>':'')+'</div>'+
      '<div class="x" onclick="delAbsence(\''+r.id+'\')">✕</div>';
    box.appendChild(d);
  });
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function shareAbsence(){
  var ill=S.records.filter(function(x){return x.reason==='ill';}).length;
  var fam=S.records.filter(function(x){return x.reason==='family';}).length;
  var body='缺勤統計\n因病缺勤：'+ill+' 次\n因親屬患病而缺勤：'+fam+' 次\n總計：'+S.records.length+' 次';
  if(window.JLessShare){JLessShare.shareText('缺勤統計',body,function(ok){toast(ok?'已開啟分享':'已複製文字');});}
  else{navigator.clipboard&&navigator.clipboard.writeText(body);toast('已複製');}
}
function resetAbsence(){if(!confirm('清除所有缺勤記錄？'))return;S.records=[];save();renderList();toast('已清除');}
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}
initDate();renderList();
</script>
</body>
</html>
