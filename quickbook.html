<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>記帳</title>
<!-- Google Analytics（統計；不傳個人／敏感資料，離線時靜默） -->
<script defer src="ga.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#fffaf3; --panel:#ffffff; --ink:#3b2530; --ink2:#5f4b55; --muted:#8b7380;
  --line:#f0e2d8; --line2:#f8efe7; --gray-bg:#f6f2ec; --gray-tx:#9a938b; --green:#2e8f7e;
  --fs:1;
}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px * var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 70px);position:relative}

header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));
  backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px * var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}

/* 頂部本月彙總 */
.summary{display:flex;gap:10px;padding:12px 16px 4px}
.summary .box{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.summary .box .lab{font-size:calc(11.5px * var(--fs));color:var(--muted);font-weight:600}
.summary .box .val{font-size:calc(18px * var(--fs));font-weight:800;margin-top:3px}
.summary .box.exp .val{color:var(--accent)}
.summary .box.inc .val{color:var(--green)}

.view{display:none;padding:6px 0 0}
.view.show{display:block}

/* 記帳：分類 */
.tabs{display:flex;gap:8px;margin:12px 16px 0}
.tab{flex:1;text-align:center;padding:10px 0;border-radius:13px;font-weight:700;font-size:calc(14px * var(--fs));
  background:var(--panel);border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tip{text-align:center;color:var(--muted);font-size:calc(12.5px * var(--fs));margin:14px 16px 4px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 16px 16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .1s ease}
.cat:active{transform:scale(.95)}
.cat .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--gray-bg)}
.cat .nm{font-size:calc(12px * var(--fs));color:var(--ink2);font-weight:600}
.cat:active .ic{background:var(--accent-soft)}

/* 明細 */
.sec-h{display:flex;align-items:center;gap:8px;margin:14px 16px 8px}
.sec-h h2{font-size:calc(15px * var(--fs));margin:0;font-weight:700}
.filt{display:flex;gap:6px;margin-left:auto}
.filt .b{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:calc(12px * var(--fs));
  color:var(--ink2);cursor:pointer;user-select:none;-webkit-user-select:none}
.filt .b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.day{font-size:calc(12px * var(--fs));color:var(--muted);font-weight:700;margin:12px 16px 6px}
.txn{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin:0 16px 9px}
.txn .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--gray-bg);flex:0 0 auto}
.txn.inc .ic{background:#e7f5f0}
.txn .meta{flex:1;min-width:0}
.txn .meta .t1{font-weight:700;font-size:calc(13.5px * var(--fs));display:flex;gap:6px;align-items:center}
.txn .meta .t1 .tag{font-size:calc(10.5px * var(--fs));font-weight:600;color:var(--muted);background:var(--line2);border-radius:999px;padding:1px 7px}
.txn .meta .t2{font-size:calc(11.5px * var(--fs));color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn .amt{font-weight:800;font-size:calc(15px * var(--fs));flex:0 0 auto}
.txn.exp .amt{color:var(--accent)} .txn.inc .amt{color:var(--green)}
.txn .del{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:15px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
.txn .del:active{background:var(--line2)}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:calc(13px * var(--fs));line-height:1.7}

/* 圖表 */
.chart-ctrl{display:flex;gap:8px;margin:14px 16px 0;flex-wrap:wrap}
.chart-ctrl .grp{display:flex;gap:6px;flex:1;min-width:140px}
.chart-ctrl .b{flex:1;text-align:center;padding:9px 0;border-radius:11px;border:1px solid var(--line);background:var(--panel);font-size:calc(12.5px * var(--fs));font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;-webkit-user-select:none}
.chart-ctrl .b.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.chart-ctrl .b.on.g{background:var(--green);border-color:var(--green)}
.chart{margin:16px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;overflow:hidden}
.bars{display:flex;align-items:flex-end;gap:6px;height:200px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.bar .col{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--accent);transition:height .25s ease;min-height:2px}
.bar.inc .col{background:var(--green)}
.bar .lab{font-size:calc(9.5px * var(--fs));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bar .v{font-size:calc(9.5px * var(--fs));color:var(--ink2);font-weight:700}
.chart .ttl{font-size:calc(12.5px * var(--fs));color:var(--muted);text-align:center;margin-top:8px}
.subs{margin:14px 16px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.sub-ttl{font-size:calc(13px * var(--fs));font-weight:700;color:var(--ink2);margin-bottom:9px}
.sub{margin-bottom:10px}
.sub-top{display:flex;align-items:center;justify-content:space-between;font-size:calc(13px * var(--fs));margin-bottom:4px}
.sub-nm{font-weight:600;color:var(--ink2)}
.sub-v{font-weight:800;color:var(--ink)}
.sub-bar{height:7px;border-radius:5px;background:var(--line2);overflow:hidden}
.sub-bar i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.subs.sub-inc .sub-bar i{background:var(--green)}
.sub-total{text-align:right;font-size:calc(13px * var(--fs));font-weight:800;color:var(--ink2);margin-top:4px;border-top:1px dashed var(--line);padding-top:8px}
.sub-empty{font-size:calc(12.5px * var(--fs));color:var(--muted);text-align:center;padding:6px 0}

/* 我的 */
.card-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:14px 16px 0;padding:14px}
.card-box h3{margin:0 0 10px;font-size:calc(14px * var(--fs))}
.mng{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:8px}
.mng .ic{font-size:18px} .mng .nm{flex:1;font-weight:600;font-size:calc(13.5px * var(--fs))}
.mng .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.mng .x:active{background:var(--line2)}
.add{display:flex;gap:8px;margin-top:4px}
.add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:calc(13px * var(--fs));font-family:inherit;outline:none;background:var(--bg)}
.add input:focus{border-color:var(--accent)}
.add button{border:none;border-radius:10px;background:var(--accent);color:#fff;padding:0 16px;font-weight:700;font-size:calc(13px * var(--fs));cursor:pointer}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:13px;padding:13px;font-size:calc(14px * var(--fs));font-weight:700;cursor:pointer;margin-top:10px;box-shadow:0 2px 8px rgba(120,60,80,.06);user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:#cf5a4c;border-color:#f6d4ce;background:#fdecea}
.hint{font-size:calc(11.5px * var(--fs));color:var(--muted);line-height:1.6;margin:6px 2px 0}

/* 底部選單 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;
  background:linear-gradient(180deg,rgba(255,250,243,.96),rgba(255,250,243,.99));border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);backdrop-filter:blur(10px)}
.nav .it{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:calc(11px * var(--fs));font-weight:600;cursor:pointer;user-select:none;-webkit-user-select:none}
.nav .it .ti{font-size:20px;line-height:1}
.nav .it.on{color:var(--accent);background:var(--accent-soft)}
.nav .it.plus .ti{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(120,60,80,.25)}

/* 底部輸入 sheet */
.mask{position:fixed;inset:0;background:rgba(40,20,30,.4);z-index:40;display:none}
.mask.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);
  border-radius:22px 22px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);box-shadow:0 -6px 30px rgba(40,20,30,.18);
  transform:translateY(100%);transition:transform .22s ease}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet .head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sheet .head .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--accent-soft)}
.sheet .head .nm{font-weight:700;font-size:calc(15px * var(--fs))}
.sheet .head .x{margin-left:auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--muted);cursor:pointer;background:var(--panel);border:1px solid var(--line)}
.disp{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;align-items:flex-end;min-height:70px;justify-content:center;margin-bottom:10px}
.disp .expr{font-size:calc(14px * var(--fs));color:var(--muted);min-height:1.1em;word-break:break-all;text-align:right}
.disp .amt{font-size:calc(32px * var(--fs));font-weight:800;color:var(--ink);line-height:1.1}
.disp .amt small{font-size:calc(17px * var(--fs));font-weight:700;color:var(--accent);margin-right:2px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad .key{height:52px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:calc(19px * var(--fs));font-weight:700;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;display:flex;align-items:center;justify-content:center}
.pad .key:active{transform:scale(.95);background:var(--line2)}
.pad .key.op{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.pad .key.eq{background:var(--accent);color:#fff;border-color:var(--accent)}
.pad .key.fn{color:var(--ink2);font-size:calc(12.5px * var(--fs));font-weight:600;background:var(--gray-bg);border-color:transparent}
.row{display:flex;align-items:center;gap:8px;margin-top:10px}
.note{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;font-size:calc(14px * var(--fs));font-family:inherit;outline:none}
.note:focus{border-color:var(--accent)}
.dt input{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 8px;font-size:calc(12px * var(--fs));color:var(--ink2);font-family:inherit;outline:none}
.acc{display:flex;gap:7px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.acc::-webkit-scrollbar{display:none}
.acc .a{flex:0 0 auto;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:calc(12px * var(--fs));color:var(--ink2);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.acc .a.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.save{margin-top:12px;width:100%;border:none;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-size:calc(16px * var(--fs));font-weight:800;cursor:pointer;box-shadow:0 5px 16px rgba(120,60,80,.2);user-select:none;-webkit-user-select:none}
.save:active{transform:scale(.99)}

a:focus-visible,button:focus-visible,input:focus-visible,.key:focus-visible,.cat:focus-visible,.tab:focus-visible,.nav .it:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px * var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar"><div class="title"><span class="logo">🧾</span>記帳</div></div>
  </header>

  <div class="summary">
    <div class="box exp"><div class="lab">本月支出</div><div class="val" id="sumExp">¥0</div></div>
    <div class="box inc"><div class="lab">本月收入</div><div class="val" id="sumInc">¥0</div></div>
  </div>

  <!-- 記帳 -->
  <section class="view show" id="vEntry">
    <div class="tabs">
      <div class="tab active" id="tabExp" onclick="switchType('expense')">支出</div>
      <div class="tab" id="tabInc" onclick="switchType('income')">收入</div>
    </div>
    <div class="tip">點選分類，於下方輸入金額</div>
    <div class="cats" id="cats"></div>
  </section>

  <!-- 明細 -->
  <section class="view" id="vList">
    <div class="sec-h">
      <h2>明細</h2>
      <div class="filt">
        <div class="b on" id="fAll" onclick="setFilt('all')">全部</div>
        <div class="b" id="fExp" onclick="setFilt('expense')">支出</div>
        <div class="b" id="fInc" onclick="setFilt('income')">收入</div>
      </div>
    </div>
    <div id="list"></div>
  </section>

  <!-- 圖表 -->
  <section class="view" id="vChart">
    <div class="chart-ctrl">
      <div class="grp">
        <div class="b on" id="cExp" onclick="setChartType('expense')">開支</div>
        <div class="b g" id="cInc" onclick="setChartType('income')">收入</div>
      </div>
      <div class="grp">
        <div class="b on" id="cWeek" onclick="setChartMode('week')">週</div>
        <div class="b" id="cMonth" onclick="setChartMode('month')">月</div>
        <div class="b" id="cYear" onclick="setChartMode('year')">年</div>
      </div>
    </div>
    <div class="chart"><div class="bars" id="bars"></div><div class="ttl" id="chartTtl"></div></div>
    <div class="subs" id="subs"></div>
    <button class="btn" onclick="shareChart()" style="margin:12px 16px 16px">📤 分享統計圖</button>
  </section>

  <!-- 我的 -->
  <section class="view" id="vMine">
    <div class="card-box">
      <h3>支出分類（可增刪）</h3>
      <div id="mngExp"></div>
      <div class="add"><input id="newExp" placeholder="新增支出分類，如：醫療"><button onclick="addCat('expense')">新增</button></div>
    </div>
    <div class="card-box">
      <h3>收入分類（可增刪）</h3>
      <div id="mngInc"></div>
      <div class="add"><input id="newInc" placeholder="新增收入分類，如：獎金"><button onclick="addCat('income')">新增</button></div>
    </div>
    <div class="card-box">
      <h3>帳戶（可增刪）</h3>
      <div id="mngAcc"></div>
      <div class="add"><input id="newAcc" placeholder="新增帳戶，如：電子錢包"><button onclick="addAcc()">新增</button></div>
    </div>
    <div class="card-box">
      <h3>備份與匯入（本應用）</h3>
      <div class="hint">匯出只包含本應用的分類、帳戶與記帳資料；匯入會取代目前內容。</div>
      <button class="btn primary" onclick="exportQB()">⬇️ 匯出本應用備份</button>
      <button class="btn" onclick="importQB()">⬆️ 匯入本應用備份</button>
      <input type="file" id="qbFile" accept="application/json,.json" style="display:none" onchange="onQBFile(event)">
    </div>
    <div class="card-box">
      <button class="btn danger" onclick="clearAll()">🗑️ 清除全部資料</button>
    </div>
  </section>
</div>

<!-- 底部選單 -->
<nav class="nav">
  <div class="it on" data-v="vList" onclick="goView('vList')"><span class="ti">📋</span>明細</div>
  <div class="it" data-v="vChart" onclick="goView('vChart')"><span class="ti">📊</span>圖表</div>
  <div class="it plus" onclick="goView('vEntry')"><span class="ti">＋</span>記帳</div>
  <div class="it" data-v="vMine" onclick="goView('vMine')"><span class="ti">👤</span>我的</div>
</nav>

<!-- 輸入 sheet -->
<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="head">
    <div class="ic" id="sIc">🍜</div>
    <div class="nm" id="sNm">餐飲</div>
    <div class="x" onclick="closeSheet()">✕</div>
  </div>
  <div class="disp">
    <div class="expr" id="sExpr"></div>
    <div class="amt" id="sAmt"><small>¥</small>0</div>
  </div>
  <div class="pad">
    <div class="key" onclick="press('7')">7</div><div class="key" onclick="press('8')">8</div><div class="key" onclick="press('9')">9</div><div class="key fn" onclick="setToday()">📅</div>
    <div class="key" onclick="press('4')">4</div><div class="key" onclick="press('5')">5</div><div class="key" onclick="press('6')">6</div><div class="key op" onclick="press('+')">+</div>
    <div class="key" onclick="press('1')">1</div><div class="key" onclick="press('2')">2</div><div class="key" onclick="press('3')">3</div><div class="key op" onclick="press('-')">−</div>
    <div class="key" onclick="press('.')">.</div><div class="key" onclick="press('0')">0</div><div class="key fn" onclick="back()">⌫</div><div class="key eq" onclick="equal()">=</div>
  </div>
  <div class="row">
    <input class="note" id="sNote" placeholder="備註（選填）" maxlength="60">
    <div class="dt"><input type="date" id="sDate"></div>
  </div>
  <div class="acc" id="sAcc"></div>
  <button class="save" onclick="saveTxn()">保存記錄</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 資料模型 ============ */
var KEY='jless_quickbook_v1';
var DEF_EXP=[
  {id:'c_dining',name:'餐飲',icon:'🍜'},{id:'c_shop',name:'購物',icon:'🛍️'},{id:'c_daily',name:'日用',icon:'🧴'},
  {id:'c_trans',name:'交通',icon:'🚌'},{id:'c_veg',name:'蔬菜',icon:'🥬'},{id:'c_fruit',name:'水果',icon:'🍎'},
  {id:'c_coffee',name:'咖啡',icon:'☕'},{id:'c_snack',name:'零食',icon:'🍪'},{id:'c_sport',name:'運動',icon:'🏃'},
  {id:'c_fun',name:'娛樂',icon:'🎮'},{id:'c_comm',name:'通訊',icon:'📞'},{id:'c_beauty',name:'美容',icon:'💄'}
];
var DEF_INC=[
  {id:'i_salary',name:'薪金',icon:'💰'},{id:'i_part',name:'兼職',icon:'💼'},{id:'i_red',name:'紅包',icon:'🧧'},
  {id:'i_inv',name:'投資',icon:'📈'},{id:'i_int',name:'利息',icon:'🏦'},{id:'i_other',name:'其他',icon:'➕'}
];
var DEF_ACC=[
  {id:'a_none',name:'不關聯帳戶'},{id:'a_cash',name:'現金'},{id:'a_save',name:'儲蓄卡'},
  {id:'a_cred',name:'信用卡'},{id:'a_ewal',name:'電子錢包'}
];

var S=null, curType='expense', selCat=null, curAcc='a_none';
var expr='', justEval=false, sheetDate=todayStr(), listFilt='all';
var chartType='expense', chartMode='week';

function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmt(n){return (Math.round(n*100)/100).toLocaleString('zh-Hant',{minimumFractionDigits:0,maximumFractionDigits:2});}
function money(n){return '¥'+fmt(n);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function defaultState(){return{v:1,expense:DEF_EXP.map(c=>({id:c.id,name:c.name,icon:c.icon})),income:DEF_INC.map(c=>({id:c.id,name:c.name,icon:c.icon})),accounts:DEF_ACC.map(a=>({id:a.id,name:a.name})),txns:[]};}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&typeof d==='object'){
    if(!Array.isArray(d.expense)||!d.expense.length)d.expense=DEF_EXP.map(c=>({id:c.id,name:c.name,icon:c.icon}));
    if(!Array.isArray(d.income)||!d.income.length)d.income=DEF_INC.map(c=>({id:c.id,name:c.name,icon:c.icon}));
    if(!Array.isArray(d.accounts)||!d.accounts.length)d.accounts=DEF_ACC.map(a=>({id:a.id,name:a.name}));
    if(!Array.isArray(d.txns))d.txns=[];
    d.txns=d.txns.filter(t=>t&&(t.type==='expense'||t.type==='income')&&isFinite(+t.amount)&&+t.amount!==0).map(t=>({
      id:t.id||uid(),type:t.type,catId:String(t.catId||''),accId:String(t.accId||'a_none'),
      amount:Math.abs(+t.amount),note:String(t.note||'').slice(0,60),ts:isFinite(+t.ts)?+t.ts:Date.now(),
      date:String(t.date||'').length===10?t.date:new Date(isFinite(+t.ts)?+t.ts:Date.now()).toISOString().slice(0,10)}));
    return d;}}}catch(e){}
  return defaultState();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('儲存失敗');}}

/* ============ 渲染 ============ */
function catsOf(t){return t==='expense'?S.expense:S.income;}
function catById(t,id){var a=catsOf(t);for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null;}
function accById(id){for(var i=0;i<S.accounts.length;i++)if(S.accounts[i].id===id)return S.accounts[i];return null;}

function renderSummary(){
  var now=new Date(),y=now.getFullYear(),m=now.getMonth(),se=0,si=0;
  S.txns.forEach(function(t){var d=new Date(t.ts);if(d.getFullYear()===y&&d.getMonth()===m){if(t.type==='expense')se+=t.amount;else si+=t.amount;}});
  document.getElementById('sumExp').textContent=money(se);
  document.getElementById('sumInc').textContent=money(si);
}
function renderCats(){
  var w=document.getElementById('cats');w.innerHTML='';
  catsOf(curType).forEach(function(c){
    var d=document.createElement('div');d.className='cat';
    d.innerHTML='<div class="ic">'+c.icon+'</div><div class="nm">'+esc(c.name)+'</div>';
    d.onclick=function(){openSheet(c.id);};
    w.appendChild(d);
  });
}
function renderMine(){
  renderMng('mngExp',S.expense,'expense');
  renderMng('mngInc',S.income,'income');
  renderMngAcc();
}
function renderMng(id,arr,type){
  var b=document.getElementById(id);b.innerHTML='';
  arr.forEach(function(c){var d=document.createElement('div');d.className='mng';
    d.innerHTML='<span class="ic">'+c.icon+'</span><span class="nm">'+esc(c.name)+'</span><span class="x" onclick="delCat(\''+type+'\',\''+c.id+'\')">✕</span>';
    b.appendChild(d);});
}
function renderMngAcc(){
  var b=document.getElementById('mngAcc');b.innerHTML='';
  S.accounts.forEach(function(a){var d=document.createElement('div');d.className='mng';
    d.innerHTML='<span class="ic">🏦</span><span class="nm">'+esc(a.name)+'</span><span class="x" onclick="delAcc(\''+a.id+'\')">✕</span>';
    b.appendChild(d);});
}

/* ============ 視圖切換 ============ */
function goView(v){
  ['vEntry','vList','vChart','vMine'].forEach(function(id){document.getElementById(id).classList.toggle('show',id===v);});
  document.querySelectorAll('.nav .it').forEach(function(it){it.classList.toggle('on',it.dataset.v===v || (v==='vEntry'&&it.classList.contains('plus')));});
  if(v==='vList')renderList();
  if(v==='vChart')renderChart();
  if(v==='vMine')renderMine();
  if(v==='vEntry')renderCats();
}

/* ============ 記帳：sheet ============ */
function switchType(t){
  curType=t;
  document.getElementById('tabExp').classList.toggle('active',t==='expense');
  document.getElementById('tabInc').classList.toggle('active',t==='income');
  selCat=catsOf(t).length?catsOf(t)[0].id:null;
  renderCats();
}
function openSheet(catId){
  selCat=catId; expr=''; justEval=false; sheetDate=todayStr();
  var c=catById(curType,catId);
  document.getElementById('sIc').textContent=c?c.icon:'❓';
  document.getElementById('sNm').textContent=c?c.name:'未選分類';
  document.getElementById('sNote').value='';
  document.getElementById('sDate').value=sheetDate;
  renderSAcc(); renderSDisp();
  document.getElementById('mask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('mask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function renderSAcc(){
  var w=document.getElementById('sAcc');w.innerHTML='';
  S.accounts.forEach(function(a){var d=document.createElement('div');d.className='a'+(a.id===curAcc?' sel':'');d.textContent=a.name;
    d.onclick=function(){curAcc=a.id;renderSAcc();};w.appendChild(d);});
}
function renderSDisp(){
  document.getElementById('sExpr').textContent=expr;
  var v=evalExpr(expr);
  document.getElementById('sAmt').innerHTML='<small>¥</small>'+(expr===''?'0':(isNaN(v)?'0':fmt(v)));
}

/* ============ 計算機 ============ */
function press(ch){
  if(justEval&&/[0-9.]/.test(ch)){expr='';justEval=false;}
  if(justEval&&(ch==='+'||ch==='-')){expr=evalExpr(expr).toString();justEval=false;}
  if(ch==='.'){var p=expr.split(/[+\-]/),last=p[p.length-1];if(last.indexOf('.')>=0)return;if(last===''){expr+='0.';renderSDisp();return;}}
  if(ch==='+'||ch==='-'){if(expr==='')return;if(/[+\-]$/.test(expr)){expr=expr.slice(0,-1)+ch;renderSDisp();return;}}
  expr+=ch;renderSDisp();
}
function back(){if(justEval){expr='';justEval=false;}else expr=expr.slice(0,-1);renderSDisp();}
function equal(){var v=evalExpr(expr);if(isNaN(v)){toast('算式無效');return;}expr=v.toString();justEval=true;renderSDisp();}
function evalExpr(s){s=(s||'').trim();if(!s)return 0;if(!/^[0-9+\-*/. ]+$/.test(s))return NaN;
  try{var r=Function('"use strict";return ('+s+')')();if(typeof r!=='number'||!isFinite(r))return NaN;return r;}catch(e){return NaN;}}
function setToday(){sheetDate=todayStr();document.getElementById('sDate').value=sheetDate;toast('已設為今天');}

function saveTxn(){
  var c=catById(curType,selCat);
  if(!c){toast('請先選擇分類');return;}
  var v=evalExpr(expr);
  if(expr===''||isNaN(v)||v<=0){toast('請輸入金額');return;}
  var note=document.getElementById('sNote').value.trim();
  var date=document.getElementById('sDate').value||todayStr();
  var t={id:uid(),type:curType,catId:c.id,accId:curAcc,amount:Math.round(v*100)/100,note:note,ts:dateToTs(date),date:date};
  S.txns.push(t);save();
  closeSheet();renderSummary();
  toast('已記錄 '+money(t.amount)+' · '+c.name);
}
function dateToTs(d){var p=d.split('-');return new Date(+p[0],+p[1]-1,+p[2],12,0,0).getTime();}

/* ============ 明細 ============ */
function setFilt(f){listFilt=f;document.getElementById('fAll').classList.toggle('on',f==='all');document.getElementById('fExp').classList.toggle('on',f==='expense');document.getElementById('fInc').classList.toggle('on',f==='income');renderList();}
function renderList(){
  var arr=S.txns.slice().sort(function(a,b){return b.ts-a.ts;}).filter(function(t){return listFilt==='all'||t.type===listFilt;});
  var box=document.getElementById('list');
  if(!arr.length){box.innerHTML='<div class="empty">還沒有記錄。<br>點底部「＋ 記帳」開始吧。</div>';return;}
  var groups={},order=[];
  arr.forEach(function(t){var d=t.date;if(!groups[d]){groups[d]=[];order.push(d);}groups[d].push(t);});
  var html='';
  order.forEach(function(d){
    var dt=new Date(d+'T12:00:00');
    html+='<div class="day">'+dt.getFullYear()+'/'+pad(dt.getMonth()+1)+'/'+pad(dt.getDate())+'（週'+'日一二三四五六'.charAt(dt.getDay())+'）</div>';
    groups[d].forEach(function(t){
      var c=catById(t.type,t.catId)||{icon:'❓',name:'未知'};
      var a=accById(t.accId);
      html+='<div class="txn '+(t.type==='income'?'inc':'exp')+'">'+
        '<div class="ic">'+c.icon+'</div>'+
        '<div class="meta"><div class="t1">'+esc(c.name)+(a&&a.id!=='a_none'?'<span class="tag">'+esc(a.name)+'</span>':'')+'</div>'+
        '<div class="t2">'+(t.note?esc(t.note):'')+'</div></div>'+
        '<div class="amt">'+(t.type==='income'?'+':'−')+money(t.amount).slice(1)+'</div>'+
        '<div class="del" onclick="delTxn(\''+t.id+'\')">✕</div></div>';
    });
  });
  box.innerHTML=html;
}
function delTxn(id){if(!confirm('刪除這筆記錄？'))return;S.txns=S.txns.filter(function(t){return t.id!==id;});save();renderSummary();renderList();toast('已刪除');}

/* ============ 圖表 ============ */
function setChartType(t){chartType=t;document.getElementById('cExp').classList.toggle('on',t==='expense');document.getElementById('cInc').classList.toggle('on',t==='income');renderChart();}
function setChartMode(m){chartMode=m;document.getElementById('cWeek').classList.toggle('on',m==='week');document.getElementById('cMonth').classList.toggle('on',m==='month');document.getElementById('cYear').classList.toggle('on',m==='year');renderChart();}
function keyOf(d){
  /* d 為本地 Date，直接用本地年月日組鍵，避免 toISOString 的 UTC 時差造成月份／年份錯位 */
  if(chartMode==='week'){
    var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    var day=(x.getDay()+6)%7; /* 0=週一 */
    x.setDate(x.getDate()-day);
    return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate());
  }
  if(chartMode==='month') return d.getFullYear()+'-'+pad(d.getMonth()+1);
  return ''+d.getFullYear();
}
function buckets(){
  var now=new Date();
  var n=chartMode==='week'?8:chartMode==='month'?12:5;
  var map={},labels=[];
  for(var i=n-1;i>=0;i--){
    var d;
    if(chartMode==='week'){ d=new Date(now.getFullYear(),now.getMonth(),now.getDate()); d.setDate(d.getDate()-((d.getDay()+6)%7)-i*7); }
    else if(chartMode==='month'){ d=new Date(now.getFullYear(),now.getMonth()-i,1); }
    else { d=new Date(now.getFullYear()-i,0,1); }
    var k=keyOf(d);
    if(!map[k]){ map[k]=0; labels.push(k); }
  }
  S.txns.forEach(function(t){
    if(t.type!==chartType) return;
    var p=t.date.split('-'); var td=new Date(+p[0], +p[1]-1, +p[2]);
    var k=keyOf(td);
    if(k in map) map[k]+=t.amount;
  });
  return labels.map(function(k){ return {k:k, v:map[k]}; });
}
function bucketsLabel(k){
  if(chartMode==='week'){ var p=k.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return (d.getMonth()+1)+'/'+d.getDate(); }
  if(chartMode==='month') return k.slice(5);
  return k.slice(2);
}
/* 類別小計：與圖表同一時間窗內、依所選收支類型分類加總 */
function catSubtotals(){
  var data=buckets();
  if(!data.length) return [];
  var lo=data[0].k, hi=data[data.length-1].k;
  var map={}, order=[];
  S.txns.forEach(function(t){
    if(t.type!==chartType) return;
    var p=t.date.split('-'); var td=new Date(+p[0], +p[1]-1, +p[2]);
    var k=keyOf(td);
    if(k<lo || k>hi) return;
    var c=catById(chartType,t.catId)||{name:'未知',icon:'❓'};
    if(!map[c.name]){ map[c.name]={name:c.name,icon:c.icon,v:0}; order.push(c.name); }
    map[c.name].v+=t.amount;
  });
  var arr=order.map(function(n){ return map[n]; });
  arr.sort(function(a,b){ return b.v-a.v; });
  return arr;
}
function renderSubs(){
  var box=document.getElementById('subs');
  box.className='subs'+(chartType==='income'?' sub-inc':'');
  var arr=catSubtotals();
  var name=chartType==='expense'?'開支':'收入';
  if(!arr.length){ box.innerHTML='<div class="sub-empty">本期暫無'+name+'記錄</div>'; return; }
  var total=arr.reduce(function(s,a){ return s+a.v; },0);
  var html='<div class="sub-ttl">'+name+' · 類別小計</div>';
  arr.forEach(function(a){
    var pct=total>0?Math.round(a.v/total*100):0;
    html+='<div class="sub"><div class="sub-top"><span class="sub-nm">'+a.icon+' '+esc(a.name)+'</span><span class="sub-v">'+money(a.v)+'</span></div>'+
      '<div class="sub-bar"><i style="width:'+pct+'%"></i></div></div>';
  });
  html+='<div class="sub-total">合計 '+money(total)+'</div>';
  box.innerHTML=html;
}
function renderChart(){
  var data=buckets();
  var max=0;data.forEach(function(b){if(b.v>max)max=b.v;});
  var html='';
  data.forEach(function(b){
    var h=max>0?Math.round(b.v/max*100):0;
    html+='<div class="bar '+(chartType==='income'?'inc':'')+'"><div class="v">'+(b.v>0?fmt(b.v):'')+'</div>'+
      '<div class="col" style="height:'+h+'%"></div><div class="lab">'+esc(bucketsLabel(b.k))+'</div></div>';
  });
  document.getElementById('bars').innerHTML=html;
  var name=chartType==='expense'?'開支':'收入';
  var unit=chartMode==='week'?'每週':chartMode==='month'?'每月':'每年';
  document.getElementById('chartTtl').textContent=name+' · '+unit;
  renderSubs();
}

/* ============ 分享統計（圖片 / 文字 / Excel） ============ */
function drawChartCanvas(){
  var data=buckets();
  var name=chartType==='expense'?'開支':'收入';
  var unit=chartMode==='week'?'每週':chartMode==='month'?'每月':'每年';
  var accent=JLessShare.getVar('--accent','#c23b6a');
  var green=JLessShare.getVar('--green','#2e8f7e');
  var bc=chartType==='income'?green:accent;
  var subs=catSubtotals();
  var W=720,P=30,topH=92,barH=230,gap=18;
  var subH=subs.length?(34+subs.length*40+16):0;
  var H=topH+barH+gap+subH+44;
  var scale=2,c=document.createElement('canvas');c.width=W*scale;c.height=H*scale;
  var x=c.getContext('2d');x.scale(scale,scale);
  x.fillStyle=JLessShare.getVar('--bg','#fffaf3');x.fillRect(0,0,W,H);
  x.textAlign='left';
  x.fillStyle=JLessShare.getVar('--ink','#3b2530');x.font='bold 30px sans-serif';
  x.fillText('記帳 · '+name+'統計',P,46);
  x.fillStyle=JLessShare.getVar('--muted','#8b7380');x.font='15px sans-serif';
  x.fillText('按'+unit+' · '+todayStr(),P,72);
  var baseY=topH+barH;
  var max=0;data.forEach(function(b){if(b.v>max)max=b.v;});
  var slot=(W-P*2)/data.length,bw=Math.min(46,slot*0.6);
  data.forEach(function(b,i){
    var bh=max>0?Math.round(b.v/max*(barH-26)):0;
    var cx=P+slot*i+slot/2;
    if(b.v>0){x.fillStyle=JLessShare.getVar('--ink2','#5f4b55');x.font='bold 14px sans-serif';x.textAlign='center';x.fillText(fmt(b.v),cx,baseY-bh-8);}
    x.fillStyle=bc;JLessShare.roundRect(x,cx-bw/2,baseY-bh,bw,bh,6);x.fill();
    x.fillStyle=JLessShare.getVar('--muted','#8b7380');x.font='13px sans-serif';x.textAlign='center';
    x.fillText(bucketsLabel(b.k),cx,baseY+18);
  });
  x.strokeStyle=JLessShare.getVar('--line','#f0e2d8');x.lineWidth=1;x.beginPath();x.moveTo(P,baseY+2);x.lineTo(W-P,baseY+2);x.stroke();
  if(subs.length){
    var sy=baseY+gap+6;
    x.fillStyle=JLessShare.getVar('--ink','#3b2530');x.font='bold 18px sans-serif';x.textAlign='left';
    x.fillText(name+' · 類別小計',P,sy);sy+=22;
    var total=subs.reduce(function(s,a){return s+a.v;},0);
    subs.forEach(function(a){
      x.fillStyle=JLessShare.getVar('--ink2','#5f4b55');x.font='15px sans-serif';x.textAlign='left';
      x.fillText((a.icon||'')+' '+a.name,P,sy);
      x.fillStyle=JLessShare.getVar('--ink','#3b2530');x.font='bold 15px sans-serif';x.textAlign='right';
      x.fillText(money(a.v),W-P,sy);
      var pct=total>0?a.v/total:0;
      x.fillStyle=JLessShare.getVar('--line2','#f8efe7');JLessShare.roundRect(x,P,sy+8,W-P*2,8,4);x.fill();
      x.fillStyle=bc;JLessShare.roundRect(x,P,sy+8,(W-P*2)*pct,8,4);x.fill();
      sy+=40;
    });
    sy+=6;
    x.fillStyle=JLessShare.getVar('--ink2','#5f4b55');x.font='bold 16px sans-serif';x.textAlign='right';
    x.fillText('合計 '+money(total),W-P,sy);
  }
  x.fillStyle='#c9bdb5';x.font='13px sans-serif';x.textAlign='left';
  x.fillText('由 jless 工具箱產生',P,H-18);
  return c;
}
function chartToText(){
  var data=buckets();
  var name=chartType==='expense'?'開支':'收入';
  var unit=chartMode==='week'?'每週':chartMode==='month'?'每月':'每年';
  var lines=['記帳 · '+name+'統計（按'+unit+'）','日期：'+todayStr(),''];
  data.forEach(function(b){ lines.push((b.v>0?money(b.v):'—')+'  '+bucketsLabel(b.k)); });
  var subs=catSubtotals();
  if(subs.length){
    var total=subs.reduce(function(s,a){return s+a.v;},0);
    lines.push('','【類別小計】');
    subs.forEach(function(a){ lines.push((a.icon||'')+' '+a.name+'  '+money(a.v)); });
    lines.push('合計  '+money(total));
  }
  return lines.join('\n');
}
function chartToCSV(){
  var data=buckets();
  var name=chartType==='expense'?'開支':'收入';
  var rows=[['期間',name+'金額']];
  data.forEach(function(b){ rows.push([bucketsLabel(b.k), b.v]); });
  var subs=catSubtotals();
  if(subs.length){
    rows.push(['', '']);
    rows.push(['類別小計', name+'金額']);
    subs.forEach(function(a){ rows.push([a.name, a.v]); });
    var total=subs.reduce(function(s,a){return s+a.v;},0);
    rows.push(['合計', total]);
  }
  return rows;
}
function shareChart(){
  if(!window.JLessShare){toast('分享模組未載入');return;}
  var data=buckets();
  if(!data.length||data.every(function(b){return b.v===0;})){toast('暫無數據可分享');return;}
  var name=chartType==='expense'?'開支':'收入';
  var unit=chartMode==='week'?'每週':chartMode==='month'?'每月':'每年';
  JLessShare.openSheet({
    title:'分享「'+name+'·按'+unit+'」統計',
    image:function(){ JLessShare.shareImage(drawChartCanvas(),'quickbook-'+todayStr()+'.png',function(ok){toast(ok?'已開啟分享':'已儲存統計圖');}); },
    text:function(){ JLessShare.shareText('記帳統計 · '+name,chartToText(),function(ok){toast(ok?'已開啟分享':'已複製文字');}); },
    excel:function(){ JLessShare.shareCSV(chartToCSV(),'quickbook-'+name+'-'+todayStr()+'.csv',function(ok){toast(ok?'已開啟分享':'已匯出 CSV');}); }
  });
}

/* ============ 我的：分類/帳戶管理 ============ */
function addCat(t){var inp=document.getElementById(t==='expense'?'newExp':'newInc');var name=inp.value.trim();if(!name)return;
  var arr=t==='expense'?S.expense:S.income;arr.push({id:uid(),name:name.slice(0,8),icon:'🏷️'});inp.value='';save();renderMine();toast('已新增分類');}
function delCat(t,id){var arr=t==='expense'?S.expense:S.income;if(arr.length<=1){toast('至少保留一個分類');return;}
  if(S.txns.some(function(x){return x.type===t&&x.catId===id;})){if(!confirm('有記錄使用此分類，刪除後變成「未知」分類，資料仍保留。確定？'))return;}
  var i=arr.findIndex(function(c){return c.id===id;});if(i<0)return;arr.splice(i,1);save();renderMine();if(selCat===id)selCat=arr[0].id;}
function addAcc(){var inp=document.getElementById('newAcc');var name=inp.value.trim();if(!name)return;
  S.accounts.push({id:uid(),name:name.slice(0,10)});inp.value='';save();renderMine();toast('已新增帳戶');}
function delAcc(id){if(id==='a_none'){toast('「不關聯帳戶」不可刪除');return;}
  if(S.accounts.length<=1){toast('至少保留一個帳戶');return;}
  if(S.txns.some(function(x){return x.accId===id;})){if(!confirm('有記錄使用此帳戶，刪除後改為「不關聯帳戶」。確定？'))return;S.txns.forEach(function(x){if(x.accId===id)x.accId='a_none';});}
  var i=S.accounts.findIndex(function(a){return a.id===id;});if(i<0)return;S.accounts.splice(i,1);save();renderMine();if(curAcc===id)curAcc='a_none';}

/* ============ 備份/匯入（本應用） ============ */
function ymd(){var d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
function exportQB(){JLessBackup.export([KEY],'quickbook-backup-'+ymd()+'.json');toast('已匯出本應用備份');}
function importQB(){document.getElementById('qbFile').click();}
function onQBFile(ev){var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  JLessBackup.importFromFile(f,[KEY],function(ok,msg){
    if(!ok){alert(msg||'匯入失敗');return;}
    if(!confirm('匯入會取代目前本應用的所有資料。確定？')){location.reload();return;}
    toast('已匯入，重整中…');setTimeout(function(){location.reload();},500);
  });}
function clearAll(){if(!confirm('清除全部記帳資料與自訂分類／帳戶，且無法復原。\n建議先匯出備份。確定？'))return;
  S=defaultState();selCat=S.expense[0].id;curAcc='a_none';save();renderSummary();renderCats();renderMine();toast('已清除全部資料');}

/* ============ 工具 ============ */
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}

/* ============ 初始化 ============ */
S=load();
selCat=S.expense.length?S.expense[0].id:null;
curAcc=S.accounts.some(function(a){return a.id==='a_none';})?'a_none':(S.accounts[0]?S.accounts[0].id:'a_none');
renderSummary();renderCats();
</script>
