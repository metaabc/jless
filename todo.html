<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fffaf3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>待辦</title>
<!-- Google Analytics（統計；不傳個人／敏感資料，離線時靜默） -->
<script defer src="ga.js"></script>
<link rel="stylesheet" href="theme.css">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#fffaf3;--panel:#fff;--ink:#3b2530;--ink2:#5f4b55;--muted:#8b7380;--line:#f0e2d8;--line2:#f8efe7;--gray-bg:#f6f2ec;--fs:1;}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:contain;touch-action:manipulation;font-size:calc(15px*var(--fs));line-height:1.5}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 0 calc(env(safe-area-inset-bottom) + 86px);position:relative}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(255,250,243,.97),rgba(255,250,243,.9));backdrop-filter:saturate(140%) blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.topbar{display:flex;align-items:center;gap:10px}
.title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:calc(17px*var(--fs))}
.title .logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.gear{margin-left:auto;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;box-shadow:0 2px 8px rgba(120,60,80,.08);user-select:none;-webkit-user-select:none}
.gear:active{transform:scale(.94)}

.listtabs{display:flex;gap:8px;margin:12px 16px 0;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.listtabs::-webkit-scrollbar{display:none}
.listtabs .lt{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:calc(13px*var(--fs));font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;user-select:none;-webkit-user-select:none}
.listtabs .lt.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.listtabs .lt .cx{font-size:13px;opacity:.7}
.listtabs .add{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px dashed var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:var(--accent-soft);user-select:none;-webkit-user-select:none}

.tasks{padding:12px 16px 0}
.task{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;align-items:flex-start}
.task.done{opacity:.55}
.task.done .ti2{text-decoration:line-through;color:var(--muted)}
.task .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--accent);flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;margin-top:1px}
.task.done .chk{background:var(--accent)}
.task .body{flex:1;min-width:0}
.task .ti2{font-weight:700;font-size:calc(14px*var(--fs))}
.task .ct{font-size:calc(12.5px*var(--fs));color:var(--ink2);margin-top:3px;white-space:pre-wrap;word-break:break-word}
.task .due{display:inline-flex;align-items:center;gap:4px;font-size:calc(11px*var(--fs));font-weight:700;color:var(--muted);background:var(--line2);border-radius:999px;padding:2px 8px;margin-top:6px}
.task .due.over{color:#cf5a4c;background:#fdecea}
.task .pin-ic{margin-right:5px;font-size:calc(12px*var(--fs))}
.task .atts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.task .atts img{width:54px;height:54px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.task .op{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.task .op .grip{width:28px;height:28px;border-radius:8px;background:var(--line2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:grab;user-select:none;-webkit-user-select:none;font-size:14px}
.task .op .x{width:28px;height:28px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;font-size:14px}
.task .op .x:active{background:var(--line2)}
.task.dragging{opacity:.4}
.task.dropbefore{border-top:3px solid var(--accent)}
.tasks .lv-grip{width:28px;height:28px;border-radius:8px;background:var(--line2);color:var(--muted);font-size:14px}
.lv-list .task{padding:9px 11px;margin-bottom:7px}
.lv-list .task .ct{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:calc(13px*var(--fs));line-height:1.7}
.soonbar{background:#fdecea;color:#cf5a4c;border:1px solid #f6d4ce;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:calc(13px*var(--fs));font-weight:700}
.addbtn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 6px 18px rgba(120,60,80,.3);cursor:pointer;z-index:25;display:flex;align-items:center;justify-content:center}
.addbtn:active{transform:scale(.96)}

/* modal */
.mask{position:fixed;inset:0;background:rgba(40,20,30,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--bg);border-radius:20px 20px 0 0;max-height:90vh;overflow:auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 20px);animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:2px 0 12px;font-size:calc(16px*var(--fs))}
.sheet .close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--muted);cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:12px}
.field label{font-size:calc(12px*var(--fs));color:var(--muted);font-weight:700;display:block;margin-bottom:5px}
.field input[type=text],.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:11px 12px;font-size:calc(14px*var(--fs));font-family:inherit;outline:none;width:100%;color:var(--ink)}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.attzone{border:1px dashed var(--line);border-radius:12px;padding:12px;text-align:center;color:var(--muted);font-size:calc(12.5px*var(--fs));background:var(--gray-bg);cursor:pointer}
.attzone:active{background:var(--line2)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .th{position:relative}
.thumbs .th img{width:60px;height:60px;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.thumbs .th .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#cf5a4c;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--bg)}
.btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:calc(15px*var(--fs));font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 5px 16px rgba(120,60,80,.2)}
.btn.ghost{background:var(--panel);color:var(--ink2);border:1px solid var(--line);margin-top:8px;font-weight:700}
.btn.danger{background:#fdecea;color:#cf5a4c;border:1px solid #f6d4ce;margin-top:8px;font-weight:700}
.hint{font-size:calc(11.5px*var(--fs));color:var(--muted);line-height:1.6;margin:6px 2px 10px}
.mng{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px;margin-bottom:8px}
.mng .nm{flex:1;font-weight:600;font-size:calc(13.5px*var(--fs))}
.mng .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.mng .x:active{background:var(--line2)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);background:rgba(40,20,30,.92);color:#fff;padding:11px 18px;border-radius:12px;font-size:calc(13.5px*var(--fs));font-weight:600;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:86%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,.lt:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.det-box{font-size:calc(14px*var(--fs));color:var(--ink);background:var(--gray-bg);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.det-att{display:flex;gap:8px;flex-wrap:wrap}
.det-att img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="topbar">
      <div class="title"><span class="logo">✅</span>待辦</div>
    </div>
  </header>

  <div class="listtabs" id="listtabs"></div>
  <div class="lv-bar" id="lvBar"></div>
  <div class="tasks" id="tasks"></div>
</div>

<nav class="bottombar">
  <button class="bb primary" onclick="openEditor()"><span class="ic">➕</span>新增</button>
  <button class="bb" onclick="shareTodo()"><span class="ic">📤</span>分享</button>
  <button class="bb" onclick="openSettings()"><span class="ic">⚙️</span>設定</button>
</nav>

<!-- 任務編輯 -->
<div class="mask" id="editMask" onclick="if(event.target===this)closeEditor()">
  <div class="sheet">
    <div class="close" onclick="closeEditor()">✕</div>
    <h3 id="editTitle">新增任務</h3>
    <div class="field"><label>主題（標題）</label><input type="text" id="eTitle" placeholder="例如：繳交報告" maxlength="80"></div>
    <div class="field"><label>內容</label><textarea id="eContent" placeholder="補充說明…"></textarea></div>
    <div class="field"><label>到期日</label><input type="date" id="eDue"></div>
    <div class="field">
      <label>附件（可貼上圖片 Ctrl/⌘+V 或點擊選取）</label>
      <div class="attzone" id="attZone" onclick="document.getElementById('eFile').click()">📎 點擊選取圖片，或直接貼上</div>
      <input type="file" id="eFile" accept="image/*" multiple style="display:none" onchange="onPickFiles(event)">
      <div class="thumbs" id="eThumbs"></div>
    </div>
    <button class="btn primary" onclick="saveEditor()">儲存</button>
    <button class="btn ghost" onclick="closeEditor()">取消</button>
  </div>
</div>

<!-- 設定與備份 -->
<div class="mask" id="setMask" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <div class="close" onclick="closeSettings()">✕</div>
    <h3>設定與備份</h3>
    <div class="field"><label>清單管理</label><div id="mngLists"></div>
      <div class="attzone" onclick="addList()" style="margin-top:6px">＋ 新增清單</div></div>
    <div class="hint">備份會包含全部清單、任務與附件（圖片）。附件以圖片形式存於本機，體積較大，請適量使用。</div>
    <button class="btn primary" onclick="exportTD()">⬇️ 匯出備份（本應用）</button>
    <button class="btn ghost" onclick="importTD()">⬆️ 匯入備份（取代）</button>
    <input type="file" id="tdFile" accept="application/json,.json" style="display:none" onchange="onTDFile(event)">
    <button class="btn danger" onclick="clearAll()">🗑️ 清除全部資料</button>
  </div>
</div>

<!-- 任務詳細 -->
<div class="mask" id="detMask" onclick="if(event.target===this)closeDetail()">
  <div class="sheet">
    <div class="close" onclick="closeDetail()">✕</div>
    <div style="font-size:calc(12px*var(--fs));font-weight:700;color:var(--muted);margin-bottom:2px">📄 詳情</div>
    <h3 id="detTitle" style="margin:2px 0 12px;font-size:calc(16px*var(--fs))"></h3>
    <div class="field"><label>內容</label><div id="detContent" class="det-box"></div></div>
    <div class="field"><label>到期日</label><div id="detDue" class="det-box"></div></div>
    <div class="field"><label>附件</label><div id="detAtts" class="det-att"></div></div>
    <button class="btn ghost" id="pinBtn" onclick="togglePin()">📌 置頂</button>
    <button class="btn primary" onclick="editFromDetail()">✏️ 編輯</button>
    <button class="btn ghost" onclick="closeDetail()">關閉</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var KEY='jless_todo_v1';
function uid(){return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function pad(n){return (n<10?'0':'')+n;}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function defaultState(){return {v:1,lists:[{id:uid(),name:'我的清單',tasks:[]}]};}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw){var d=JSON.parse(raw);if(d&&Array.isArray(d.lists)&&d.lists.length)return d;}}catch(e){}
  return defaultState();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('儲存失敗：可能圖片過大');}}
var S=load();
var curList=S.lists[0].id;
var editId=null, editAtts=[];

function curListObj(){for(var i=0;i<S.lists.length;i++)if(S.lists[i].id===curList)return S.lists[i];return S.lists[0];}

/* 清單切換 */
function renderTabs(){
  var w=document.getElementById('listtabs');w.innerHTML='';
  S.lists.forEach(function(l){
    var d=document.createElement('div');d.className='lt'+(l.id===curList?' on':'');
    d.innerHTML='<span>'+esc(l.name)+'</span>'+(S.lists.length>1?'<span class="cx" onclick="delList(\''+l.id+'\',event)">✕</span>':'');
    d.onclick=function(e){if(e.target.classList.contains('cx'))return;curList=l.id;renderTabs();renderTasks();};
    w.appendChild(d);
  });
  var a=document.createElement('div');a.className='add';a.textContent='＋';a.title='新增清單';a.onclick=addList;w.appendChild(a);
}
function addList(){
  var name=prompt('新清單名稱：','新清單');if(name===null)return;name=name.trim();if(!name)return;
  var l={id:uid(),name:name.slice(0,20),tasks:[]};S.lists.push(l);curList=l.id;save();renderTabs();renderTasks();toast('已新增清單');
}
function delList(id,ev){
  ev.stopPropagation();
  if(S.lists.length<=1){toast('至少保留一個清單');return;}
  var l=S.lists.filter(function(x){return x.id===id;})[0];
  if(!confirm('刪除清單「'+(l?l.name:'')+'」及其所有任務？'))return;
  S.lists=S.lists.filter(function(x){return x.id!==id;});curList=S.lists[0].id;save();renderTabs();renderTasks();
}

/* 任務列表 + 拖動排序 */
var dragId=null;
function soonCount(){
  var t0=new Date();t0.setHours(0,0,0,0);var lim=new Date(t0.getTime()+7*864e5);var n=0;
  S.lists.forEach(function(l){(l.tasks||[]).forEach(function(t){if(!t.done&&t.due){var dt=new Date(t.due+'T00:00:00');if(dt>=t0&&dt<=lim)n++;}});});
  return n;
}
function renderTasks(){
  var box=document.getElementById('tasks');var l=curListObj();
  if(!l.tasks.length){box.innerHTML='<div class="empty">這個清單還沒有任務。<br>按右下角「＋」新增。</div>';return;}
  var n=soonCount();
  box.innerHTML=n>0?'<div class="soonbar">⏰ 即將到期：'+n+' 項（7 日內）</div>':'';
  l.tasks.forEach(function(t){box.appendChild(taskEl(t));});
}
function taskEl(t){
  var done=t.done?' done':'';
  var due='';
  if(t.due){var over=(t.due<todayStr()&&!t.done);due='<span class="due'+(over?' over':'')+'">⏰ '+t.due+(over?' · 逾期':'')+'</span>';}
  var atts='';
  if(t.attach&&t.attach.length){atts='<div class="atts">'+t.attach.map(function(a){return '<img src="'+a.dataUrl+'" alt="'+(esc(a.name)||'圖')+'">';}).join('')+'</div>';}
  var d=document.createElement('div');d.className='task lv-item'+done;d.dataset.id=t.id;
  d.innerHTML=
    '<div class="chk" onclick="toggleDone(\''+t.id+'\')">'+(t.done?'✓':'')+'</div>'+
    '<div class="body" onclick="if(window.todoSorting)return;openDetail(\''+t.id+'\')"><div class="ti2">'+(t.pin?'<span class="pin-ic">📌</span>':'')+esc(t.title)+'</div>'+
    (t.content?'<div class="ct">'+esc(t.content)+'</div>':'')+due+atts+'</div>'+
    '<div class="op"><div class="lv-grip" title="拖動排序">⋮⋮</div>'+
    '<div class="x" onclick="delTask(\''+t.id+'\')">✕</div></div>';
  return d;
}
function toggleDone(id){
  var l=curListObj();var t=l.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;
  t.done=!t.done;save();renderTasks();
}
function delTask(id){
  if(!confirm('刪除這個任務？'))return;
  var l=curListObj();l.tasks=l.tasks.filter(function(x){return x.id!==id;});save();renderTasks();
}
/* 拖動排序：交由 listview.js 統一處理；此處只把新順序寫回資料 */
function reorderTasks(ids){
  var l=curListObj();
  var map={}; for(var i=0;i<l.tasks.length;i++) map[l.tasks[i].id]=l.tasks[i];
  var na=[]; for(var j=0;j<ids.length;j++){ if(map[ids[j]]){ na.push(map[ids[j]]); delete map[ids[j]]; } }
  for(var k=0;k<l.tasks.length;k++){ if(map[l.tasks[k].id]) na.push(l.tasks[k]); }
  l.tasks=na; save(); renderTasks();
}

/* 任務詳細 */
var detId=null;
function openDetail(id){
  var l=curListObj();var t=l.tasks.filter(function(x){return x.id===id;})[0];if(!t)return;detId=id;
  document.getElementById('detTitle').textContent=t.title;
  document.getElementById('pinBtn').textContent=(t.pin?'📌 取消置頂':'📌 置頂');
  document.getElementById('detContent').textContent=t.content?t.content:'（無內容）';
  document.getElementById('detDue').textContent=t.due?t.due+(t.due<todayStr()&&!t.done?' · 已逾期':''):'（無）';
  var boxes='';
  if(t.attach&&t.attach.length){boxes=t.attach.map(function(a){return '<img src="'+a.dataUrl+'" alt="'+(esc(a.name)||'圖')+'">';}).join('');}
  else boxes='（無）';
  document.getElementById('detAtts').innerHTML=boxes;
  document.getElementById('detMask').classList.add('show');
}
function closeDetail(){document.getElementById('detMask').classList.remove('show');}
function editFromDetail(){closeDetail();openEditor(detId);}
function togglePin(){
  var l=curListObj();var t=l.tasks.filter(function(x){return x.id===detId;})[0];if(!t)return;
  t.pin=!t.pin;
  if(t.pin){var i=l.tasks.indexOf(t);if(i>=0){l.tasks.splice(i,1);l.tasks.unshift(t);}}
  save();renderTasks();openDetail(detId);
}

/* 編輯器 */
function openEditor(id){
  editId=id||null;
  editAtts=[];
  if(id){
    var l=curListObj();var t=l.tasks.filter(function(x){return x.id===id;})[0];
    if(t){document.getElementById('editTitle').textContent='編輯任務';document.getElementById('eTitle').value=t.title;document.getElementById('eContent').value=t.content||'';document.getElementById('eDue').value=t.due||'';editAtts=(t.attach||[]).slice();}
  }else{
    document.getElementById('editTitle').textContent='新增任務';
    document.getElementById('eTitle').value='';document.getElementById('eContent').value='';document.getElementById('eDue').value='';
  }
  renderThumbs();
  document.getElementById('editMask').classList.add('show');
}
function closeEditor(){document.getElementById('editMask').classList.remove('show');}
function renderThumbs(){
  var w=document.getElementById('eThumbs');w.innerHTML='';
  editAtts.forEach(function(a,i){
    var d=document.createElement('div');d.className='th';
    d.innerHTML='<img src="'+a.dataUrl+'"><div class="rm" onclick="removeAtt('+i+')">✕</div>';
    w.appendChild(d);
  });
}
function removeAtt(i){editAtts.splice(i,1);renderThumbs();}
function onPickFiles(ev){
  var files=ev.target.files;if(!files)return;
  [].slice.call(files).forEach(function(f){if(f.type.indexOf('image')===0)readImg(f);});
  ev.target.value='';
}
function readImg(f){
  var r=new FileReader();r.onload=function(){editAtts.push({id:uid(),name:f.name,dataUrl:r.result});renderThumbs();};
  r.readAsDataURL(f);
}
// 貼上圖片
document.getElementById('attZone').addEventListener('paste',function(e){
  var items=(e.clipboardData||window.clipboardData).items||[];
  var got=false;
  for(var i=0;i<items.length;i++){if(items[i].type.indexOf('image')===0){var f=items[i].getAsFile();if(f){readImg(f);got=true;}}}
  if(got)e.preventDefault();
});
function saveEditor(){
  var title=document.getElementById('eTitle').value.trim();
  if(!title){toast('請填寫主題');return;}
  var content=document.getElementById('eContent').value.trim();
  var due=document.getElementById('eDue').value;
  var l=curListObj();
  if(editId){
    var t=l.tasks.filter(function(x){return x.id===editId;})[0];if(t){t.title=title;t.content=content;t.due=due;t.attach=editAtts;}
  }else{
    l.tasks.unshift({id:uid(),title:title,content:content,due:due,done:false,attach:editAtts});
  }
  save();closeEditor();renderTasks();toast('已儲存');
}

/* 設定 */
function openSettings(){renderMngLists();document.getElementById('setMask').classList.add('show');}
function closeSettings(){document.getElementById('setMask').classList.remove('show');}
function renderMngLists(){
  var b=document.getElementById('mngLists');b.innerHTML='';
  S.lists.forEach(function(l){var d=document.createElement('div');d.className='mng';
    d.innerHTML='<span class="nm">'+esc(l.name)+'（'+(l.tasks?l.tasks.length:0)+'）</span><span class="x" onclick="delList(\''+l.id+'\',event)">✕</span>';
    b.appendChild(d);});
}
function exportTD(){JLessBackup.export([KEY],'todo-backup-'+todayStr().replace(/-/g,'')+'.json');toast('已匯出備份');}
function importTD(){document.getElementById('tdFile').click();}
function onTDFile(ev){var f=ev.target.files&&ev.target.files[0];ev.target.value='';if(!f)return;
  JLessBackup.importFromFile(f,[KEY],function(ok,msg){
    if(!ok){alert(msg||'匯入失敗');return;}
    S=load();curList=S.lists[0].id;renderTabs();renderTasks();toast('已匯入');
  });}
function clearAll(){if(!confirm('清除全部清單與任務（含附件），無法復原。\n建議先匯出備份。確定？'))return;
  S=defaultState();curList=S.lists[0].id;save();renderTabs();renderTasks();toast('已清除');}

/* 分享清單（圖片 / 文字 / Excel） */
function drawTodoImage(l,cb){
  var sc=2, W=720, P=40, padT=30, padB=34, lineH=34, titleH=44;
  var rows=l.tasks.length;
  var H=padT+titleH+(rows?10+rows*lineH:40)+padB;
  var c=document.createElement('canvas');c.width=W*sc;c.height=H*sc;
  var x=c.getContext('2d');x.scale(sc,sc);
  x.fillStyle='#fffaf3';x.fillRect(0,0,W,H);
  x.textAlign='left';
  var accent=JLessShare.getVar('--accent','#c23b6a');
  x.fillStyle=accent;x.font='bold 30px sans-serif';x.fillText(JLessShare.clip(l.name,22),P,padT+30);
  var done=l.tasks.filter(function(t){return t.done;}).length;
  x.fillStyle='#967f89';x.font='15px sans-serif';x.fillText('共 '+l.tasks.length+' 項 · 已完成 '+done,P,padT+titleH+12);
  var yy=padT+titleH+30;
  if(!l.tasks.length){x.fillStyle='#967f89';x.font='17px sans-serif';x.fillText('（這個清單還沒有任務）',P,yy);}
  else l.tasks.forEach(function(t){
    x.fillStyle=t.done?'#b9a9b0':'#3b2530';x.font=(t.done?'17px':'bold 18px')+' sans-serif';
    x.fillText((t.done?'✓ ':'○ ')+JLessShare.clip(t.title,26)+(t.due?('   ⏰'+t.due):''),P,yy);
    yy+=lineH;
  });
  cb(c);
}
function todoToText(l){
  var done=l.tasks.filter(function(t){return t.done;}).length;
  var lines=['清單：'+l.name,'（共 '+l.tasks.length+' 項，已完成 '+done+'）',''];
  if(!l.tasks.length)lines.push('（這個清單還沒有任務）');
  else l.tasks.forEach(function(t){
    var s=(t.done?'[✓] ':'[ ] ')+t.title;
    if(t.due)s+='  ⏰'+t.due;
    lines.push(s);
    if(t.content)lines.push('    '+t.content.replace(/\n/g,'\n    '));
  });
  return lines.join('\n');
}
function todoToCSV(l){
  var rows=[['清單','標題','內容','到期日','狀態']];
  l.tasks.forEach(function(t){ rows.push([l.name,t.title,(t.content||''),t.due||'',t.done?'已完成':'未完成']); });
  return rows;
}
function shareTodo(){
  if(!window.JLessShare){toast('分享模組未載入');return;}
  var l=curListObj();
  JLessShare.openSheet({
    title:'分享「'+l.name+'」',
    image:function(){ drawTodoImage(l,function(c){ JLessShare.shareImage(c,'todo-'+l.name+'-'+todayStr()+'.png',function(ok){toast(ok?'已開啟分享':'已儲存圖片');}); }); },
    text:function(){ JLessShare.shareText('待辦 · '+l.name, todoToText(l), function(ok){toast(ok?'已開啟分享':'已複製文字');}); },
    excel:function(){ JLessShare.shareCSV(todoToCSV(l),'todo-'+l.name+'-'+todayStr()+'.csv', function(ok){toast(ok?'已開啟分享':'已匯出 CSV');}); }
  });
}

/* toast */
var toastTimer=null;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);}

/* init */
renderTabs();renderTasks();
